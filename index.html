        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. PROBLÉMATIQUE ET DÉFINITIONS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">PROBLÉMATIQUE CENTRALE</div>
    <p style="margin:0 0 12px 0;">Questions clés : <em>La connaissance est-elle devenue un enjeu de puissance au XXIe siècle ? Qui produit, contrôle et diffuse le savoir dans le monde contemporain ? La maîtrise de la connaissance est-elle un facteur d'inégalités entre États et entre individus ?</em></p>
    <p style="margin:0 0 12px 0;font-style:italic;font-size:15px;"><strong>Citation fondatrice :</strong> « La connaissance est en elle-même la puissance » — Francis Bacon (1597). Cette formule du philosophe anglais est toujours d'actualité : dans l'économie numérique du XXIe siècle, la maîtrise du savoir, des données et des technologies est le principal facteur de puissance.</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">Connaissance</td>
        <td style="padding:7px 10px;">Terme large qui recouvre : le <em>savoir</em> (connaissances théoriques accumulées), l'<em>information</em> (données organisées), le <em>renseignement</em> (information stratégique secrète), et la <em>transmission</em> (éducation, diffusion). Plus durable et structurée que l'information, la connaissance est un capital accumulable, transmissible et valorisable économiquement.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Économie de la connaissance</td>
        <td style="padding:7px 10px;">Concept du sociologue Peter Drucker (1969) : économie dans laquelle la ressource principale n'est plus le capital physique ou la force de travail, mais le savoir et l'information. Les secteurs les plus dynamiques — numérique, biotechnologies, IA, finance — sont tous fondés sur la connaissance. Elle est parfois qualifiée d'« or noir du XXIe siècle ».</td>
      </tr>
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;">Propriété intellectuelle</td>
        <td style="padding:7px 10px;">Ensemble des droits accordés aux créateurs sur leurs œuvres intellectuelles. Deux catégories : <strong>droit d'auteur</strong> (œuvres artistiques et littéraires) et <strong>propriété industrielle</strong> (brevets, marques, dessins). Les brevets confèrent un monopole temporaire d'exploitation (20 ans) en échange de la divulgation de l'invention. Outil de protection de l'innovation mais aussi outil de domination économique.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Brevet</td>
        <td style="padding:7px 10px;">Titre de propriété industrielle délivré par un office national ou international (USPTO aux USA, EPO en Europe, OMPI au niveau mondial). Garantit à son titulaire le droit exclusif d'exploiter une invention pendant 20 ans. Enjeu majeur : les brevets dans les secteurs stratégiques (semi-conducteurs, pharmacie, IA, 5G) sont au cœur des guerres technologiques entre grandes puissances.</td>
      </tr>
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;">Souveraineté numérique</td>
        <td style="padding:7px 10px;">Capacité d'un État (ou d'un groupe d'États) à maîtriser ses propres infrastructures numériques, ses données et ses technologies, sans dépendre de puissances étrangères. Enjeu croissant : la dépendance aux GAFAM américains ou aux technologies chinoises (Huawei) est perçue comme une vulnérabilité stratégique par les États.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Fracture numérique</td>
        <td style="padding:7px 10px;">Inégalité dans l'accès aux technologies numériques et à Internet, entre pays développés et pays en développement, mais aussi entre urbains et ruraux, entre générations, entre niveaux de revenus. En 2023, ~37% de la population mondiale n'a pas accès à Internet. Cette fracture reproduit et amplifie les inégalités économiques dans l'économie de la connaissance.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 2. GRANDES NOTIONS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">GRANDES NOTIONS À MAÎTRISER</div>

    <p style="font-weight:bold;margin-bottom:6px;">▶ Axe 1 — Produire et diffuser les savoirs : enjeux économiques et politiques</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;">
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">La production scientifique mondiale</td>
        <td style="padding:7px 10px;">La recherche scientifique est concentrée dans quelques pays : USA, Chine, UE, Japon. La Chine est devenue le 1er producteur d'articles scientifiques dans le monde (en nombre) depuis 2016, devant les USA. Les universités de rang mondial (classement de Shanghai) sont dominées par les Anglo-Saxons : sur les 20 premières, 17 sont américaines ou britanniques. Cette concentration géographique est un facteur d'inégalité entre États.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">La privatisation du savoir</td>
        <td style="padding:7px 10px;">Les grands éditeurs scientifiques (Elsevier, Springer, Wiley) contrôlent l'accès aux publications — derrière des paywalls coûteux que les universités des pays pauvres ne peuvent pas se payer. Les revues en accès ouvert (open access) se développent mais restent minoritaires. La recherche publique financée par l'impôt aboutit à des publications dont l'accès est ensuite payant — paradoxe majeur du système.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">La guerre des brevets</td>
        <td style="padding:7px 10px;">Les brevets sont devenus une arme stratégique dans la compétition économique mondiale. <strong>Apple vs Samsung :</strong> 7 ans de procès (2011–2018) sur des brevets de smartphones — des milliards de dollars en jeu. <strong>USA vs Chine :</strong> les USA accusent la Chine de voler des brevets et des secrets industriels (espionnage économique). En réponse, la Chine a massivement développé ses dépôts de brevets : 1er pays déposant à l'OMPI depuis 2019 (devant les USA). Huawei détient plus de brevets 5G que tout autre acteur mondial.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">L'accès au savoir : éducation et langue</td>
        <td style="padding:7px 10px;">L'anglais est la langue dominante de la production scientifique mondiale (>60% des publications). Les pays anglophones ont un avantage structurel. L'éducation est un vecteur essentiel de la diffusion du savoir : l'UNESCO fait de l'accès universel à l'éducation (ODD 4) un objectif mondial, mais en 2023, 244 millions d'enfants ne sont pas scolarisés. L'éducation est à la fois un enjeu de développement et un outil d'influence (bourses d'études, universités françaises à l'étranger, Instituts Confucius).</td>
      </tr>
    </table>

    <p style="font-weight:bold;margin-bottom:6px;">▶ Axe 2 — La connaissance comme enjeu géopolitique et stratégique</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">La guerre technologique USA / Chine</td>
        <td style="padding:7px 10px;">Depuis 2018, la rivalité technologique entre les USA et la Chine est au cœur des relations internationales. Axes principaux : <strong>semi-conducteurs</strong> (puces électroniques — tout dépend d'elles : IA, smartphones, armement), <strong>5G</strong> (Huawei exclu des réseaux occidentaux), <strong>IA</strong> (qui maîtrisera l'IA générale ?), <strong>données</strong> (TikTok interdit ou menacé aux USA pour accès chinois aux données). Les USA ont imposé des restrictions massives sur l'exportation de puces avancées vers la Chine (CHIPS Act 2022).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Les semi-conducteurs : nerf de la guerre technologique</td>
        <td style="padding:7px 10px;">Les puces électroniques (semi-conducteurs) sont à la base de tous les équipements numériques et militaires modernes. Chaîne de valeur mondialisée et hyperspécialisée : conception (Nvidia, AMD, Qualcomm — USA) → fabrication (TSMC — Taïwan, 92% des puces les plus avancées mondiales) → matières premières (silicium, terres rares). La dépendance envers TSMC et Taïwan est une vulnérabilité stratégique majeure pour les USA et l'UE. Si la Chine prenait le contrôle de Taïwan, elle contrôlerait la production mondiale de puces avancées. CHIPS Act (USA, 2022) : 52 milliards $ pour relocaliser la production de semi-conducteurs aux USA. European Chips Act (2023) : 43 milliards €.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">L'intelligence artificielle comme enjeu de puissance</td>
        <td style="padding:7px 10px;">L'IA est considérée par les grandes puissances comme la technologie la plus stratégique du XXIe siècle. Poutine (2017) : « Celui qui deviendra le leader de l'IA deviendra le maître du monde. » USA : dominants (OpenAI/ChatGPT, Google, Meta) mais inquiets de la montée de la Chine. Chine : plan national IA (2017) visant le leadership mondial d'ici 2030 — investissements massifs, données abondantes. UE : en retard industriellement mais pionnière dans la régulation (AI Act, 2024 — 1re loi mondiale sur l'IA). Applications militaires (drones autonomes, ciblage) et risques (désinformation profonde, surveillance de masse).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Les données : « le pétrole du XXIe siècle »</td>
        <td style="padding:7px 10px;">Les données numériques sont devenues la ressource la plus précieuse de l'économie numérique. Les GAFAM (Google, Amazon, Facebook/Meta, Apple, Microsoft) contrôlent des quantités astronomiques de données sur les comportements humains — base de leur puissance économique et de leur influence. En Chine, les données des utilisateurs sont accessibles à l'État (Loi sur la cybersécurité 2017). L'UE tente de réguler (RGPD 2018 — protection des données personnelles, Data Act 2023). Le cloud computing : 3 acteurs dominent (AWS/Amazon, Azure/Microsoft, Google Cloud) — enjeu de souveraineté pour les États.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">Le renseignement comme connaissance stratégique</td>
        <td style="padding:7px 10px;">Les services de renseignement ont toujours été des acteurs-clés de la production de connaissance stratégique. NSA (USA), GCHQ (RU), DGSE (France), FSB/SVR (Russie), MSS (Chine). Affaire Snowden (2013) : l'informaticien Edward Snowden révèle la surveillance massive de la NSA sur les communications mondiales y compris celles des alliés (écoutes de Merkel). Alliance des « Cinq Yeux » (USA, RU, Canada, Australie, Nouvelle-Zélande) : partage du renseignement en signals intelligence. Le renseignement économique et technologique (espionnage industriel) est devenu aussi important que le renseignement militaire.</td>
      </tr>
    </table>

    <p style="font-weight:bold;margin-bottom:6px;">▶ La désinformation comme enjeu de connaissance</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">Fake news et infox</td>
        <td style="padding:7px 10px;">La prolifération des fausses informations est une menace pour la démocratie et la connaissance collective. Amplifiée par les réseaux sociaux (vitesse de propagation, algorithmes de recommandation). Exemples : désinformation russe pendant la guerre en Ukraine (narratifs faux sur des « laboratoires biologiques »), COVID-19 et théories complotistes (vaccins, 5G), ingérence électorale (Cambridge Analytica pendant l'élection Trump 2016).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Désinformation d'État</td>
        <td style="padding:7px 10px;">La Russie (RT, Sputnik, fermes à trolls) et la Chine (réseau de comptes coordinés) utilisent la désinformation comme outil géopolitique. En France et en UE, RT a été interdit après l'invasion de l'Ukraine (mars 2022). Concept de « guerre informationnelle » : l'information est une arme dans les conflits contemporains (voir fiche Guerre et Paix). La distinction entre information, désinformation et propagande est devenue un enjeu démocratique central.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">Régulation de l'espace numérique</td>
        <td style="padding:7px 10px;">RGPD (UE, 2018) : protection des données personnelles — amende jusqu'à 4% du chiffre d'affaires mondial. DSA (Digital Services Act, UE, 2022) : obligations des grandes plateformes sur les contenus illicites et la désinformation. Chine : censure d'Internet (Grande Muraille), contrôle étatique des données. USA : faible régulation (1er amendement sur la liberté d'expression). Ces approches différentes reflètent des conceptions opposées du rapport entre connaissance, liberté et puissance publique.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. LES ACTEURS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">LES ACTEURS INCONTOURNABLES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;width:22%;">États-Unis</td>
        <td style="padding:8px 10px;">Dominent la production de connaissances : universités (Harvard, MIT, Stanford), GAFAM, Silicon Valley, NSA. 1er pays en dépenses de R&D (~3,5% du PIB). CHIPS Act (2022) pour relocaliser les semi-conducteurs. Restrictions à l'exportation de technologies vers la Chine. Mais aussi vulnérables (dépendance à TSMC, TikTok).</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Chine</td>
        <td style="padding:8px 10px;">Montée en puissance spectaculaire : 1er déposant de brevets à l'OMPI depuis 2019, 1er producteur d'articles scientifiques. Plan IA 2017 : objectif leadership mondial en 2030. Huawei : 1er déposant de brevets 5G mondiaux. Mais blocages : accès limité aux puces avancées (restrictions USA), manque de liberté académique. Grande Muraille numérique : Internet fermé, données contrôlées par l'État.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">Union européenne</td>
        <td style="padding:8px 10px;">En retard industriellement dans les technologies de rupture (IA, semi-conducteurs) mais pionnière dans la régulation : RGPD (2018), AI Act (2024), DSA (2022), European Chips Act (2023). Tente de trouver une « voie européenne » entre le modèle américain (libertarien) et le modèle chinois (autoritaire). Programme Horizon Europe : financement de la recherche scientifique commune.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">GAFAM et BATX</td>
        <td style="padding:8px 10px;"><strong>GAFAM</strong> (Google, Amazon, Facebook/Meta, Apple, Microsoft) : dominent les données, l'IA, le cloud, la publicité numérique — chiffres d'affaires supérieurs au PIB de nombreux États. <strong>BATX</strong> (Baidu, Alibaba, Tencent, Xiaomi) : équivalents chinois. Ces entreprises sont des acteurs privés qui possèdent plus de données et parfois plus de capacités technologiques que des États.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">TSMC</td>
        <td style="padding:8px 10px;">Taiwan Semiconductor Manufacturing Company — fabrique 92% des puces les plus avancées du monde. Entreprise taïwanaise privée dont le destin est au cœur de la géopolitique mondiale. Si Taïwan était pris par la Chine, TSMC tomberait sous contrôle chinois — catastrophe stratégique pour les USA et l'UE. TSMC construit des usines aux USA (Arizona) et en Europe (Dresde) sous pression géopolitique.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Universités et centres de recherche</td>
        <td style="padding:8px 10px;">Le classement de Shanghai (ARWU) classe les universités mondiales : sur les 20 premières, 17 sont américaines ou britanniques. MIT, Harvard, Stanford, Caltech. La mobilité internationale des chercheurs (« fuite des cerveaux » des pays du Sud vers le Nord) renforce les inégalités de connaissance. L'influence d'une université est aussi une forme de soft power (ex. : étudiants étrangers formés aux USA qui retournent dans leurs pays avec une vision pro-américaine).</td>
      </tr>
    </table>

  <!-- ═══════════ 4. ÉTUDES DE CAS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">ÉTUDES DE CAS INCONTOURNABLES</div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La guerre des semi-conducteurs USA / Chine (depuis 2018)</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> 2018 : les USA placent Huawei sur leur liste noire (Entity List) — interdiction de lui vendre des composants américains ou des produits fabriqués avec des technologies américaines. Impact immédiat : Huawei ne peut plus utiliser les services Google sur ses smartphones (Maps, Play Store) et perd l'accès aux puces TSMC (qui utilise des équipements américains). 2022 : CHIPS and Science Act — 52 milliards $ pour relocaliser la fabrication de semi-conducteurs aux USA + restrictions d'export des puces avancées vers la Chine. Objectif : empêcher la Chine d'atteindre l'autonomie technologique dans ce secteur clé. La Chine investit massivement pour développer ses propres capacités (SMIC), mais reste en retard de plusieurs générations technologiques.<br><strong>Ce qu'il illustre :</strong> La connaissance technologique comme enjeu géopolitique central ; les interdépendances mondiales comme arme économique ; la course à l'autonomie technologique.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">L'affaire Snowden (2013) — La surveillance mondiale dévoilée</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Edward Snowden, contractuel de la NSA, révèle en juin 2013 (au Guardian et au Washington Post) l'existence de programmes de surveillance massive : PRISM (collecte de données auprès de Google, Facebook, Apple…) et XKeyscore (analyse des communications mondiales). Révélation que la NSA espionnait les communications d'Angela Merkel (chancelière allemande) et de 34 autres dirigeants mondiaux. Snowden trouve refuge à Moscou. Ces révélations déclenchent un débat mondial sur la vie privée, la souveraineté numérique et les limites de la surveillance d'État. L'UE renforce sa législation sur les données (RGPD 2018).<br><strong>Ce qu'il illustre :</strong> Le renseignement comme outil de puissance et d'espionnage entre alliés ; la tension vie privée/sécurité nationale ; la souveraineté numérique des États.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16ék;">
        <div style="font-weight:bold;font-size:15px;">Les brevets sur les vaccins COVID-19 — La propriété intellectuelle face à une urgence mondiale</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Les vaccins contre la COVID-19 (Pfizer/BioNTech, Moderna, AstraZeneca) ont été développés en un temps record grâce à des investissements publics massifs (USA, UE), mais les brevets ont été conservés par les entreprises pharmaceutiques. Résultat : prix élevés, difficultés d'accès pour les pays pauvres. L'Inde et l'Afrique du Sud ont demandé à l'OMC (Organisation mondiale du commerce) une levée temporaire des brevets sur les vaccins COVID (TRIPS waiver). USA (Biden 2021) soutient la demande. L'UE et les laboratoires pharmaceutiques s'y opposent. Un accord limité est trouvé en 2022 — largement insuffisant selon les ONG. Le COVAX (mécanisme ONU de distribution équitable) ne réussit pas à vacciner équitablement le monde : les pays riches vaccinent massivement, les pays pauvres attendent.<br><strong>Ce qu'il illustre :</strong> La tension entre propriété intellectuelle privée et bien commun mondial ; l'injustice des systèmes de connaissance dans les crises mondiales ; les limites de la gouvernance internationale de la santé.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">ChatGPT et l'IA générative — Révolution ou enjeu de puissance ?</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Novembre 2022 : OpenAI (financement initial de Microsoft) lance ChatGPT — 100 millions d'utilisateurs en 2 mois, record mondial. L'IA générative produit du texte, des images, du code, de la musique avec une qualité inédite. Enjeux géopolitiques : (1) Domination américaine (OpenAI, Google/Gemini, Meta/LLaMA). (2) Concurrence chinoise (Baidu/Ernie Bot, mais bridé par la censure). (3) Régulation : UE — AI Act (2024), 1re loi mondiale. (4) Risques : désinformation massive (deepfakes), biais algorithmiques, impact sur l'emploi, concentration du pouvoir dans les mains de quelques entreprises. En France, Mistral AI est présentée comme un espoir d'autonomie européenne en IA.<br><strong>Ce qu'il illustre :</strong> La connaissance artificielle comme enjeu de puissance ; les tensions régulation/innovation ; la concentration de la puissance technologique.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La Chine et les Instituts Confucius — Le soft power de la connaissance</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Les Instituts Confucius sont des centres culturels et éducatifs chinois implantés dans des universités du monde entier (>500 dans 150 pays au pic). Financés par l'État chinois (Hanban/Institut Confucius), ils enseignent la langue et la culture chinoises. Critique croissante : soupçonnés de censurer les débats sur Taïwan, le Tibet, Tiananmen, le Xinjiang ; d'exercer une influence sur la liberté académique. USA, Suède, Canada ont fermé beaucoup d'Instituts Confucius depuis 2019–2021. Symétrique des Alliances françaises (France) ou des Goethe Instituts (Allemagne), mais avec une dimension de contrôle politique plus directe.<br><strong>Ce qu'il illustre :</strong> La connaissance comme outil de soft power et d'influence culturelle ; les limites de ce soft power quand il est perçu comme un outil de surveillance ; la compétition entre puissances pour la maîtrise des récits.</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. TENSIONS ET DÉBATS ═══════════ -->

    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;width:35%;">Connaissance ouverte vs connaissance privatisée</td>
        <td style="padding:8px 10px;">Internet a permis une diffusion sans précédent du savoir (Wikipédia, MOOCs, open access). Mais les grandes plateformes privatisent les données, les éditeurs privatisent les publications scientifiques, les entreprises privatisent les brevets. La tension entre connaissance comme bien commun et connaissance comme marchandise est au cœur de toutes les politiques de l'IA, des brevets et de la recherche.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Liberté vs contrôle de l'information</td>
        <td style="padding:8px 10px;">Trois modèles en compétition : le modèle américain (liberté maximale, peu de régulation — mais GAFAM toutes-puissantes), le modèle chinois (contrôle étatique total — mais innovation bridée), le modèle européen (régulation pour protéger la vie privée et la démocratie — mais risque de retard industriel). Quelle approche est la plus compatible avec la démocratie et l'innovation ?</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;">La fracture numérique nord-sud</td>
        <td style="padding:8px 10px;">37% de la population mondiale sans Internet. L'économie de la connaissance amplifie les inégalités : les pays qui maîtrisent la production de connaissance (USA, Chine, UE) dominent l'économie mondiale. Les pays du Sud restent dépendants des technologies importées et n'en contrôlent pas les règles. La fracture numérique est aussi une fracture de puissance.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">L'IA comme menace ou opportunité</td>
        <td style="padding:8px 10px;">Débat entre optimistes (l'IA résoudra le changement climatique, les maladies, la pauvreté) et pessimistes (l'IA concentre le pouvoir, supprime des emplois, produit de la désinformation massive, peut être utilisée pour des armes autonomes). La régulation de l'IA (AI Act européen, Executive Order Biden 2023) est une tentative de naviguer entre ces deux horizons — mais la course technologique pourrait dépasser les régulateurs.</td>
      </tr>

<div class="fiche-ses" style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

<!-- ══════════════════════════════════════

<div class="accord-section">

    <div class="accord-fc-row accord-fc-row-h1">

        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','I.A')">🃏 Flashcards I.A</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Croissance économique</td><td>Augmentation <strong>durable</strong> (sur une longue période, par opposition à l'expansion, qui est de court terme) de la production de biens et de services d'une économie. Elle se mesure par le <strong>taux de variation annuel du PIB en volume</strong>. Elle est un phénomène <strong>quantitatif</strong>, à distinguer du développement, qui est qualitatif.</td></tr>
                  <tr><td>Expansion / récession / dépression</td><td><strong>Expansion</strong> : hausse de la production sur une courte période (phase ascendante du cycle). <strong>Récession</strong> : baisse du PIB en volume pendant au moins deux trimestres consécutifs. <strong>Dépression</strong> : baisse durable et profonde de la production (ex. : années 1930).</td></tr>
                  <tr><td>Production</td><td>Activité économique socialement organisée qui consiste à créer des biens et des services à partir de facteurs de production. On distingue la production <strong>marchande</strong> (vendue sur un marché à un prix couvrant au moins les coûts) et <strong>non marchande</strong> (fournie gratuitement ou à un prix inférieur à la moitié du coût de production, par les administrations publiques notamment).</td></tr>
                  <tr><td>Produit intérieur brut (PIB)</td><td>Agrégat de la comptabilité nationale qui mesure la richesse produite pendant une année par les unités résidentes sur le territoire national, qu'elles soient nationales ou étrangères. PIB = somme des valeurs ajoutées + impôts sur les produits − subventions sur les produits. Il est « brut » car il ne déduit pas l'usure du capital (amortissement).</td></tr>
                  <tr><td>Valeur ajoutée (VA)</td><td>Richesse réellement créée par une unité de production au cours du processus de production : VA = valeur de la production − valeur des consommations intermédiaires. Raisonner en VA évite de compter plusieurs fois la même richesse (double compte).</td></tr>
                  <tr><td>Consommations intermédiaires</td><td>Biens et services détruits ou transformés au cours du processus de production (matières premières, énergie, services achetés à d'autres entreprises).</td></tr>
                  <tr><td>PIB en valeur (nominal)</td><td>PIB évalué aux <strong>prix courants</strong>, c'est-à-dire aux prix de l'année considérée. Sa variation mêle l'évolution des quantités produites et celle des prix.</td></tr>
                  <tr><td>PIB en volume (réel)</td><td>PIB évalué aux <strong>prix constants</strong> d'une année de référence, donc corrigé de l'inflation. Sa variation ne reflète que l'évolution des quantités produites : c'est lui qui mesure la croissance. En approximation : taux de croissance en volume ≈ taux de croissance en valeur − taux d'inflation.</td></tr>
                  <tr><td>Inflation</td><td>Hausse générale et durable du niveau des prix, qui se traduit par une baisse du pouvoir d'achat de la monnaie. On la mesure en France par l'indice des prix à la consommation (IPC) de l'INSEE.</td></tr>
                  <tr><td>PIB par habitant</td><td>Rapport entre le PIB et la population totale. C'est un indicateur de la <strong>richesse moyenne</strong> produite par habitant, utilisé pour approcher le niveau de vie moyen et comparer des pays de tailles différentes. Comparé entre pays, il est souvent exprimé en <strong>parité de pouvoir d'achat</strong> (PPA) pour neutraliser les différences de prix.</td></tr>
                  <tr><td>Revenus primaires</td><td>Revenus directement issus de la participation à la production (revenus d'activité : salaires, cotisations sociales, revenu mixte des indépendants) ou de la propriété d'un patrimoine (intérêts, dividendes, loyers). La valeur ajoutée se partage entre la rémunération du travail (salaires et cotisations) et celle du capital (<strong>excédent brut d'exploitation</strong>, EBE).</td></tr>
                  <tr><td>Niveau de vie</td><td>Au sens large, quantité de biens et de services qu'un individu ou un ménage peut se procurer avec son revenu. Au sens de l'INSEE : revenu disponible du ménage divisé par le nombre d'unités de consommation (UC). Il progresse en moyenne quand le PIB augmente plus vite que la population.</td></tr>
                  <tr><td>Développement</td><td>Ensemble des transformations économiques, sociales, démographiques et culturelles (santé, éducation, réduction de la pauvreté, allongement de l'espérance de vie) qui accompagnent la croissance et améliorent durablement le bien-être d'une population. Il est mesuré notamment par l'<strong>IDH</strong> (indice de développement humain : revenu par habitant, espérance de vie, durée de scolarisation).</td></tr>
                  <tr><td>Révolution industrielle</td><td>Ensemble de transformations techniques, économiques et sociales qui fait passer une société à dominante agricole et artisanale à une société industrielle : mécanisation, nouvelles sources d'énergie (charbon et machine à vapeur, puis électricité et pétrole), usines, salariat. Elle débute en Angleterre à la fin du XVIII<sup>e</sup> siècle et marque le début de la croissance moderne.</td></tr>
                  <tr><td>Économie de marché</td><td>Économie dans laquelle l'essentiel des décisions de production et d'échange est coordonné par les marchés, c'est-à-dire par la confrontation des offres et des demandes qui détermine les prix.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. Pourquoi la croissance est-elle un phénomène récent ?</strong></p><ol class="meca">
                  <li>Pendant des millénaires, la production mondiale et le PIB par habitant ont quasiment stagné : les rares gains de production étaient absorbés par la hausse de la population.</li>
                  <li>À partir de la révolution industrielle, la croissance « décolle » : d'abord en <strong>Angleterre</strong>, puis en France, aux Pays-Bas, en Allemagne et aux États-Unis.</li>
                  <li>Les pays qui ont démarré plus tard (Chine, Inde…) ont pris du retard : même avec des taux de croissance élevés aujourd'hui, leur niveau de vie par tête reste inférieur.</li>
                  <li>Des écarts de croissance au départ produisent donc de véritables <strong>divergences</strong> de niveau de vie, d'accès à l'éducation et aux soins.</li>
                </ol><p class="bloc-p"><strong>2. Pourquoi la croissance compte-t-elle autant ?</strong></p><ol class="meca">
                  <li>Le PIB est la somme des valeurs ajoutées.</li>
                  <li>La valeur ajoutée rémunère les facteurs de production (salaires, EBE).</li>
                  <li>Donc une hausse du PIB = une hausse globale des revenus distribués.</li>
                  <li>Si le PIB augmente plus vite que la population, le PIB par tête et donc le <strong>niveau de vie moyen</strong> augmentent.</li>
                  <li>Avec des choix de politiques publiques adaptés, la croissance permet aussi de financer l'éducation et la santé, indicateurs de progrès humain.</li>
                </ol><p class="bloc-p"><strong>3. Pourquoi la croissance est-elle cumulative ?</strong> Chaque année, le taux de croissance s'applique à un PIB déjà plus élevé que l'année précédente (comme des intérêts composés). De faibles écarts de taux de croissance, répétés sur longue période, produisent donc des écarts considérables de niveau de vie.</p>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>🧮 Calculs et formules</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="formule">Taux de croissance (%) = (PIB<sub>année n</sub> − PIB<sub>année n−1</sub>) / PIB<sub>année n−1</sub> × 100</div><div class="exemple"><strong>Exemple :</strong> le PIB passe de 1 000 à 1 020 Md€ → (1 020 − 1 000) / 1 000 × 100 = <strong>+2 %</strong>.</div><div class="formule">Valeur après n années = valeur de départ × (1 + t)<sup>n</sup></div><div class="exemple"><strong>Effet cumulatif :</strong> un revenu par tête de 1 000 € progresse, en 15 ans, de <strong>77 €</strong> avec 0,5 % de croissance par an (1 000 × 1,005<sup>15</sup> ≈ 1 078 €), mais de <strong>800 €</strong> avec 4 % par an (1 000 × 1,04<sup>15</sup> ≈ 1 801 €).</div><div class="formule">Temps de doublement du PIB ≈ 70 / taux de croissance annuel (en %)</div><table class="ses-table">
                  <tr><td>2 % par an</td><td>Le PIB double en environ <strong>35 ans</strong></td></tr>
                  <tr><td>1 % par an</td><td>Le PIB double en environ <strong>70 ans</strong></td></tr>
                  <tr><td>0,5 % par an</td><td>Le PIB double en environ <strong>139 ans</strong></td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📊 Chiffres et exemples</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>France 2019</td><td>Croissance du PIB de <strong>+1,5 %</strong> (OCDE).</td></tr>
                  <tr><td>France 2020</td><td>Prévision OCDE de <strong>−11,4 %</strong> à cause du confinement (COVID-19) : un taux négatif signifie une <em>baisse</em> du PIB (le recul finalement constaté a été proche de 8 %).</td></tr>
                  <tr><td>Depuis 1820</td><td>Le PIB par habitant mondial a été multiplié par plus de 10, alors qu'il avait presque stagné pendant les deux millénaires précédents (données Maddison / Our World in Data).</td></tr>
                  <tr><td>Ordre d'entrée dans la croissance</td><td>Angleterre → France, Pays-Bas, Allemagne → États-Unis… La Chine et l'Inde ne décollent vraiment qu'au XX<sup>e</sup> siècle.</td></tr>
                </table>
              </div>
            </div>

            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">

                  <li><strong>Graphique 2 (Our World in Data)</strong> : le PIB mondial est presque plat pendant deux millénaires puis explose à partir du XIX<sup>e</sup> siècle → la croissance est un phénomène <strong>récent</strong>.</li>
                  <li><strong>Graphique 3</strong> : PIB par tête en dollars constants de 2011 → les pays qui ont démarré tôt (Royaume-Uni, États-Unis) ont aujourd'hui un niveau de vie bien plus élevé : effet <strong>cumulatif</strong>.</li>
                </ul>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚠️ Pièges à éviter</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="piege"><strong>⚠ PIB nominal ≠ PIB réel.</strong> Si le PIB en valeur augmente de 5 % et les prix de 3 %, la croissance réelle est d'environ 2 %. On parle toujours du PIB <strong>en volume</strong>.</div><div class="piege"><strong>⚠ Une baisse du taux de croissance n'est pas une baisse du PIB.</strong> Passer de +3 % à +1 % signifie que le PIB augmente <em>moins vite</em>, mais il augmente encore. Il ne baisse que si le taux est <strong>négatif</strong> (récession).</div><div class="piege"><strong>⚠ Points de pourcentage ≠ pourcentage.</strong> Passer de 2 % à 3 % de croissance, c'est +1 <strong>point</strong> de %, pas +1 %.</div><div class="piege"><strong>⚠ Croissance ≠ développement.</strong> La croissance est quantitative (hausse du PIB) ; le développement est qualitatif (santé, éducation, réduction de la pauvreté). La croissance peut financer le développement mais ne le garantit pas.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>✅ À retenir</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="aretenir">• La croissance = hausse durable du <strong>PIB en volume</strong>, mesurée par un taux de variation.<br>• Elle est <strong>récente</strong> (≈ 200 ans, depuis la révolution industrielle) et <strong>cumulative</strong> (effet « intérêts composés »).<br>• Elle est un préalable à la hausse des niveaux de vie car le PIB, somme des VA, rémunère le travail et le capital.<br>• De petits écarts de taux de croissance → de grands écarts de niveau de vie à long terme.</div>
              </div>

    <!-- I.B -->
    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>B) L'accumulation des facteurs de production</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','I.B')">🃏 Flashcards I.B</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Facteurs de production</td><td>Ressources combinées dans le processus de production pour obtenir des biens et des services. On en retient traditionnellement deux : le <strong>facteur travail</strong> (l'activité humaine rémunérée consacrée à la production) et le <strong>facteur capital</strong> (l'ensemble des biens de production).</td></tr>
                  <tr><td>Combinaison productive</td><td>Association, en proportions déterminées, des facteurs travail et capital par une unité de production. Elle peut être plus ou moins intensive en travail ou en capital, et les facteurs sont en partie substituables et en partie complémentaires.</td></tr>
                  <tr><td>Population active</td><td>Ensemble des personnes qui ont un emploi (actifs occupés) et des chômeurs (au sens du BIT). Sa taille dépend de la démographie et des comportements d'activité.</td></tr>
                  <tr><td>Taux d'activité</td><td>Rapport entre la population active et la population totale correspondante (souvent les 15-64 ans), exprimé en %. La hausse du taux d'activité des femmes depuis les années 1960 a accru la quantité de travail disponible.</td></tr>
                  <tr><td>Taux d'emploi</td><td>Rapport entre le nombre de personnes ayant un emploi et la population totale correspondante (souvent les 15-64 ans). Il mesure la capacité d'une économie à utiliser sa main-d'œuvre potentielle.</td></tr>
                  <tr><td>Quantité de travail</td><td>Volume total de travail utilisé dans la production = nombre d'actifs occupés × durée moyenne du travail. Elle se mesure en <strong>heures travaillées</strong> et dépend donc de la population active, du chômage et de la durée du travail.</td></tr>
                  <tr><td>Capital fixe / capital circulant</td><td>Le <strong>capital fixe</strong> regroupe les biens de production durables utilisés pendant plus d'un an (machines, bâtiments, logiciels, brevets) ; il s'use progressivement (amortissement). Le <strong>capital circulant</strong> regroupe les biens détruits ou transformés au cours d'un seul cycle de production (matières premières, énergie) : ce sont les consommations intermédiaires.</td></tr>
                  <tr><td>Capital technique (physique)</td><td>Ensemble des moyens de production matériels (et immatériels, comme les logiciels) produits par l'homme et utilisés pour produire d'autres biens et services. Il regroupe le capital fixe et le capital circulant.</td></tr>
                  <tr><td>Investissement</td><td>Dépense qui vise à accroître ou à renouveler le stock de capital d'une unité économique. On distingue l'investissement de <strong>remplacement</strong> (renouveler le capital usé), de <strong>capacité</strong> (produire davantage) et de <strong>productivité</strong> (produire plus efficacement). Il peut être matériel ou immatériel (R&D, formation, logiciels).</td></tr>
                  <tr><td>Formation brute de capital fixe (FBCF)</td><td>Mesure de l'investissement en comptabilité nationale : valeur des biens durables acquis par les unités productrices résidentes pour être utilisés au moins un an dans le processus de production. Elle est « brute » car elle inclut le remplacement du capital usé.</td></tr>
                  <tr><td>Capital humain</td><td>Ensemble des connaissances, qualifications, compétences, expériences et de l'état de santé qu'un individu accumule et qui accroissent sa productivité, donc ses revenus futurs. Il s'acquiert par un investissement (éducation, formation) qui a un coût (dépenses et revenus auxquels on renonce). Concept formalisé par Gary Becker (1964).</td></tr>
                  <tr><td>Intensité capitalistique</td><td>Rapport entre le stock de capital fixe et le nombre de travailleurs (ou d'heures travaillées) : c'est la quantité de capital dont dispose en moyenne chaque travailleur. Sa hausse traduit une substitution du capital au travail.</td></tr>
                  <tr><td>Accumulation des facteurs</td><td>Augmentation, dans le temps, des quantités de facteurs de production utilisées : hausse de la quantité de travail et hausse du stock de capital par l'investissement. C'est la première source de croissance.</td></tr>
                  <tr><td>Croissance extensive</td><td>Croissance obtenue par l'augmentation des <strong>quantités</strong> de facteurs de production utilisées, à efficacité inchangée. Elle s'oppose à la croissance intensive, fondée sur les gains de productivité.</td></tr>
                  <tr><td>Rendements factoriels décroissants</td><td>Loi selon laquelle, lorsqu'on accroît la quantité d'un seul facteur de production en maintenant l'autre constant, la production supplémentaire obtenue grâce à chaque unité ajoutée (la <strong>productivité marginale</strong>) finit par diminuer. La production totale continue d'augmenter, mais de moins en moins vite.</td></tr>
                  <tr><td>Productivité marginale</td><td>Supplément de production obtenu grâce à l'utilisation d'une unité supplémentaire d'un facteur de production, la quantité de l'autre facteur restant inchangée.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. L'accumulation des facteurs fait augmenter le PIB</strong></p><ol class="meca">
                  <li>Plus de travail : hausse de la population, du taux d'activité féminin, allongement de la vie active…</li>
                  <li>Plus de capital : investissement dans de nouvelles machines, bâtiments, logiciels (FBCF).</li>
                  <li>Plus de facteurs utilisés → plus de biens et services produits → hausse du PIB.</li>
                </ol><p class="bloc-p"><strong>2. Mais cette source bute sur les rendements décroissants</strong></p><ol class="meca">
                  <li>À court terme, un facteur augmente alors que l'autre reste fixe (ex. : on embauche mais le nombre de fours reste le même).</li>
                  <li>Au début, la productivité du facteur ajouté augmente (division du travail, spécialisation).</li>
                  <li>Puis chaque unité supplémentaire rapporte de moins en moins : la production totale augmente à <strong>taux décroissant</strong>.</li>
                  <li>Conclusion : accumuler des facteurs est une source <strong>nécessaire mais limitée</strong> de croissance ; sans amélioration de l'efficacité des facteurs, la croissance s'essouffle.</li>
                </ol>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📊 Chiffres et exemples</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="exemple"><strong>La pizzeria (exemple du cours) :</strong> passer de 1 à 2 travailleurs augmente fortement la production (l'un fait les pizzas, l'autre vend) ; un 3<sup>e</sup> se spécialise dans la cuisson et l'emballage. Mais un 4<sup>e</sup>, un 5<sup>e</sup>, un 6<sup>e</sup> travailleur ajoutent de moins en moins : le four a une contenance limitée, les salariés se gênent. De même, multiplier les fours sans cuisiniers ne sert à rien : il faut des travailleurs pour faire fonctionner les machines.</div><div class="exemple"><strong>L'URSS, « transpiration » plutôt qu'« inspiration » (Paul Krugman) :</strong> dans les années 1950-1960, la forte croissance soviétique s'explique presque entièrement par la mobilisation massive des facteurs (exode rural, travail des femmes, allongement des horaires, investissements énormes dans les usines). Faute de gains d'efficacité, elle ne pouvait que ralentir — ce qui s'est produit à partir des années 1970.</div><table class="ses-table">
                  <tr><td>Zone euro 2005-2016</td><td>Croissance moyenne de 0,9 %/an : intensité capitalistique ≈ +0,5 pt, population ≈ +0,4 pt, taux d'emploi ≈ +0,1 pt, durée du travail ≈ −0,2 pt, PGF ≈ +0,1 pt (Bergeaud, Cette, Lecat).</td></tr>
                  <tr><td>France</td><td>La FBCF représente environ un quart du PIB ; la dépense intérieure d'éducation environ 6,5 à 7 % du PIB.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚠️ Pièges à éviter</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="piege"><strong>⚠ Rendements décroissants ≠ baisse de la production.</strong> La production continue d'augmenter, mais de moins en moins vite à chaque unité de facteur ajoutée.</div><div class="piege"><strong>⚠ Le capital humain est un capital</strong> (on investit pour l'accumuler) mais il concerne le <strong>facteur travail</strong> : il améliore sa qualité, donc son efficacité.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>✅ À retenir</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="aretenir">• Première source de croissance : l'<strong>accumulation</strong> des facteurs travail et capital (croissance extensive).<br>• Elle se heurte à la <strong>loi des rendements factoriels décroissants</strong>.<br>• Pour que la croissance dure, il faut améliorer l'<strong>efficacité</strong> des facteurs → c'est le rôle de la productivité et du progrès technique (I.C).</div>
              </div>
            </div>
          </div>

    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>C) La productivité globale des facteurs et le progrès technique</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','I.C')">🃏 Flashcards I.C</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Productivité</td><td>Rapport entre une quantité produite (en volume) ou une valeur ajoutée (en valeur) et la quantité de facteurs utilisés pour l'obtenir. Elle mesure l'<strong>efficacité</strong> avec laquelle les facteurs de production sont combinés.</td></tr>
                  <tr><td>Productivité apparente du travail</td><td>Rapport entre la production (ou la valeur ajoutée) et la quantité de travail utilisée. Elle se calcule <strong>par tête</strong> (par actif occupé) ou <strong>par heure</strong> (productivité horaire), cette dernière permettant de comparer des économies dont la durée du travail diffère. Elle est dite « apparente » car elle attribue au seul travail une production qui résulte aussi du capital : elle augmente par exemple quand chaque travailleur dispose de plus de machines.</td></tr>
                  <tr><td>Productivité apparente du capital</td><td>Rapport entre la production (ou la valeur ajoutée) et le stock de capital utilisé. Elle est elle aussi « apparente » car elle ignore la contribution du travail.</td></tr>
                  <tr><td>Productivité globale des facteurs (PGF)</td><td>Efficacité de la <strong>combinaison</strong> des facteurs travail et capital, prise dans son ensemble. Elle ne se mesure pas directement : on l'obtient par différence, comme la part de la croissance de la production qui n'est pas expliquée par la croissance des quantités de travail et de capital (c'est un <strong>résidu</strong>). Elle reflète principalement le progrès technique au sens large, mais aussi la qualité des facteurs (éducation, âge du capital), l'organisation du travail et le cadre institutionnel.</td></tr>
                  <tr><td>Résidu (de Solow)</td><td>Part de la croissance qui reste inexpliquée une fois retirées les contributions de l'augmentation des quantités de travail et de capital. Il correspond à la PGF. Moses Abramovitz (1956) l'a qualifié de « mesure de notre ignorance ».</td></tr>
                  <tr><td>Gains de productivité</td><td>Augmentation de la productivité : l'économie produit davantage avec la même quantité de facteurs, ou autant avec moins de facteurs. Ils peuvent être répartis entre hausse des salaires, hausse des profits, baisse des prix ou baisse du temps de travail.</td></tr>
                  <tr><td>Progrès technique</td><td>Ensemble des innovations (de produit, de procédé, d'organisation) qui transforment les méthodes de production et les produits et qui permettent d'accroître l'efficacité des facteurs de production. Au sens large retenu dans la mesure de la PGF, il inclut aussi l'amélioration de la qualité des facteurs, de l'organisation et des institutions.</td></tr>
                  <tr><td>Croissance intensive</td><td>Croissance obtenue grâce aux <strong>gains de productivité</strong>, c'est-à-dire à une utilisation plus efficace des facteurs, et non à l'augmentation de leurs quantités. C'est la forme dominante de la croissance des pays développés à long terme.</td></tr>
                  <tr><td>Décomposition comptable de la croissance</td><td>Méthode qui répartit le taux de croissance du PIB entre les <strong>contributions</strong>, exprimées en points de pourcentage, de l'augmentation de la quantité de travail, de celle du capital et de la PGF (le résidu). La somme des contributions est égale au taux de croissance du PIB.</td></tr>
                  <tr><td>Contribution à la croissance</td><td>Part du taux de croissance du PIB imputable à un facteur, exprimée en <strong>points de pourcentage</strong>. Ex. : sur une croissance de 2 %, une contribution de la PGF de 1 point signifie que la PGF explique la moitié de la croissance.</td></tr>
                  <tr><td>Diffusion des technologies</td><td>Processus par lequel une innovation se répand dans l'ensemble de l'économie (entreprises, secteurs, pays). Les effets de l'électricité et des TIC sur la productivité dépendent de leur diffusion, pas seulement de leur invention.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. La croissance dépend de la quantité ET de l'efficacité des facteurs</strong></p><ol class="meca">
                  <li>On mesure la contribution de la hausse de la quantité de travail et de capital à la croissance.</li>
                  <li>Cette contribution n'explique pas toute la croissance observée.</li>
                  <li>Ce qui reste (le résidu) = la <strong>PGF</strong>, c'est-à-dire l'efficacité globale de la combinaison productive.</li>
                  <li>La PGF reflète essentiellement le <strong>progrès technique</strong> au sens large.</li>
                </ol><p class="bloc-p"><strong>2. Le progrès technique, source principale de la croissance à long terme</strong></p><ol class="meca">
                  <li>Le progrès technique améliore l'efficacité des facteurs (ex. : moissonneuse-batteuse au lieu de la faux ; ordinateur au lieu de la machine à écrire).</li>
                  <li>→ gains de productivité : on produit plus avec les mêmes facteurs.</li>
                  <li>→ il permet d'échapper aux rendements décroissants.</li>
                  <li>→ c'est à long terme la <strong>source la plus importante</strong> de la croissance, même s'il reste difficile à mesurer.</li>
                </ol><p class="bloc-p"><strong>3. Mieux comprendre la PGF</strong> : les économistes ajoutent la <strong>qualité des facteurs</strong> (niveau d'éducation de la main-d'œuvre, âge moyen des machines) et la <strong>diffusion des technologies</strong> (électricité, technologies de l'information et de la communication) pour réduire la part inexpliquée.</p>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>🧮 Calculs et formules</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="formule">Productivité horaire du travail = production / nombre d'heures travaillées</div><div class="formule">Croissance du PIB = contribution du travail + contribution du capital + contribution de la PGF (en points de %)</div><div class="exemple"><strong>Exemple :</strong> le PIB augmente de 2 %. La hausse du travail y contribue pour 0,4 point et celle du capital pour 0,6 point. La PGF contribue donc pour 2 − 0,4 − 0,6 = <strong>1 point</strong>, soit la moitié de la croissance.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">

            </button>
            <div class="accord-content">

                <table class="ses-table">
                  <tr><td>Robert Solow (1956-1957, Nobel 1987)</td><td>Modélise la croissance à partir du travail et du capital. Le capital a des rendements décroissants : seul le progrès technique permet une croissance durable. Dans son étude (États-Unis, 1909-1949), environ <strong>87,5 %</strong> de la hausse de la productivité du travail vient du « résidu » (progrès technique). Mais chez lui ce progrès technique est <strong>exogène</strong> (voir II.A).</td></tr>
                  <tr><td>Moses Abramovitz (1956)</td><td>Qualifie le résidu de « <strong>mesure de notre ignorance</strong> » : on sait qu'il explique une grande part de la croissance, sans savoir exactement ce qu'il contient.</td></tr>
                  <tr><td>Bergeaud, Cette, Lecat (2016-2017)</td><td>Économistes (Banque de France) auteurs de la décomposition de la croissance de 1890 à 2016 utilisée dans le cours.</td></tr>
                </table>

                  <tr><td>Pays développés, long terme</td><td>Le progrès technique (PGF) explique environ les <strong>2/3</strong> de la croissance.</td></tr>

  <button type="button" class="accord-h1" onclick="toggleAccord(this)" aria-expanded="false">

  <div class="accord-content">

    <div class="accord-fc-row accord-fc-row-h1">

    <!-- II.A -->
    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>A) Un progrès technique endogène</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','II.A')">🃏 Flashcards II.A</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Modèle</td><td>Représentation simplifiée de la réalité, fondée sur des hypothèses, qui vise à expliquer un phénomène en mettant en relation un petit nombre de variables.</td></tr>
                  <tr><td>Variable exogène / endogène</td><td>Une variable est <strong>exogène</strong> quand sa valeur est donnée de l'extérieur du modèle (elle n'est pas expliquée par lui) ; elle est <strong>endogène</strong> quand sa valeur est déterminée par les mécanismes que décrit le modèle.</td></tr>
                  <tr><td>Progrès technique exogène</td><td>Dans le modèle de Solow (1956), le progrès technique est la principale source de la croissance de long terme mais il n'est pas expliqué par le modèle : il dépend de facteurs extérieurs à l'économie (avancées scientifiques, hasard des découvertes). C'est une « manne tombée du ciel » (Charles Hulten), sur laquelle on ne peut donc pas agir.</td></tr>
                  <tr><td>Progrès technique endogène</td><td>Progrès technique <strong>expliqué par des variables économiques</strong> : il résulte des décisions d'investissement des agents (entreprises, ménages, État) dans la R&D, l'éducation, les infrastructures, et de la recherche du profit par les innovateurs. Il est donc produit par la croissance elle-même.</td></tr>
                  <tr><td>Théories de la croissance endogène</td><td>Ensemble de modèles apparus à partir du milieu des années 1980 (Romer 1986, Lucas 1988, Barro 1990, Aghion et Howitt 1992) qui expliquent le progrès technique par l'accumulation de différentes formes de capital générant des externalités positives. Elles montrent que la croissance peut être auto-entretenue et que les politiques publiques peuvent l'influencer durablement.</td></tr>
                  <tr><td>Croissance auto-entretenue</td><td>Processus cumulatif dans lequel la croissance génère les ressources (revenus, épargne, investissements) qui produisent du progrès technique, lequel alimente à son tour la croissance.</td></tr>
                  <tr><td>Externalités (effets externes)</td><td>Situation dans laquelle l'action d'un agent économique affecte le bien-être ou l'activité d'autres agents <strong>sans que cet effet donne lieu à une compensation monétaire</strong> par l'intermédiaire du marché. Elles sont <strong>positives</strong> quand l'effet est favorable (diffusion des connaissances, formation d'un salarié qui profite à ses collègues), <strong>négatives</strong> quand il est défavorable (pollution).</td></tr>
                  <tr><td>Recherche et développement (R&D)</td><td>Travaux de création entrepris de façon systématique en vue d'accroître la somme des connaissances et d'en tirer de nouvelles applications. Elle comprend la <strong>recherche fondamentale</strong> (connaissances nouvelles sans application immédiate), la <strong>recherche appliquée</strong> (orientée vers un objectif pratique) et le <strong>développement expérimental</strong> (mise au point de produits ou procédés). Elle est mesurée en France par la DIRD.</td></tr>
                  <tr><td>Capital technologique</td><td>Stock de connaissances techniques, de savoir-faire et de brevets accumulé par une entreprise ou une économie, notamment grâce aux dépenses de R&D.</td></tr>
                  <tr><td>Capital humain</td><td>Ensemble des connaissances, qualifications et expériences incorporées aux individus, qui accroissent leur productivité. Chez Lucas, son accumulation par l'éducation génère des externalités positives : la productivité de chacun dépend aussi du niveau de formation des autres.</td></tr>
                  <tr><td>Capital public</td><td>Stock de biens de production financés et possédés par les administrations publiques : infrastructures de transport et de communication, équipements de recherche, établissements d'enseignement et de santé. Chez Barro, il accroît la productivité des entreprises privées.</td></tr>
                  <tr><td>Bien non rival</td><td>Bien dont la consommation par un agent ne réduit pas la quantité disponible pour les autres. La connaissance est non rivale : une idée peut être utilisée simultanément par tous, ce qui permet des rendements croissants à l'échelle de l'économie.</td></tr>
                  <tr><td>Rendements croissants</td><td>Situation dans laquelle la production augmente plus que proportionnellement à la hausse des facteurs utilisés. Grâce aux externalités, les théories de la croissance endogène montrent que l'économie dans son ensemble peut échapper aux rendements décroissants.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. Du progrès technique exogène au progrès technique endogène</strong></p><ol class="meca">
                  <li>Dans les premiers modèles (Solow), le progrès technique est un résidu inexpliqué : la principale source de croissance n'est donc pas expliquée et on ne peut pas agir sur elle.</li>
                  <li>Or on observe que la croissance passée d'un pays est corrélée à sa croissance future : « la croissance favorise la croissance ».</li>
                  <li>Les théories de la croissance endogène expliquent le progrès technique par l'<strong>accumulation de différents capitaux</strong> (technologique, humain, public) qui génèrent des <strong>externalités positives</strong>.</li>
                </ol><p class="bloc-p"><strong>2. Le cercle vertueux de la croissance endogène</strong></p><ol class="meca">
                  <li>Croissance → hausse des revenus et de l'épargne.</li>
                  <li>→ davantage d'investissements (R&D, éducation, infrastructures).</li>
                  <li>→ accumulation de capital technologique, humain et public.</li>
                  <li>→ externalités positives et innovations → progrès technique.</li>
                  <li>→ gains de productivité → nouvelle croissance… : la croissance est <strong>auto-entretenue</strong>.</li>
                </ol><p class="bloc-p"><strong>3. Conséquence : l'État peut agir sur la croissance de long terme</strong> en investissant dans la R&D, l'éducation et les infrastructures, et en créant un cadre favorable à l'innovation (voir II.C).</p>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>👤 Auteurs et théories</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Joseph Schumpeter (début XX<sup>e</sup> s.)</td><td>Le premier à voir la croissance comme un processus endogène : il relie les grands cycles de croissance aux <strong>cycles d'innovations</strong>, et explique l'innovation par une variable économique, la recherche du profit par l'entrepreneur (voir II.B).</td></tr>
                  <tr><td>Paul Romer (1986, Nobel 2018)</td><td>Le progrès technique résulte de l'<strong>accumulation du capital et des connaissances</strong> (R&D financée par l'épargne). Une entreprise qui innove diffuse involontairement ses savoir-faire (imitation par les entreprises voisines, mobilité des salariés) : externalités positives. Plus un pays épargne et investit en R&D, plus le progrès technique est rapide.</td></tr>
                  <tr><td>Robert Lucas (1988, Nobel 1995)</td><td>Met l'accent sur le <strong>capital humain</strong>. Les individus investissent dans l'éducation (ils renoncent à un revenu aujourd'hui pour un meilleur salaire demain). Une personne mieux formée est plus productive, innove davantage et forme les autres : externalités positives.</td></tr>
                  <tr><td>Robert Barro (1990)</td><td>Met l'accent sur le <strong>capital public</strong> (infrastructures, R&D publique, éducation) financé par l'État : il génère des externalités positives qui augmentent la productivité du secteur privé, donc la croissance, donc les recettes pour investir à nouveau.</td></tr>
                  <tr><td>Philippe Aghion et Peter Howitt (1992)</td><td>Modèle schumpétérien : la croissance de long terme résulte de l'<strong>innovation</strong> (produits de meilleure qualité qui remplacent les anciens) ou de l'<strong>imitation</strong> de technologies existantes. Les pays qui n'innovent pas sont condamnés à une croissance faible.</td></tr>
                  <tr><td>Mariana Mazzucato (L'État entrepreneur, 2013)</td><td>Beaucoup d'innovations majeures viennent de l'<strong>investissement public</strong>, seul capable de financer des recherches risquées et non rentables à court terme.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📊 Chiffres et exemples</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="exemple"><strong>L'État à l'origine d'innovations (Mazzucato) :</strong> l'ARPANET, ancêtre d'Internet, financé par la DARPA (défense américaine) dans les années 1960 ; le GPS, issu du programme militaire NAVSTAR (années 1970) ; les batteries développées grâce à l'ARPA-E (2009) ; l'écran tactile et l'assistant vocal de l'iPhone issus de recherches publiques.</div><table class="ses-table">
                  <tr><td>France</td><td>La dépense intérieure de R&D (DIRD) représente environ <strong>2,2 % du PIB</strong>, dont un peu plus de la moitié financée par les entreprises.</td></tr>
                  <tr><td>Graphique 7 (Trésor-éco, 2018)</td><td>La croissance de la PGF ralentit depuis 1990, surtout après la crise de 2008 ; dans les pays émergents et à bas revenus, le ralentissement est antérieur à la crise, ce qui pèse sur leurs perspectives de croissance.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚠️ Pièges à éviter</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="piege"><strong>⚠ Exogène / endogène :</strong> « exogène » = qui vient de l'extérieur du modèle économique ; « endogène » = expliqué par les comportements économiques. Ne pas écrire que le progrès technique « n'existe pas » chez Solow : il existe, mais il n'est pas expliqué.</div><div class="piege"><strong>⚠ Ne pas confondre les auteurs :</strong> Romer = connaissances / R&D ; Lucas = capital humain / éducation ; Barro = capital public / État.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>✅ À retenir</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="aretenir">• Chez Solow, le progrès technique est <strong>exogène</strong> : il explique la croissance mais n'est pas lui-même expliqué.<br>• Pour les théories de la <strong>croissance endogène</strong>, il résulte de l'accumulation de capital technologique (Romer), humain (Lucas) et public (Barro), qui génère des <strong>externalités positives</strong>.<br>• La croissance est donc <strong>auto-entretenue</strong>, et les politiques publiques (R&D, éducation, infrastructures) peuvent agir sur la croissance de long terme.</div>
              </div>
            </div>
