      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">TPIY et TPIR</td>
        <td style="padding:7px 10px;"><strong>TPIY</strong> (Tribunal pénal international pour l'ex-Yougoslavie, 1993–2017) : 161 inculpés, 90 condamnations. Juge les crimes de Srebrenica (Mladic condamné, 2017). <strong>TPIR</strong> (Tribunal pénal international pour le Rwanda, 1994–2015) : 93 affaires, qualifie le génocide des Tutsis (arrêts de référence). Limites : lenteur, coût, distance géographique avec les victimes.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">Les tribunaux gacaca (Rwanda)</td>
        <td style="padding:7px 10px;">Justice communautaire et participative mise en place au Rwanda à partir de 2002 pour juger les génocidaires de rang intermédiaire (les chefs étant jugés par le TPIR). +120 000 « tribunaux » composés de juges élus localement, sans formation juridique. ~2 millions de dossiers traités jusqu'en 2012. Vise la réconciliation en plus de la punition : confessions en échange de réductions de peine. Controversé mais reconnu comme innovation majeure de la justice transitionnelle.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">La Cour pénale internationale (CPI)</td>
        <td style="padding:7px 10px;">Créée en 2002, siège à La Haye. Juridiction permanente jugeant crimes de guerre, crimes contre l'humanité, génocides et (depuis 2018) crime d'agression. 124 États membres — mais pas USA, Russie, Chine, Inde. Mandats d'arrêt contre Poutine (2023), Omar el-Béchir (Soudan), Mouammar Kadhafi. Limite majeure : dépend de la coopération des États pour les arrestations.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">La Shoah — construction mémorielle</td>
        <td style="padding:7px 10px;">La mémoire de la Shoah a évolué lentement : après 1945, le silence domine (traumatisme, intégration des survivants). Le procès Eichmann à Jérusalem (1961) est un tournant : 1er procès télévisé, met la Shoah au cœur du débat public mondial. Procès Barbie (Lyon, 1987) : 1er procès pour crime contre l'humanité en France. Loi Gayssot (1990) : négationnisme interdit. 2000 : Journée internationale de commémoration de la Shoah (ONU). La reconnaissance de la responsabilité de Vichy par Chirac (1995) est une étape majeure.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. LES ACTEURS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">LES ACTEURS DE LA MÉMOIRE ET DE LA JUSTICE</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;width:22%;">L'État</td>
        <td style="padding:8px 10px;">Principal acteur de la construction mémorielle officielle : commémorations nationales, programmes scolaires, musées, lois mémorielles, reconnaissance officielle (Chirac sur Vichy 1995, Macron sur la guerre d'Algérie 2022). Peut aussi instrumentaliser la mémoire à des fins politiques (nationalisme, union nationale).</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les historiens</td>
        <td style="padding:8px 10px;">Produisent une mémoire critique fondée sur les sources. Parfois en conflit avec la mémoire officielle ou les associations de victimes. Exemple : les historiens qui ont nuancé la thèse d'une France entièrement résistante pendant la 2e GM (Paxton, <em>La France de Vichy</em>, 1973).</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">Les associations de victimes</td>
        <td style="padding:8px 10px;">Mémorial de la Shoah (Paris), associations de rescapés du génocide arménien, associations de harkis. Militent pour la reconnaissance officielle, la transmission aux jeunes générations, la lutte contre le négationnisme. Parfois en concurrence entre elles (concurrence des mémoires).</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les témoins et survivants</td>
        <td style="padding:8px 10px;">Primo Levi, Elie Wiesel, Simone Veil (Shoah) — leur témoignage a une valeur irremplaçable mais la génération des témoins directs disparaît. La question de la transmission sans témoins directs est un enjeu central (archives filmées, témoignages numérisés).</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">Les tribunaux</td>
        <td style="padding:8px 10px;">Nuremberg, TPIY, TPIR, CPI, gacaca. La justice joue un rôle fondamental dans la construction de la mémoire officielle : elle établit des faits, qualifie les crimes, nomme les coupables et les victimes. Mais elle ne suffit pas à la réconciliation.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les artistes et les médias</td>
        <td style="padding:8px 10px;">Films (Shoah de Lanzmann 1985, La Liste de Schindler 1993), littérature (Primo Levi, Charlotte Delbo), bandes dessinées (Maus d'Art Spiegelman 1991). Ils touchent le grand public là où les historiens ne peuvent pas toujours aller — mais au risque de la simplification ou de la fictionnalisation.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. ÉTUDES DE CAS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">ÉTUDES DE CAS INCONTOURNABLES</div>
    <div style="display:flex;flex-direction:column;gap:14px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La Shoah — De l'oubli à la mémoire centrale de l'Europe</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Chronologie mémorielle :</strong> 1945 : silence des survivants + traumatisme collectif. 1961 : procès Eichmann (Jérusalem) — 1er tournant mondial. 1973 : Paxton, <em>La France de Vichy</em> — choc historiographique en France. 1985 : <em>Shoah</em> de Lanzmann (9h, film de référence). 1987 : procès Barbie à Lyon. 1990 : loi Gayssot (négationnisme). 1995 : discours de Chirac reconnaissant la responsabilité de Vichy. 2000 : ONU, Journée internationale (27 janvier). 2005 : inauguration du Mémorial de l'Holocauste à Berlin.<br><strong>Ce qu'il illustre :</strong> La construction mémorielle est un processus long, non linéaire ; la justice et la politique jouent des rôles complémentaires ; la mémoire peut d'abord être refoulée avant d'être institutionnalisée.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La guerre d'Algérie (1954–1962) — La guerre des mémoires</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Mémoires en présence :</strong> En France : mémoire des soldats (« appelés » peu reconnus), mémoire des harkis (Algériens ayant combattu du côté français, abandonnés en 1962 et souvent massacrés ou parqués dans des camps), mémoire des pieds-noirs (Français d'Algérie exilés en 1962), mémoire anticoloniale (torture, crimes de guerre). En Algérie : mémoire nationale glorieuse de la guerre de libération. Chiffres contestés entre les deux pays.<br><strong>Étapes de reconnaissance :</strong> 1999 : la France reconnaît officiellement que c'était une « guerre » (et non des « opérations de maintien de l'ordre »). 2001 : Jospin reconnaît les massacres de la Toussaint 1954. 2012 : Hollande reconnaît la répression du 17 octobre 1961 (massacre de manifestants algériens à Paris). 2021 : rapport Stora sur la réconciliation des mémoires. 2022 : Macron reconnaît que la torture était un « système ». Mais pas de loi reconnaissant la colonisation comme crime contre l'humanité.<br><strong>Ce qu'il illustre :</strong> La mémoire est un enjeu politique entre États et entre communautés ; la réconciliation mémorielle est un processus lent et fragile.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Le génocide des Tutsis au Rwanda (1994) — Justice à plusieurs échelles</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> ~800 000 morts en 100 jours (avril–juillet 1994). La communauté internationale n'intervient pas (voir fiche Guerre et Paix). Trois niveaux de justice mis en place : (1) TPIR (La Haye, échelle internationale) : juge les chefs — lenteur, éloignement des victimes, 93 affaires. (2) Tribunaux nationaux rwandais : jugent les catégories supérieures. (3) Tribunaux gacaca (2002–2012, échelle locale) : justice participative et communautaire pour les génocidaires ordinaires — +2 millions de dossiers, rôle de réconciliation.<br>La mémoire est institutionnalisée : Musée du Génocide de Kigali, journée nationale de commémoration (Kwibuka, 7 avril), enseignement dans les écoles. Tensions : le gouvernement rwandais contrôle strictement le récit mémoriel.<br><strong>Ce qu'il illustre :</strong> La complémentarité des échelles de justice ; l'innovation de la justice transitionnelle ; les limites de la communauté internationale ; la reconstruction mémorielle comme enjeu politique.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La Première Guerre mondiale — Responsabilités et mémoire en France et en Allemagne</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Traité de Versailles (1919) : l'article 231 rend l'Allemagne seule responsable de la guerre (« clause de culpabilité de guerre ») → base des réparations (132 milliards de marks-or). Ce verdict mémoriel et politique a nourri le ressentiment allemand et facilité la montée du nazisme. Travail des historiens (Christopher Clark, <em>Les Somnambules</em>, 2013) : les responsabilités sont partagées. En France : culte des morts, monuments aux morts dans chaque commune (36 000), Soldat inconnu (1920). La mémoire de la « der des ders » n'a pas empêché 1939 — interrogation centrale sur l'efficacité du souvenir comme garde-fou.<br><strong>Ce qu'il illustre :</strong> La mémoire instrumentalisée peut produire l'effet inverse à celui recherché ; le travail des historiens corrige progressivement les mémoires officielles.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La commission Vérité et Réconciliation (Afrique du Sud, 1995–2002)</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Après la fin de l'apartheid (1994), l'Afrique du Sud choisit la réconciliation plutôt que les procès. La CVR (présidée par Desmond Tutu) : les auteurs de crimes politiques peuvent obtenir l'amnistie en échange d'aveux complets et publics. ~7 000 demandes d'amnistie, ~1 500 accordées. Les victimes témoignent et peuvent poser des questions à leurs bourreaux. Critiques : impunité pour les coupables ; douleur des victimes sans réparation matérielle suffisante. Mais aussi modèle mondial de justice restaurative.<br><strong>Ce qu'il illustre :</strong> Différents modèles de justice transitionnelle ; la tension entre vérité, réconciliation et punition ; la justice restaurative comme alternative aux tribunaux pénaux.</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. TENSIONS ET DÉBATS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">TENSIONS ET DÉBATS CLÉS</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;width:35%;">« Si la mémoire divise, l'histoire réunit » (Pierre Nora)</td>
        <td style="padding:8px 10px;">Les mémoires concurrentes d'un même événement (guerre d'Algérie, Shoah, génocide arménien) peuvent diviser les sociétés. L'histoire, par sa méthode critique et son aspiration à l'objectivité, peut servir de cadre commun — mais elle ne remplace pas la mémoire qui répond à un besoin d'identité et de reconnaissance.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Devoir de mémoire vs liberté de l'historien</td>
        <td style="padding:8px 10px;">Les lois mémorielles (Gayssot, reconnaissance du génocide arménien) protègent les victimes mais peuvent contraindre la liberté de recherche historique. Danger du « tribunal de l'histoire » qui juge les événements du passé avec les normes du présent. L'historien ne doit pas être le militant de la mémoire qu'il étudie.</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;">Justice vs réconciliation</td>
        <td style="padding:8px 10px;">La justice pénale (TPIY, TPIR, CPI) peut être lente, lointaine, coûteuse et satisfaire les victimes sans reconstruire les relations sociales. La justice restaurative (CVR sud-africaine, gacaca) privilégie la réconciliation au risque de l'impunité. Ces modèles ne s'excluent pas : Rwanda a utilisé les deux.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Universalisation vs communautarisation de la mémoire</td>
        <td style="padding:8px 10px;">La Shoah est devenue un modèle de crime absolu, référence universelle du génocide. Mais d'autres génocides (arméniens, rwandais, Yézidis) peinent à obtenir la même reconnaissance internationale. Risque de hiérarchiser les victimes. ONU 2005 : la R2P vise à universaliser la protection, mais son application reste sélective.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 6. PLANS TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:12px;">PLANS TYPES DE DISSERTATION</div>

    <p style="font-weight:bold;margin-bottom:6px;">Sujet 1 : Juger les génocides et les crimes de masse depuis 1945 (Métropole 2024)</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:18px;">
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;" colspan="2">Plan thématique</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;width:25%;">I. De Nuremberg aux tribunaux ad hoc : la construction progressive d'une justice pénale internationale</td><td style="padding:7px 10px;">Nuremberg (1945–46) : 1er tribunal international. TPIY (1993) : Bosnie, Srebrenica. TPIR (1994) : Rwanda — Ex. : condamnation de Mladic (2017), jugements gacaca</td></tr>
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;">II. Des niveaux de justice complémentaires</td><td style="padding:7px 10px;">Échelle internationale (CPI) + nationale + locale (gacaca) — CVR Afrique du Sud — Ex. : Rwanda (3 niveaux), procès Barbie (France)</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;">III. Les limites structurelles de la justice internationale</td><td style="padding:7px 10px;">Veto au CS ONU, non-universalité CPI, difficultés d'arrestation — Ex. : Poutine (mandat non exécuté), Béchir (non arrêté), impunité des grandes puissances</td></tr>
    </table>

    <p style="font-weight:bold;margin-bottom:6px;">Sujet 2 : L'État, seul acteur de la construction des mémoires ?</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;" colspan="2">Plan dialectique</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;width:25%;">I. L'État, acteur central de la mémoire officielle</td><td style="padding:7px 10px;">Commémorations, musées nationaux, programmes scolaires, lois mémorielles — Ex. : discours de Chirac 1995, Journée de la mémoire de la Shoah, Musée du génocide Kigali</td></tr>
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;">II. D'autres acteurs construisent et contestent la mémoire officielle</td><td style="padding:7px 10px;">Historiens (Paxton/France de Vichy), associations (Mémorial Shoah), témoins (Primo Levi, Simone Veil), artistes (Shoah de Lanzmann) — Ex. : guerre d'Algérie, concurrence des mémoires</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;">III. Des mémoires en tension : entre instrumentalisation et réconciliation</td><td style="padding:7px 10px;">La mémoire peut être instrumentalisée par l'État (nationalisme) ou divisée (guerre des mémoires) — Ex. : guerre d'Algérie France/Algérie, Turquie/génocide arménien</td></tr>
    </table>
  </div>

  <!-- CHRONOLOGIE -->
  <div style="background:var(--card-bg);border-left:4px solid #7f8c8d;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#7f8c8d;margin-bottom:12px;">CHRONOLOGIE ESSENTIELLE</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#f9f9f9;"><td style="padding:6px 10px;font-weight:bold;width:15%;">1945–46</td><td style="padding:6px 10px;">Procès de Nuremberg — 1re justice pénale internationale</td></tr>
      <tr><td style="padding:6px 10px;font-weight:bold;">1948</td><td style="padding:6px 10px;">Convention ONU sur le génocide + DUDH</td></tr>
      <tr style="background:#f9f9f9;"><td style="padding:6px 10px;font-weight:bold;">1954–62</td><td style="padding:6px 10px;">Guerre d'Algérie</td></tr>

      <tr style="background:#f9f9f9;"><td style="padding:6px 10px;font-weight:bold;">1973</td><td style="padding:6px 10px;">Paxton, <em>La France de Vichy</em> — choc historiographique</td></tr>
      <tr><td style="padding:6px 10px;font-weight:bold;">1985</td><td style="padding:6px 10px;"><em>Shoah</em> de Claude Lanzmann (film de référence)</td></tr>
      <tr style="background:#f9f9f9;"><td style="padding:6px 10px;font-weight:bold;">1987</td><td style="padding:6px 10px;">Procès Barbie (Lyon) — 1er procès crime contre l'humanité en France</td></tr>

      <tr><td style="padding:6px 10px;font-weight:bold;">1995</td><td style="padding:6px 10px;">Discours Chirac (Vel d'Hiv) + CVR Afrique du Sud + Srebrenica</td></tr>

        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. PROBLÉMATIQUE ET DÉFINITIONS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">PROBLÉMATIQUE CENTRALE</div>
    <p style="margin:0 0 12px 0;">Questions clés : <em>Qu'est-ce que le patrimoine, et qui décide de ce qui en fait partie ? Protéger et valoriser le patrimoine est-il un acte neutre ou une opération politique ? Le patrimoine peut-il être un outil de puissance, de soft power ou de conflit ?</em></p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">Patrimoine</td>
        <td style="padding:7px 10px;">Du latin <em>patrimonium</em> (héritage du père). Ensemble des biens hérités du passé, matériels ou immatériels, que des individus, des communautés ou des États considèrent comme précieux et dignes d'être transmis aux générations futures. La notion a considérablement élargi son champ depuis le XIXe siècle.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Patrimoine matériel</td>
        <td style="padding:7px 10px;">Biens physiques, mobiliers (tableaux, sculptures, objets) ou immobiliers (monuments, sites archéologiques, paysages culturels). Ex. : Notre-Dame de Paris, le Colisée, les pyramides de Gizeh.</td>
      </tr>
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;">Patrimoine immatériel</td>
        <td style="padding:7px 10px;">Pratiques, savoir-faire, traditions orales, arts du spectacle, rituels. Reconnu par la Convention UNESCO de 2003. Ex. : le repas gastronomique français (inscrit en 2010), la fauconnerie, le tango argentin, le carnaval de Binche.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Patrimoine naturel</td>
        <td style="padding:7px 10px;">Sites naturels d'une valeur exceptionnelle : forêts, récifs coralliens, montagnes, géosites. Ex. : le Grand Canyon, la Grande Barrière de Corail, les Galápagos. Souvent source de tensions entre protection et exploitation économique.</td>
      </tr>
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;">Patrimonialisation</td>
        <td style="padding:7px 10px;">Processus par lequel un bien est identifié, reconnu et protégé comme patrimoine. Ce processus est toujours <em>sélectif</em> (tout n'est pas patrimonialisé) et <em>politique</em> (qui décide ? au nom de qui ?). Il implique une forme d'appropriation collective et une obligation de transmission.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Inflation patrimoniale</td>
        <td style="padding:7px 10px;">Extension croissante du champ patrimonial depuis les années 1980 : monuments, quartiers, paysages, objets du quotidien, traditions immatérielles. Certains historiens critiquent cette tendance au « tout patrimoine » qui dilue la notion et crée des conflits de gestion.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 2. GRANDES NOTIONS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">GRANDES NOTIONS À MAÎTRISER</div>

    <p style="font-weight:bold;margin-bottom:6px;">▶ Axe 1 — Usages sociaux et politiques du patrimoine</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;">
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">Le patrimoine national</td>
        <td style="padding:7px 10px;">L'État-nation a fait du patrimoine un outil de construction de l'identité nationale depuis le XIXe siècle. En France : Révolution française (nationalisation des biens du clergé, musées publics), puis loi Mérimée (1837 — protection des monuments historiques), loi Malraux (1962 — secteurs sauvegardés). Le patrimoine est utilisé pour créer un sentiment d'appartenance commune et légitimer le pouvoir de l'État.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Le soft power patrimonial</td>
        <td style="padding:7px 10px;">Le patrimoine est un instrument de rayonnement et d'influence internationale. La France fait du tourisme culturel (90 millions de touristes/an, 1er rang mondial avant 2020) et de son patrimoine (Versailles, Louvre, cathédrales) un élément central de son attractivité et de son influence. La Chine inscrit massivement des sites à l'UNESCO pour affirmer son statut de grande civilisation. L'Arabie Saoudite développe des sites archéologiques (AlUla) pour moderniser son image.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">Fonctions du patrimoine</td>
        <td style="padding:7px 10px;"><strong>Identitaire :</strong> ancre un groupe dans un territoire et une histoire. <strong>Mémorielle :</strong> transmet le souvenir des générations passées. <strong>Économique :</strong> le tourisme patrimonial représente 40% du tourisme mondial. <strong>Politique :</strong> légitimation du pouvoir, construction nationale. <strong>Éducative :</strong> transmission des valeurs et des savoirs. Ces fonctions peuvent entrer en tension (ex. : trop de touristes dégradent le monument qu'ils viennent admirer).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Versailles — cas d'étude</td>
        <td style="padding:7px 10px;">Château construit par Louis XIV comme symbole du pouvoir absolu. Pendant la Révolution : dépouillé, puis transformé en musée national (Louis-Philippe, 1837) — appropriation républicaine d'un symbole monarchique. Aujourd'hui : 1er site touristique français (10 millions de visiteurs/an), propriété de l'État, classé UNESCO (1979), lieu de représentation diplomatique (traité de Versailles 1919, réceptions d'État). Symbolise le passage du patrimoine royal au patrimoine national puis universel.</td>
      </tr>
    </table>

    <p style="font-weight:bold;margin-bottom:6px;">▶ Axe 2 — Conflits autour du patrimoine et enjeux géopolitiques</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">L'UNESCO et le patrimoine mondial</td>
        <td style="padding:7px 10px;">Créée en 1945 (Organisation des Nations Unies pour l'éducation, la science et la culture). Convention de 1972 : Patrimoine mondial de l'humanité — 1 199 sites dans 168 pays (2024). Critères stricts (valeur universelle exceptionnelle). La liste est un enjeu politique : les États luttent pour y faire inscrire leurs sites (prestige, tourisme) et peuvent y perdre leurs sites (Dresde retirée en 2009 pour la construction d'un pont). L'UNESCO est aussi utilisée comme arène géopolitique (retrait des USA en 2018, réadhésion 2023).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Destruction du patrimoine</td>
        <td style="padding:7px 10px;">Détruire le patrimoine d'un ennemi, c'est effacer son identité et sa mémoire — arme culturelle. Exemples : destruction des Bouddhas de Bâmiyân par les talibans (2001, Afghanistan), destruction du temple de Baalshamin à Palmyre par Daesh (2015, Syrie). La CPI a reconnu pour la 1re fois en 2016 que la destruction de patrimoine culturel constitue un crime de guerre (affaire Al Mahdi — destruction de mausolées à Tombouctou, Mali).</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">Restitution des œuvres spoliées</td>
        <td style="padding:7px 10px;">Problème majeur du XXIe siècle. Deux contextes : (1) <strong>Spoliations coloniales</strong> : musées européens (British Museum, Louvre, Musée du Quai Branly) conservent des millions d'objets africains, asiatiques et océaniens prélevés pendant la colonisation. En France, rapport Sarr-Savoy (2018) recommande des restitutions massives. Macron restitue 26 œuvres au Bénin (2021). (2) <strong>Spoliations nazies</strong> : 100 000+ œuvres volées aux juifs entre 1933 et 1945, retrouvées progressivement (affaire Gurlitt, Allemagne, 2013 : 1 400 œuvres découvertes dans un appartement munichois).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Les Frises du Parthénon</td>
        <td style="padding:7px 10px;">Cas d'étude central du programme. Lord Elgin, ambassadeur britannique à Constantinople, fait démonter et emmener en Angleterre les frises du Parthénon (Athènes) entre 1801 et 1812 — avec une autorisation ottomane contestée par la Grèce. Elles sont exposées au British Museum depuis 1816. La Grèce réclame leur retour depuis les années 1980 (Melina Mercouri, ministre de la Culture, 1983). Le Royaume-Uni refuse, arguant que le British Museum ne peut pas légalement se dessaisir de ses collections. Débat mondial sur la propriété du patrimoine universel.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. LES ACTEURS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">LES ACTEURS INCONTOURNABLES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;width:22%;">L'UNESCO</td>
        <td style="padding:8px 10px;">Organisme de l'ONU qui gère la liste du Patrimoine mondial (1972), le patrimoine immatériel (2003) et la mémoire du monde. 194 États membres. Dispose de fonds limités — dépend des contributions des États. Son fonctionnement est politisé : les États font pression pour l'inscription de leurs sites. Joue un rôle clé dans la protection des sites en danger de guerre ou de catastrophe naturelle.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les États</td>
        <td style="padding:8px 10px;">Principaux acteurs de la protection et de la valorisation du patrimoine. Politiques patrimoniales nationales (France : Loi Malraux, DRAC, CMN), ministères de la Culture, financements publics. Mais aussi acteurs des conflits patrimoniaux (restitutions refusées, destructions de patrimoine ennemi). La France a un modèle particulièrement centralisé et interventionniste.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">Les collectivités locales</td>
        <td style="padding:8px 10px;">Communes, régions, départements gèrent une part croissante du patrimoine local (châteaux, musées régionaux, centre-villes historiques). Le tourisme patrimonial est une ressource économique majeure pour des territoires en déclin industriel (ex. : Carcassonne, Mont-Saint-Michel). Tension entre valorisation touristique et préservation.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les musées</td>
        <td style="padding:8px 10px;">British Museum, Louvre, Musée du Quai Branly, Metropolitan Museum of Art. Gardiens de collections immenses dont une partie est contestée (spoliations coloniales, nazies). Débat : faut-il restituer ou maintenir une vocation universaliste (accès au patrimoine mondial pour tous les visiteurs du monde entier) ? Le Louvre Abu Dhabi (ouvert 2017) : exportation du modèle muséal français comme soft power.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">Les acteurs privés</td>
        <td style="padding:8px 10px;">Mécènes (Total, LVMH pour Notre-Dame après l'incendie de 2019 — 200M€ promis par Bernard Arnault), fondations culturelles, marchés de l'art (Christie's, Sotheby's — parfois accusés de faciliter le trafic d'antiquités). Le marché de l'art est aussi un vecteur de blanchiment et de pillage archéologique.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les populations locales</td>
        <td style="padding:8px 10px;">Souvent premier acteur de la préservation, mais aussi parfois mis à l'écart des décisions patrimoniales. Phénomène de <em>gentrification</em> : la patrimonialisation d'un quartier fait monter les prix et chasse les habitants d'origine (ex. : Venise se vide de ses résidents permanents). Paradoxe : le succès patrimonial peut détruire la vie locale qui donnait sa valeur au patrimoine.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. ÉTUDES DE CAS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">ÉTUDES DE CAS INCONTOURNABLES</div>
    <div style="display:flex;flex-direction:column;gap:14px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Les Bouddhas de Bâmiyân (2001) et Palmyre (2015) — Le patrimoine comme cible de guerre</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Bâmiyân :</strong> Mars 2001, les talibans font exploser à la dynamite deux Bouddhas géants (6e siècle, 53m et 37m de hauteur) sculptés dans la falaise de la vallée de Bâmiyân (Afghanistan), classés au patrimoine mondial. Justification : idoles contraires à l'islam. Réaction internationale de stupéfaction — même des États musulmans protestent. L'UNESCO réussit à faire inscrire le site en urgence (bien en péril).<br><strong>Palmyre :</strong> 2015, Daesh s'empare de la ville antique de Palmyre (Syrie), tue l'archéologue Khaled al-Asaad (82 ans, décapité pour avoir refusé de révéler où étaient cachées les œuvres), détruit le temple de Baalshamin et l'arc de triomphe. En 2016, l'ONU reconnaît la destruction de patrimoine comme crime de guerre.<br><strong>Ce qu'il illustre :</strong> Le patrimoine comme outil de guerre identitaire et symbolique ; le droit international pénal du patrimoine ; la reconstruction comme enjeu politique (Palmyre partiellement reconstituée sous influence russe).</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Les Frises du Parthénon — Un conflit patrimonial entre deux États</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> 1801–1812 : Lord Elgin, ambassadeur britannique à Constantinople, obtient une autorisation de l'Empire ottoman (contestée depuis) pour prélever les frises du Parthénon. 1816 : ventes au British Museum. 1983 : Melina Mercouri (ministre de la Culture grecque) lance la demande officielle de restitution. Argument grec : l'autorisation était illégale, les frises appartiennent à la Grèce et au patrimoine universel de l'humanité, elles doivent être réunies à Athènes (Musée de l'Acropole, ouvert en 2009 spécialement pour les accueillir). Argument britannique : le British Museum est propriétaire légal selon la loi britannique de 1963 qui interdit la cession de ses collections ; les frises sont accessibles à 6 millions de visiteurs/an à Londres.<br><strong>Ce qu'il illustre :</strong> La tension entre appropriation nationale et universalisme muséal ; les cicatrices coloniales dans la gestion du patrimoine mondial ; l'absence de règle internationale contraignante sur les restitutions.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La restitution des œuvres africaines — La France face à son passé colonial</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Les musées européens conservent des millions d'objets africains prélevés pendant la colonisation — souvent dans des conditions violentes ou sous la contrainte. En France, le Musée du Quai Branly conserve ~70 000 objets africains. En 2017, Macron à Ouagadougou promet que le patrimoine africain sera restitué à l'Afrique dans les cinq ans. 2018 : rapport Sarr-Savoy préconise la restitution de toutes les œuvres obtenues sans consentement. 2021 : la France restitue 26 œuvres royales au Bénin (dont le trône du roi Béhanzin). Débat : faut-il tout restituer ? Les États africains ont-ils les infrastructures muséales pour préserver ces œuvres ? Qui représente « l'Afrique » ?<br><strong>Ce qu'il illustre :</strong> Le patrimoine comme enjeu post-colonial ; la tension entre universalisme muséal et souveraineté culturelle ; le rôle de la politique intérieure et étrangère dans les décisions patrimoniales.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Venise — Le patrimoine victime de son succès</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Venise (classée UNESCO 1987) accueille 30 millions de touristes/an pour une population résidente de seulement 250 000 habitants (en baisse constante — 120 000 dans le centre historique). Les Vénitiens fuient : coûts de logement exorbitants, commerce local remplacé par des souvenirs, eau contaminée par les bateaux de croisière. L'UNESCO a menacé de classer Venise « en péril » en raison des navires de croisière et de la montée des eaux. L'Italie a finalement interdit les grands paquebots dans la lagune (2021). Venise illustre le paradoxe de la patrimonialisation : la protection peut tuer ce qu'elle voulait sauvegarder.<br><strong>Ce qu'il illustre :</strong> Surtourisme et limites de la valorisation patrimoniale ; le conflit entre économie touristique et vie locale ; le changement climatique comme menace existentielle pour le patrimoine.</td>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Notre-Dame de Paris (incendie 2019) — Reconstruction comme projet national</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> 15 avril 2019 : incendie de la cathédrale Notre-Dame de Paris, classée monument historique (1862) et UNESCO. La flèche s'effondre. Émotion mondiale immédiate. En 48h, 1 milliard d'euros promis par des mécènes (dont 200M de Bernard Arnault/LVMH, 100M de la famille Bettencourt). Débat : à quoi devait ressembler la reconstruction ? À l'identique (Macron tranche en faveur de l'identique en 2020). 2024 : réouverture de la cathédrale (décembre), à temps pour les JO de Paris. Symbolisme : Notre-Dame comme patrimoine national, européen et universel ; mécénat privé au cœur de la reconstruction d'un bien public.<br><strong>Ce qu'il illustre :</strong> La valeur symbolique du patrimoine dans l'identité nationale ; le rôle des acteurs privés ; la rapidité de la mobilisation internationale face à un patrimoine universel.</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. TENSIONS ET DÉBATS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">TENSIONS ET DÉBATS CLÉS</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;width:35%;">Patrimoine national vs patrimoine universel</td>
        <td style="padding:8px 10px;">Les Frises du Parthénon appartiennent-elles à la Grèce ou à l'humanité entière ? Le British Museum défend un universalisme muséal (accès mondial), la Grèce défend une souveraineté culturelle nationale. Cette tension est au cœur de tous les débats sur les restitutions.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Protection vs développement économique</td>
        <td style="padding:8px 10px;">Dresde retiré de la liste UNESCO en 2009 pour construction d'un pont nécessaire au trafic. Les grands fonds marins — patrimoine naturel potentiel — sont aussi des ressources en nodules polymétalliques convoitées. L'Amazonie est à la fois écosystème mondial essentiel et source de revenus agricoles pour le Brésil.</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;">Qui a le droit de définir le patrimoine ?</td>
        <td style="padding:8px 10px;">La liste UNESCO est dominée par l'Europe et l'Amérique du Nord. Les États africains et asiatiques ont longtemps été sous-représentés. La Chine a massivement rattrapé son retard (57 sites classés, 1er rang mondial en 2024). Qui décide que telle pratique est « patrimoine immatériel de l'humanité » ? Les critères UNESCO sont-ils neutres ou culturellement biaisés ?</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Patrimonialiser, c'est aussi exclure</td>
        <td style="padding:8px 10px;">La création d'un site patrimonial peut déplacer des populations locales (création de parcs naturels en Afrique qui expulsent les communautés autochtones), les empêcher d'exploiter des ressources, ou les transformer en attraction touristique. Le patrimoine peut être un outil de domination culturelle autant qu'un acte de transmission.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 6. PLANS TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:12px;">PLANS TYPES DE DISSERTATION</div>

    <p style="font-weight:bold;margin-bottom:6px;">Sujet 1 : Le patrimoine : un enjeu de tensions dans le monde (Métropole juin 2024)</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:18px;">
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;" colspan="2">Plan thématique</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;width:25%;">I. Des tensions entre États autour de la propriété du patrimoine</td><td style="padding:7px 10px;">Restitutions (Frises, Bénin) — Spoliations coloniales et nazies — Classement UNESCO comme arène géopolitique — Ex. : Frises du Parthénon, rapport Sarr-Savoy, affaire Gurlitt</td></tr>
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;">II. Le patrimoine comme cible et outil des conflits armés</td><td style="padding:7px 10px;">Destruction comme crime de guerre (Bâmiyân, Palmyre) — Reconstruction comme outil de soft power (Palmyre/Russie) — Protection en temps de guerre (Convention de La Haye 1954) — Ex. : Daesh, talibans, affaire Al Mahdi CPI</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;">III. Des tensions entre valorisation et préservation</td><td style="padding:7px 10px;">Surtourisme (Venise, Mont-Saint-Michel) — Changement climatique (Venise, sites côtiers) — Conflits d'usage entre populations locales et protection — Ex. : Venise, Dresde/UNESCO</td></tr>

    <p style="font-weight:bold;margin-bottom:6px;">Sujet 2 : Le patrimoine, outil du soft power des États ? (sujet fréquent)</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;" colspan="2">Plan dialectique</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;width:25%;">I. Le patrimoine est bien un outil d'influence internationale</td><td style="padding:7px 10px;">France : tourisme culturel, Louvre Abu Dhabi, Journées du patrimoine — Chine : inscriptions massives à l'UNESCO — Arabie Saoudite : AlUla — Ex. : Versailles, Louvre Abu Dhabi, sites chinois UNESCO</td></tr>
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;">II. Mais le soft power patrimonial a ses limites</td><td style="padding:7px 10px;">Surtourisme qui dégrade — Tensions diplomatiques (restitutions) — Instrumentalisation qui nuit à la crédibilité — Ex. : Venise, Grèce vs RU, refus de restituer</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;">III. Le patrimoine comme enjeu de la communauté internationale</td><td style="padding:7px 10px;">UNESCO comme forum de négociation — Convention 1972 comme bien commun — Vers une gouvernance multilatérale du patrimoine mondial — Ex. : Liste en péril, Convention 2003</td></tr>
    </table>

  <!-- CHRONOLOGIE -->
  <div style="background:var(--card-bg);border-left:4px solid #7f8c8d;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#7f8c8d;margin-bottom:12px;">CHRONOLOGIE ESSENTIELLE</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#f9f9f9;"><td style="padding:6px 10px;font-weight:bold;width:15%;">1790</td><td style="padding:6px 10px;">Révolution française — nationalisation des biens du clergé, création des musées publics</td></tr>
      <tr><td style="padding:6px 10px;font-weight:bold;">1816</td><td style="padding:6px 10px;">Frises du Parthénon au British Museum</td></tr>
      <tr style="background:#f9f9f9;"><td style="padding:6px 10px;font-weight:bold;">1837</td><td style="padding:6px 10px;">Loi Mérimée (France) — 1re protection légale des monuments historiques</td></tr>
      <tr><td style="padding:6px 10px;font-weight:bold;">1954</td><td style="padding:6px 10px;">Convention de La Haye — protection du patrimoine culturel en cas de conflit armé</td></tr>
      <tr style="background:#f9f9f9;"><td style="padding:6px 10px;font-weight:bold;">1962</td><td style="padding:6px 10px;">Loi Malraux (France) — secteurs sauvegardés</td></tr>
      <tr><td style="padding:6px 10px;font-weight:bold;">1972</td><td style="padding:6px 10px;">Convention UNESCO — Patrimoine mondial de l'humanité (matériel)</td></tr>

        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. PROBLÉMATIQUE ET DÉFINITIONS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">PROBLÉMATIQUE CENTRALE</div>
    <p style="margin:0 0 12px 0;">Questions clés : <em>Depuis quand et pourquoi les sociétés ont-elles pris conscience des enjeux environnementaux ? Comment concilier exploitation des ressources naturelles et protection de l'environnement ? La gouvernance internationale du climat est-elle efficace ?</em></p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">Environnement</td>
        <td style="padding:7px 10px;">Terme polysémique désignant l'ensemble des milieux naturels et des relations d'interdépendance entre les sociétés humaines et ces milieux. Ne se réduit pas à la « nature » : inclut les dimensions sociales, économiques et politiques des rapports entre l'homme et son milieu. Notion construite historiquement (elle prend sa forme contemporaine dans les années 1960–70).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Anthropocène</td>
        <td style="padding:7px 10px;">Terme proposé par le chimiste Paul Crutzen (2000) pour désigner la période géologique actuelle où l'activité humaine est devenue la principale force de transformation de la planète (changement climatique, érosion de la biodiversité, pollution des sols et des océans). Débattu scientifiquement sur sa date de début : révolution industrielle (1850) ? Bombes atomiques (1945) ? Accélération des années 1950 ?</td>
      </tr>
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;">Exploiter / Préserver / Protéger</td>
        <td style="padding:7px 10px;"><strong>Exploiter</strong> : prélever des ressources naturelles (mines, forêts, pêche, agriculture). <strong>Préserver</strong> : maintenir un milieu dans son état naturel en limitant les activités humaines (prévention). <strong>Protéger</strong> : intervenir activement pour restaurer un milieu dégradé (curatif — aires protégées, reforestation). Ces trois logiques coexistent et entrent souvent en tension.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Développement durable</td>
        <td style="padding:7px 10px;">« Un développement qui répond aux besoins du présent sans compromettre la capacité des générations futures à répondre aux leurs » — Rapport Brundtland, ONU, 1987. Trois piliers : économique (croissance), social (équité), environnemental (préservation). Notion centrale depuis 1987, mais sa mise en œuvre reste très inégale.</td>
      </tr>
      <tr style="background:#c0392b15;">
        <td style="padding:7px 10px;font-weight:bold;">Réchauffement climatique / Changement climatique</td>
        <td style="padding:7px 10px;">Augmentation de la température moyenne à la surface de la Terre due aux émissions de gaz à effet de serre (CO₂, méthane, protoxyde d'azote) liées aux activités humaines. +1,1°C depuis l'ère préindustrielle en 2023. Les conséquences : élévation du niveau des mers, événements météorologiques extrêmes, migrations climatiques, perte de biodiversité. Consensus scientifique absolu depuis le GIEC (1988).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Biodiversité</td>
        <td style="padding:7px 10px;">Diversité du vivant à trois niveaux : écosystèmes, espèces, gènes. La 6e extinction de masse est en cours selon les scientifiques (taux d'extinction 100 à 1 000 fois supérieur au taux naturel). Causes : destruction des habitats, surexploitation, espèces invasives, pollution, changement climatique. La COP biodiversité (CBD) est distincte de la COP climat.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 2. GRANDES NOTIONS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">GRANDES NOTIONS À MAÎTRISER</div>

    <p style="font-weight:bold;margin-bottom:6px;">▶ Axe 1 — Exploitation et protection des milieux : la forêt française comme cas d'étude</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;">
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">La forêt française</td>
        <td style="padding:7px 10px;">Couvre 17 millions d'hectares (31% du territoire), en hausse depuis le XIXe s. (reboisement après surexploitation). Gérée par l'ONF (Office national des forêts, créé 1964). Fonctions multiples : économique (bois d'œuvre, énergie), environnementale (stockage CO₂, biodiversité, eau), sociale (tourisme, loisirs). La forêt est un objet paradigmatique des tensions exploitation/protection.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Colbert et l'Ordonnance de 1669</td>
        <td style="padding:7px 10px;">Louis XIV et son ministre Colbert font face à une surexploitation des forêts royales (défrichements, usage naval). L'Ordonnance de 1669 est la 1re grande politique forestière en France : protection des forêts royales, réglementation des coupes, réintégration de ~35 000 ha dans le domaine royal. Objectif : « Protéger pour mieux exploiter » — la conservation n'est pas encore une fin en soi, elle sert les intérêts économiques et militaires de l'État. Mais c'est un précédent fondateur.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">Le reboisement des Landes (XIXe s.)</td>
        <td style="padding:7px 10px;">Napoléon III, poussé par la nécessité d'assécher les marais côtiers et d'exploiter les ressources résineuses, fait planter des milliers d'hectares de pins maritimes dans les Landes (décret de 1857). Transformation d'un écosystème naturel (landes humides) en forêt productive. Exemple d'une reforestation motivée par l'exploitation économique qui a eu des effets environnementaux positifs (lutte contre l'érosion, stockage carbone) mais aussi négatifs (appauvrissement de la biodiversité, vulnérabilité aux incendies — illustrée par les feux catastrophiques de 2022).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Menaces actuelles sur les forêts</td>
        <td style="padding:7px 10px;">En France : scolytes (insectes ravageurs favorisés par la sécheresse), incendies (été 2022 : +70 000 ha brûlés, record depuis 1976), sécheresses récurrentes. Dans le monde : déforestation tropicale (Amazonie, bassin du Congo, Asie du Sud-Est) — 10 millions d'ha/an perdus malgré les engagements de la COP26 (2021 : 100 États s'engagent à stopper la déforestation d'ici 2030).</td>
      </tr>
    </table>

    <p style="font-weight:bold;margin-bottom:6px;">▶ Axe 2 — La question environnementale comme enjeu de mobilisation internationale</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;width:30%;">Prise de conscience (1960–70)</td>
        <td style="padding:7px 10px;">Publication de <em>Silent Spring</em> (Rachel Carson, 1962) — alerte sur les pesticides. Club de Rome : <em>Les Limites de la croissance</em> (1972) — 1re alerte sur les ressources finies et la croissance illimitée. Conférence de Stockholm (1972) — 1re conférence internationale sur l'environnement (ONU). Création du PNUE (Programme des Nations Unies pour l'environnement). Naissance des partis verts (Allemagne, France).</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Rapport Brundtland (1987) et Rio (1992)</td>
        <td style="padding:7px 10px;">Rapport Brundtland (1987) : concept de développement durable. Sommet de la Terre de Rio (1992) — 178 pays : Convention-cadre ONU sur les changements climatiques (CCNUCC), Convention sur la diversité biologique (CBD), Agenda 21. Création de la COP (Conférence des Parties) annuelle. Protocole de Kyoto (1997) : 1er accord contraignant de réduction des GES pour les pays industrialisés (USA ne ratifient pas).</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">Accord de Paris (COP21, 2015)</td>
        <td style="padding:7px 10px;">195 États signataires. Objectif : limiter le réchauffement à +2°C, idéalement +1,5°C par rapport au niveau préindustriel. Chaque État fixe ses propres NDC (contributions déterminées au niveau national) — pas de mécanisme contraignant de sanction. 2017 : Trump retire les USA (réintégration sous Biden, 2021). Accord symboliquement fort mais mécanisme de contrôle insuffisant. Le GIEC estime que les engagements actuels mènent à +2,5°C minimum.</td>
      </tr>
      <tr>
        <td style="padding:7px 10px;font-weight:bold;">Le GIEC</td>
        <td style="padding:7px 10px;">Groupe d'experts intergouvernemental sur l'évolution du climat, créé en 1988. Synthétise les résultats de la recherche scientifique mondiale sur le climat (sans mener lui-même des recherches). Ses rapports d'évaluation (environ tous les 7 ans) font référence dans les négociations internationales. 6e rapport (2021–2023) : les conséquences du réchauffement sont « sans précédent » et le lien avec les activités humaines est « sans équivoque ». Lauréat du prix Nobel de la paix 2007 (avec Al Gore).</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:7px 10px;font-weight:bold;">COP et limites de la gouvernance climatique</td>
        <td style="padding:7px 10px;">La COP se tient chaque année depuis 1995. COP26 Glasgow (2021) : engagement sur la déforestation, fonds pour pays pauvres, engagement sur le charbon (non tenu). COP27 Charm-el-Cheikh (2022) : création d'un fonds « pertes et préjudices » pour les pays vulnérables. COP28 Dubaï (2023) : 1er accord mentionnant « la sortie des énergies fossiles » — mais sans calendrier contraignant. Critiques : pays pétroliers (Arabie Saoudite, Émirats) organisent et bloquent les COP ; engagements insuffisants ; fossé entre riches et pauvres.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. LES ACTEURS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">LES ACTEURS INCONTOURNABLES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;width:22%;">Les États</td>
        <td style="padding:8px 10px;">Principaux acteurs des négociations climatiques. Mais leurs intérêts divergent profondément : pays pétroliers (Arabie Saoudite, Russie) freinent les engagements ; pays vulnérables (Tuvalu, Bangladesh) poussent pour des mesures ambitieuses ; pays émergents (Chine, Inde) demandent des compensations financières aux pays riches historiquement pollueurs. Les États-Unis oscillent (Obama pro-Accord de Paris, Trump anti, Biden pro, Trump 2 anti à nouveau).</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">L'Union européenne</td>
        <td style="padding:8px 10px;">Acteur le plus ambitieux dans la gouvernance climatique. Green Deal européen (2020) : objectif neutralité carbone en 2050 ; réduction des émissions de -55% d'ici 2030. Mécanisme d'ajustement carbone aux frontières (MACF, 2023) : taxe carbone sur les importations — protège les industries européennes et incite les partenaires commerciaux à décarboner. Fit for 55 (paquet législatif 2021).</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">Chine</td>
        <td style="padding:8px 10px;">1er émetteur mondial de CO₂ (27% des émissions mondiales) ET 1er investisseur mondial dans les énergies renouvelables. Engagement : neutralité carbone en 2060, pic des émissions avant 2030. Mais continue de construire des centrales à charbon. Contradictions entre ambitions climatiques affichées et réalité des émissions. Argument : les pays riches ont pollué pendant 150 ans, la Chine a le droit de se développer.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les ONG environnementales</td>
        <td style="padding:8px 10px;">Greenpeace (actions médiatiques, rapports), WWF (conservation de la biodiversité), Friends of the Earth, 350.org (mobilisation contre les énergies fossiles). Rôle : sensibilisation, pression sur les gouvernements, surveillance des engagements. Présentes aux COP mais sans droit de vote. La société civile (marches pour le climat, Greta Thunberg depuis 2018) a exercé une pression croissante.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 10px;font-weight:bold;">Les acteurs économiques</td>
        <td style="padding:8px 10px;">Industrie fossile (Total, ExxonMobil, Saudi Aramco) : lobby contre les réglementations climatiques, financement de la désinformation (révélations sur ExxonMobil). Multinationales du numérique : centres de données très énergivores. Mais aussi acteurs de la transition : Tesla, fabricants d'éolien (Vestas), solaire (BYD). Les entreprises s'engagent de plus en plus (ESG, bilan carbone) sous pression des investisseurs et des consommateurs.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Les communautés locales et autochtones</td>
        <td style="padding:8px 10px;">Premières victimes du changement climatique (peuples des îles du Pacifique, communautés sahéliennes) et premières gardiens de la biodiversité (80% de la biodiversité mondiale dans les territoires autochtones selon l'ONU). Longtemps exclues des négociations internationales, elles sont de plus en plus associées aux COP et à la gouvernance environnementale.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. ÉTUDES DE CAS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">ÉTUDES DE CAS INCONTOURNABLES</div>
    <div style="display:flex;flex-direction:column;gap:14px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">La forêt amazonienne — Entre développement et protection mondiale</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> L'Amazonie représente 40% des forêts tropicales mondiales, absorbe ~2 milliards de tonnes de CO₂/an, abrite 10% de la biodiversité mondiale et régule le régime des pluies en Amérique du Sud. Sous Bolsonaro (2019–2022) : déforestation record (+73% en 2019), recul des protections des terres autochtones, retrait des inspecteurs de l'IBAMA. Sous Lula (depuis 2023) : déforestation en baisse de 50% en un an. Tension centrale : le Brésil affirme le droit au développement économique (élevage bovin, soja) et refuse les leçons des pays qui ont eux-mêmes détruit leurs forêts. Fonds Amazonie (Allemagne + Norvège → Brésil) : paiement pour services environnementaux.<br><strong>Ce qu'il illustre :</strong> Tension souveraineté nationale/bien commun mondial ; rôle des acteurs économiques (agrobusiness) ; paiement pour services environnementaux comme outil de gouvernance.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">L'Accord de Paris (COP21, 2015) — Forces et faiblesses</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Négocié à Paris sous présidence française (Laurent Fabius). Signé par 195 États — quasi-universalité. Objectif : +2°C max, idéalement +1,5°C. Mécanisme : chaque État fixe librement ses NDC (pas de sanction en cas de non-respect). Transparence : système de bilan mondial tous les 5 ans (global stocktake). Forces : universel, différencie les responsabilités, mobilise la société civile. Faiblesses : pas de mécanisme contraignant, NDC insuffisantes (mènent à +2,5–3°C), sortie facile (Trump). Bilan 2023 : le 1er global stocktake montre que les engagements actuels sont très insuffisants.<br><strong>Ce qu'il illustre :</strong> La gouvernance climatique multilatérale et ses limites ; le rôle des grandes puissances ; la tension entre ambition et réalisme politique.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Les îles du Pacifique et la montée des eaux — Les premières victimes climatiques</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Kiribati, Tuvalu, Maldives, Marshall Islands : archipels coralliens dont l'altitude moyenne est de 2 mètres. La montée des eaux (+3,7mm/an en moyenne mondiale, accélération prévue) menace leur existence physique d'ici 2100. Populations : 100 000 personnes à Kiribati, 11 000 à Tuvalu. Ces États émettent moins de 0,01% des GES mondiaux mais sont en première ligne. Tuvalu a signé en 2023 un accord avec l'Australie : si le territoire est submergé, les citoyens tuvaluans pourront devenir résidents australiens — premier statut de réfugiés climatiques. Question : un État peut-il continuer d'exister sans territoire ?<br><strong>Ce qu'il illustre :</strong> Injustice climatique (les moins pollueurs sont les plus touchés) ; réfugiés climatiques ; remise en cause du droit international (État sans territoire) ; urgence d'une action mondiale.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Les feux de forêt australiens de 2019–2020 (Black Summer)</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Été austral 2019–2020 : la saison des feux la plus dévastatrice de l'histoire australienne. 18 millions d'hectares brûlés (surface équivalente à la Syrie), 3 milliards d'animaux tués ou blessés, 33 morts directs, des milliers de maisons détruites. Fumée visible depuis l'Amérique du Sud. Lien avec le changement climatique établi scientifiquement : sécheresse prolongée due au réchauffement. Le Premier ministre Scott Morrison prend des vacances à Hawaï pendant la catastrophe — scandale politique. Contrairement à la France, l'Australie dépend massivement du charbon (export + électricité) et a longtemps minimisé le changement climatique.<br><strong>Ce qu'il illustre :</strong> Effets concrets du changement climatique ; tension entre économie fossile et protection de l'environnement ; responsabilité politique face aux catastrophes climatiques.</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Le Green Deal européen — Modèle ou contrainte ?</div>
        <div style="font-size:14px;margin-top:6px;"><strong>Ce qu'il faut savoir :</strong> Présenté en 2019 par la Commission Von der Leyen. Objectifs : neutralité carbone en 2050 ; -55% d'émissions en 2030 (vs 1990) ; 45% d'énergies renouvelables en 2030 ; fin des voitures thermiques neuves en 2035. Mécanisme d'ajustement carbone aux frontières (MACF) : taxe sur les importations de produits carbonés pour éviter les « fuites carbone ». Investissements massifs : 1 000 milliards € sur 10 ans. Critiques : agriculteurs français et européens manifestent contre les contraintes (2024) ; industrie automobile inquiète face à la concurrence chinoise dans l'électrique. Le Green Deal montre qu'une politique climatique ambitieuse crée des gagnants (renouvelables) et des perdants (combustibles fossiles, agriculture intensive).<br><strong>Ce qu'il illustre :</strong> La transition écologique comme choix politique difficile ; le rôle de l'UE dans la gouvernance mondiale du climat ; tensions entre ambitions environnementales et intérêts économiques.</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. TENSIONS ET DÉBATS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">TENSIONS ET DÉBATS CLÉS</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;width:35%;">Justice climatique : qui doit payer ?</td>
        <td style="padding:8px 10px;">Les pays riches (USA, Europe) ont émis la majorité des GES depuis 1850. Les pays pauvres et émergents subissent les conséquences sans en être responsables. Principe de « responsabilités communes mais différenciées » (Rio 1992) : les pays riches doivent financer la transition des pays pauvres. Engagements de 100 milliards $/an (Copenhague 2009) jamais tenus. Fonds « pertes et préjudices » créé à la COP27 (2022) mais insuffisamment doté.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Souveraineté nationale vs bien commun mondial</td>
        <td style="padding:8px 10px;">L'Amazonie est en territoire brésilien, mais ses fonctions (stockage carbone, biodiversité) sont mondiales. Le Brésil revendique le droit de l'exploiter comme les pays riches ont exploité leurs ressources. Cette tension entre souveraineté nationale et biens communs mondiaux (climat, biodiversité) est le nœud central de la gouvernance environnementale internationale.</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 10px;font-weight:bold;">Croissance verte : possible ou oxymore ?</td>
        <td style="padding:8px 10px;">Débat entre les partisans du « découplage » (on peut continuer à croître en réduisant les émissions grâce à la technologie et à l'efficacité énergétique) et les partisans de la « décroissance » (il faut réduire la production et la consommation pour rester dans les limites planétaires). Le GIEC considère les deux scénarios techniquement possibles, mais les trajectoires actuelles ne correspondent à aucun des deux.</td>
      </tr>
      <tr>
        <td style="padding:8px 10px;font-weight:bold;">Énergie nucléaire dans la transition</td>
        <td style="padding:8px 10px;">Le nucléaire est une énergie bas carbone (émissions de CO₂ très faibles par kWh). Mais les déchets radioactifs, les risques d'accident (Tchernobyl 1986, Fukushima 2011) et les coûts de construction divisent les écologistes. L'UE a inclus le nucléaire dans sa taxonomie verte (2022) malgré les objections de l'Autriche et du Luxembourg. La France mise sur la relance du nucléaire (EPR2, 2023) dans sa stratégie de décarbonation.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 6. PLANS TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:12px;">PLANS TYPES DE DISSERTATION</div>

    <p style="font-weight:bold;margin-bottom:6px;">Sujet 1 : Montrez que concilier exploitation et protection des milieux naturels constitue un défi (Métropole 2021)</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:18px;">
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;" colspan="2">Plan thématique</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;width:25%;">I. L'exploitation des milieux : une nécessité économique et historique</td><td style="padding:7px 10px;">Révolution industrielle et exploitation massive des ressources — Agriculture, mines, pêche, forêts — Ex. : forêt française (Colbert → Landes), Amazonie (agrobusiness)</td></tr>
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;">II. La protection de l'environnement : une prise de conscience progressive et incomplète</td><td style="padding:7px 10px;">Stockholm 1972, Rio 1992, Accord de Paris 2015 — Outils : aires protégées, normes, taxe carbone — Ex. : Green Deal, ONF, GIEC</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;">III. Des tensions structurelles qui rendent le défi difficile à relever</td><td style="padding:7px 10px;">Injustice climatique — Souveraineté vs bien commun — Engagements insuffisants — Ex. : COP28, Amazonie, îles Pacifique</td></tr>
    </table>

    <p style="font-weight:bold;margin-bottom:6px;">Sujet 2 : La gouvernance internationale de l'environnement est-elle efficace ? (sujet récurrent)</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;" colspan="2">Plan dialectique</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;width:25%;">I. Des progrès réels de la coopération internationale</td><td style="padding:7px 10px;">Rio, Kyoto, Paris — Création du GIEC, du PNUE — Succès partiels (couche d'ozone : Protocole de Montréal 1987) — Ex. : Accord de Paris, Green Deal</td></tr>
      <tr style="background:#c0392b15;"><td style="padding:7px 10px;font-weight:bold;">II. Des limites structurelles persistantes</td><td style="padding:7px 10px;">Absence de mécanisme contraignant — Retrait des grandes puissances (USA) — Fossé entre engagements et réalisations — Ex. : Trump, COP28, GIEC 6e rapport</td></tr>
      <tr><td style="padding:7px 10px;font-weight:bold;">III. Des acteurs multiples qui complètent la gouvernance étatique</td><td style="padding:7px 10px;">ONG, villes, entreprises, société civile, mouvements citoyens — Greta Thunberg, accords climatiques d'entreprises — Ex. : marches pour le climat, C40 (réseau de villes)</td></tr>
    </table>
  </div>

  <!-- CHRONOLOGIE -->
  <div style="background:var(--card-bg);border-left:4px solid #7f8c8d;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">

        id:"connaissance",
        title:"L'enjeu de la connaissance",
