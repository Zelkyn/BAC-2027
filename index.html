        id:"temps",
        title:"Le temps",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">Le <strong>temps</strong> est à la fois un phénomène physique (mesuré par les horloges, étudié par les sciences) et une réalité vécue intérieurement (la conscience de passer, de vieillir, d'attendre). La formule d'Augustin résume l'énigme : <em>« Qu'est-ce donc que le temps ? Si personne ne m'interroge, je le sais ; si je veux répondre, je l'ignore. »</em> Les questions centrales : le temps existe-t-il indépendamment de la conscience qui le perçoit ? Quel rapport faut-il entretenir avec le temps pour bien vivre ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Temps ≠ Durée (Bergson)</td>
        <td style="padding:8px 12px;">Le <em>temps</em> au sens scientifique est homogène, quantitatif et mesurable (cinq minutes = cinq minutes pour tous). La <em>durée</em> (Bergson) est le temps vécu intérieurement : qualitative, hétérogène, personnelle — cinq minutes d'ennui ≠ cinq minutes de bonheur. La durée est le flux continu de la conscience, irréductible au temps des horloges.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Temps objectif ≠ Temps subjectif</td>
        <td style="padding:8px 12px;">Le <em>temps objectif</em> est celui de la physique et des calendriers : il s'écoule uniformément, indépendamment de tout observateur (bien que la relativité d'Einstein complique même cela). Le <em>temps subjectif</em> est l'expérience intérieure du temps : l'attente le dilate, le bonheur le comprime. Augustin, Bergson et Husserl insistent sur cette dimension vécue irréductible.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Passé / Présent / Futur chez Augustin</td>
        <td style="padding:8px 12px;">Augustin montre que les trois temps n'ont pas le même statut : le passé n'existe plus, le futur n'existe pas encore, le présent disparaît immédiatement. Il n'y a en réalité qu'un seul temps — le présent — mais sous trois modes : le <em>présent du passé</em> (la mémoire), le <em>présent du présent</em> (l'attention), le <em>présent du futur</em> (l'attente). Le temps est dans l'âme, non dans le monde.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Temps ≠ Éternité</td>
        <td style="padding:8px 12px;">L'<em>éternité</em> (Platon, Augustin) est l'absence totale de temps : non pas une durée infinie mais un présent absolu sans avant ni après. Le temps est une « image mobile de l'éternité » (Platon, <em>Timée</em>). Pour les stoïciens, vivre dans l'instant présent (le <em>présent vivant</em>) est la sagesse : ne pas fuir dans le passé (regret) ni dans le futur (anxiété).</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Aristote</td>
        <td style="padding:8px 12px;width:38%;"><strong>Le temps est le nombre du mouvement.</strong> Le temps n'existe pas sans mouvement ni sans âme pour le compter. C'est « le nombre du mouvement selon l'avant et l'après ». Sans conscience pour percevoir et compter les changements, il n'y aurait pas de temps — mais il n'est pas pour autant pure illusion.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ Le temps est lié au mouvement physique et à la perception de l'âme.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Augustin</td>
        <td style="padding:8px 12px;"><strong>Le temps est dans l'âme.</strong> Ni le passé ni le futur n'existent réellement. Tout le temps est dans la conscience : mémoire du passé, attention au présent, attente du futur. Le temps est une « distension de l'âme ». Cette subjectivité radicale du temps anticipe Bergson et Husserl.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « Qu'est-ce donc que le temps ? Si personne ne m'interroge, je le sais ; si je veux répondre, je l'ignore. »</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Kant</td>
        <td style="padding:8px 12px;"><strong>Le temps est une forme a priori de la sensibilité.</strong> Le temps n'est pas une propriété des choses en elles-mêmes : c'est la forme sous laquelle notre sensibilité reçoit toute expérience intérieure. Tout phénomène est nécessairement perçu dans le temps — mais les choses en soi (noumènes) ne sont pas temporelles.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Le temps est une condition de notre expérience, non une réalité extérieure.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Bergson</td>
        <td style="padding:8px 12px;"><strong>La durée est le temps véritable.</strong> Le temps scientifique spatialise et fige le temps en instants mesurables, trahissant la réalité vécue. La durée est le flux continu et indivisible de la conscience : elle ne peut être découpée en instants sans être déformée. Vivre dans la durée, c'est accéder à la liberté — car la durée est création, non répétition.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La liberté est possible parce que la durée est imprévisible et créatrice.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Heidegger</td>
        <td style="padding:8px 12px;"><strong>L'homme est un être-vers-la-mort.</strong> La temporalité est la structure fondamentale de l'existence humaine (Dasein). Être conscient de sa finitude — que l'on mourra — est ce qui donne un sens urgent et propre à chaque instant. L'authenticité consiste à assumer sa temporalité au lieu de se fuir dans le divertissement ou l'on-dit.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La mort n'est pas un événement futur : c'est une possibilité toujours présente qui donne sens à l'existence.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Augustin <span style="font-weight:normal;color:#888;font-size:13px;">— Confessions, Livre XI (env. 400 ap. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le temps est une réalité de l'âme : mémoire, attention et attente sont les trois présents par lesquels nous vivons le temps.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Qu'est-ce donc que le temps ? Si personne ne m'interroge, je le sais ; si je veux répondre, je l'ignore. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Bergson <span style="font-weight:normal;color:#888;font-size:13px;">— Essai sur les données immédiates de la conscience (1889)</span></div>
        <div style="margin:6px 0;font-size:14px;">La durée est le temps vécu, qualitatif et continu — irréductible au temps spatialisé et quantitatif de la science.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« La durée pure est la forme que prend la succession de nos états de conscience quand notre moi se laisse vivre. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Heidegger <span style="font-weight:normal;color:#888;font-size:13px;">— Être et Temps (1927)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'existence humaine est fondamentalement temporelle. La mort comme possibilité toujours présente donne son sens à chaque instant.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le Dasein est un être-vers-la-mort. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Nietzsche <span style="font-weight:normal;color:#888;font-size:13px;">— Ainsi parlait Zarathoustra (1883)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'éternel retour : si tu devais revivre chaque instant de ta vie infiniment, le vivras-tu autrement ? C'est le test suprême de l'affirmation de la vie.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Et si ce démon te disait : cette vie, tu devras la revivre encore une fois et d'innombrables fois ? »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Marc Aurèle <span style="font-weight:normal;color:#888;font-size:13px;">— Pensées pour moi-même (IIe siècle)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le passé est révolu, le futur incertain : seul l'instant présent nous appartient vraiment. La sagesse stoïcienne est de vivre pleinement dans le présent.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Ne perds pas le reste de ta vie à te soucier d'autrui… Regarde en toi-même. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">Le temps est-il réel ou une illusion de la conscience ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Aristote (réel, lié au mouvement) / Augustin (dans l'âme) / Kant (forme a priori)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Peut-on être maître du temps ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Stoïciens (maîtrise de l'instant) / Bergson (durée créatrice) / Heidegger (assumer la finitude)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">Comment bien vivre avec le temps ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Épicure (carpe diem) / stoïciens (présent) / Nietzsche (éternel retour) / Heidegger (authenticité)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">La conscience du temps est-elle un fardeau ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Pascal (angoisse de la mort) / Heidegger (authenticité) / Bergson (liberté dans la durée)</td>
      </tr>
    </table>
  </div>

</div>`

      {
        id:"travail",
        title:"Le travail",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">Le <strong>travail</strong> (du latin <em>tripalium</em> : instrument de torture — étymologie qui dit déjà la souffrance) désigne toute activité humaine consciente et organisée visant à transformer la nature ou à produire des biens et des services utiles. Il se distingue du jeu (activité gratuite) et du loisir (repos). La tension centrale : le travail est-il fondamentalement une <em>peine</em> (malédiction biblique, aliénation capitaliste) ou un <em>moyen d'accomplissement</em> (réalisation de soi, reconnaissance sociale) ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Travail ≠ Labeur ≠ Œuvre (Arendt)</td>
        <td style="padding:8px 12px;">Hannah Arendt distingue trois activités : le <em>labeur</em> (<em>labor</em>) — activité biologique répétitive liée à la survie (manger, nettoyer), sans résultat durable ; l'<em>œuvre</em> (<em>work</em>) — fabrication d'objets durables qui constituent un monde humain stable (un bâtiment, un livre) ; l'<em>action</em> (<em>action</em>) — activité politique par laquelle l'homme révèle qui il est. La modernité tend à réduire tout travail au labeur.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Travail salarié ≠ Activité libre</td>
        <td style="padding:8px 12px;">Pour Marx, le <em>travail salarié</em> dans le capitalisme n'est pas libre : l'ouvrier vend sa force de travail, ne possède pas ce qu'il produit et obéit à un rythme qu'il ne maîtrise pas. Un <em>travail libre</em> (au sens marxiste) serait une activité créatrice où l'homme exprime ses capacités propres et reconnaît son produit comme le sien.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Aliénation ≠ Simple pénibilité</td>
        <td style="padding:8px 12px;">La <em>pénibilité</em> est la souffrance physique ou la fatigue liée à certaines tâches — elle peut coexister avec un sentiment d'accomplissement. L'<em>aliénation</em> (Marx) est plus profonde : c'est le fait que l'ouvrier devient étranger à son activité, à son produit, à ses semblables et à sa propre nature. L'aliéné ne se reconnaît pas dans ce qu'il fait.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Travail ≠ Emploi</td>
        <td style="padding:8px 12px;">L'<em>emploi</em> est une forme sociale et juridique du travail : un contrat, un salaire, un statut. Le <em>travail</em> est plus large : il inclut le travail domestique, le bénévolat, la création artistique — qui ne sont pas des emplois mais sont des formes réelles d'activité productive et signifiante. Confondre les deux conduit à dévaloriser le travail non rémunéré.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Hegel</td>
        <td style="padding:8px 12px;width:38%;"><strong>Le travail est formateur et humanisant.</strong> La dialectique du maître et de l'esclave montre que c'est l'esclave qui se libère par le travail : en transformant la matière, il se transforme lui-même, développe sa conscience et imprime sa marque sur le monde. Le maître, en ne travaillant pas, reste prisonnier du désir immédiat et dépendant de l'esclave.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ Paradoxe hégélien : c'est celui qui travaille qui est vraiment libre, non celui qui se fait servir.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Marx</td>
        <td style="padding:8px 12px;"><strong>Le travail capitaliste aliène l'ouvrier.</strong> Le travail devrait être l'expression la plus haute de l'humanité — la capacité à produire librement et consciemment. Mais dans le capitalisme, l'ouvrier est aliéné : il ne possède ni son activité, ni son produit, ni ses collègues, ni sa propre essence. La révolution doit libérer le travail de cette aliénation.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « Le travail est extérieur à l'ouvrier […] il ne se sent lui-même que dans ses moments de loisir. »</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Aristote</td>
        <td style="padding:8px 12px;"><strong>Le travail manuel est inférieur à la vie contemplative.</strong> Le travail est nécessaire mais il n'est pas la finalité de la vie humaine. L'homme accompli est celui qui peut se libérer du travail pour se consacrer à la vie politique et à la contemplation philosophique. C'est pourquoi Aristote justifie l'esclavage — à tort — comme condition de la liberté des citoyens.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Vision aristocratique : le loisir et la contemplation valent plus que le travail.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Arendt</td>
        <td style="padding:8px 12px;"><strong>La modernité dévalorise l'œuvre au profit du labeur.</strong> La société moderne a fait du travail-labeur (la consommation répétitive) sa valeur suprême — au détriment de l'œuvre durable et de l'action politique. Une société entièrement centrée sur le travail-labeur produit une humanité sans monde stable ni mémoire.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La « société de laboureurs sans labeur » : l'automatisation supprime le travail sans libérer du labeur.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Hegel <span style="font-weight:normal;color:#888;font-size:13px;">— Phénoménologie de l'Esprit (1807)</span></div>
        <div style="margin:6px 0;font-size:14px;">Par le travail, l'esclave se libère et prend conscience de lui-même en transformant le monde — paradoxe libérateur du travail.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« C'est par le travail que la conscience de soi se dégage. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Marx <span style="font-weight:normal;color:#888;font-size:13px;">— Manuscrits de 1844</span></div>
        <div style="margin:6px 0;font-size:14px;">Dans le capitalisme, le travail aliène l'ouvrier : il lui devient étranger, extérieur, hostile — une peine et non un accomplissement.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le travail est extérieur à l'ouvrier, il ne fait pas partie de son être ; dans son travail, il ne s'affirme pas, il se nie. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Arendt <span style="font-weight:normal;color:#888;font-size:13px;">— Condition de l'homme moderne (1958)</span></div>
        <div style="margin:6px 0;font-size:14px;">La modernité confond le labeur (activité biologique répétitive) et l'œuvre (fabrication d'un monde durable) au détriment de la vie humaine.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Nous sommes peut-être les premiers à nous trouver devant une société de laboureurs sans labeur. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Simone Weil <span style="font-weight:normal;color:#888;font-size:13px;">— La Condition ouvrière (1951)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le travail répétitif et sans pensée détruit l'âme du travailleur. Mais un travail accompli avec conscience et attention peut être une voie spirituelle.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'attention est la forme la plus rare et la plus pure de la générosité. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Voltaire <span style="font-weight:normal;color:#888;font-size:13px;">— Candide (1759)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le travail éloigne trois grands maux : l'ennui, le vice et le besoin. Philosophie pragmatique du travail comme hygiène de vie.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Il faut cultiver notre jardin. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">Le travail est-il une contrainte ou un accomplissement ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Marx (aliénation) / Hegel (libération par le travail) / Aristote (inférieur à la contemplation)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Le travail donne-t-il un sens à la vie ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Hegel, Simone Weil (oui) / Marx (aliénation) / Aristote (non, le loisir est supérieur)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">Le travail est-il nécessaire à l'humanité de l'homme ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Bergson (homo faber) / Arendt (labeur/œuvre/action) / Marx (essence de l'homme)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Peut-on se réaliser dans le travail ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Hegel (oui) / Marx (pas dans le capitalisme) / Arendt (seulement si œuvre, pas labeur)</td>
      </tr>
    </table>
  </div>

</div>`

      {
        id:"verite",
        title:"La vérité",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">La <strong>vérité</strong> est classiquement définie comme l'<em>adéquation entre un jugement et la réalité</em> (Aristote : <em>adaequatio intellectus et rei</em>). Mais cette définition soulève aussitôt des questions : peut-on toujours accéder à la réalité telle qu'elle est ? La vérité est-elle unique et universelle, ou relative à un point de vue, une culture, une époque ? Et pourquoi rechercher la vérité — est-elle toujours bonne à connaître ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Vérité ≠ Réalité</td>
        <td style="padding:8px 12px;">La <em>réalité</em> est ce qui existe — les choses, les événements, le monde. La <em>vérité</em> est une propriété des <em>jugements</em> ou des <em>propositions</em> sur la réalité : une phrase peut être vraie ou fausse, mais un arbre n'est ni vrai ni faux. La réalité ne trompe jamais — seul notre jugement sur elle peut être faux.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Vérité ≠ Certitude</td>
        <td style="padding:8px 12px;">La <em>certitude</em> est un état psychologique : on est certain de quelque chose quand on n'en doute pas. La <em>vérité</em> est une propriété objective d'une proposition. On peut être certain d'une chose fausse (fanatisme, illusion) et incertain d'une chose vraie (doute scientifique sain). La certitude subjective ne garantit pas la vérité objective.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Vérité ≠ Opinion (Platon)</td>
        <td style="padding:8px 12px;">L'<em>opinion droite</em> (<em>doxa orthé</em>) peut avoir les mêmes effets pratiques qu'une vraie connaissance, mais elle reste fragile : elle peut se tromper et ne sait pas pourquoi elle est vraie. La <em>connaissance</em> (<em>épistémè</em>) est une opinion vraie et justifiée — elle sait les raisons de sa vérité et ne peut donc pas être renversée facilement.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Vérité de raison ≠ Vérité de fait (Leibniz)</td>
        <td style="padding:8px 12px;">Les <em>vérités de raison</em> sont nécessaires et universelles : elles ne peuvent pas être autrement (2+2=4, le triangle a trois côtés). Les <em>vérités de fait</em> sont contingentes : elles auraient pu être autrement (César a traversé le Rubicon — il aurait pu ne pas le faire). Cette distinction anticipe Kant (analytique/synthétique) et Hume (relations d'idées/questions de fait).</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Platon</td>
        <td style="padding:8px 12px;width:38%;"><strong>La vérité est dans le monde des Idées.</strong> Le monde sensible est un monde d'apparences — les choses changent, se contredisent, trompent les sens. La vraie réalité est le monde des Idées, éternel et immuable. L'allégorie de la caverne dit que nous vivons dans l'illusion et que la philosophie est la sortie vers la lumière de la vérité.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ La vérité est transcendante : elle dépasse le monde sensible et s'atteint par la raison pure.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Descartes</td>
        <td style="padding:8px 12px;"><strong>La vérité se fonde sur l'évidence rationnelle.</strong> Le doute méthodique élimine tout ce qui peut être mis en doute pour ne retenir que l'indubitable. La règle de la vérité : n'admettre que ce qui est clair et distinct. Le cogito est la première vérité certaine, fondement de toutes les autres.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La vérité est intérieure : elle est dans les idées claires et distinctes de la raison, non dans l'expérience sensible.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Kant</td>
        <td style="padding:8px 12px;"><strong>La vérité est la conformité à l'expérience possible.</strong> On ne peut connaître que les phénomènes (ce qui apparaît dans l'expérience structurée par nos formes a priori). La vérité d'un jugement, c'est sa conformité aux lois de l'entendement et à l'expérience possible — pas aux choses en soi, inaccessibles.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La vérité est limitée au domaine phénoménal : les questions métaphysiques (Dieu, âme, liberté) échappent à la connaissance vraie.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Nietzsche</td>
        <td style="padding:8px 12px;"><strong>La vérité est une illusion nécessaire.</strong> Il n'y a pas de vérité en soi : ce que nous appelons « vérité » est une métaphore usée, une fiction pratique que nous avons oubliée d'être une fiction. Les « vérités » sont des perspectives — des interprétations utiles à la vie. La volonté de vérité est elle-même une valeur morale qui peut devenir ennemie de la vie.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « Il n'y a pas de faits, seulement des interprétations. »</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Popper</td>
        <td style="padding:8px 12px;"><strong>La vérité scientifique est provisoire et réfutable.</strong> On n'atteint jamais la vérité définitive en science : on approche la vérité en éliminant les erreurs par la réfutation. Une théorie est vraie provisoirement — jusqu'à ce qu'une expérience la réfute. La vérité est un idéal régulateur, non un état définitif.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La science avance par conjectures et réfutations : la vérité est au bout d'une erreur surmontée.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Aristote <span style="font-weight:normal;color:#888;font-size:13px;">— Métaphysique (env. 335 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">La vérité est l'adéquation du jugement et de la réalité : dire ce qui est qu'il est, et ce qui n'est pas qu'il n'est pas.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Dire de ce qui est qu'il est, et de ce qui n'est pas qu'il n'est pas, c'est vrai. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Descartes <span style="font-weight:normal;color:#888;font-size:13px;">— Méditations métaphysiques (1641)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le doute méthodique conduit à la première vérité indubitable : le cogito. La clarté et la distinction sont les critères de la vérité.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Je pense, donc je suis. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Nietzsche <span style="font-weight:normal;color:#888;font-size:13px;">— Le Gai Savoir (1882) / Par-delà Bien et Mal (1886)</span></div>

let fcDeck = [];
let fcIndex = 0;

function fcOpen(chapitreId, section) {
  // Récupérer les cartes selon la section
  const chapitre = flashcardsData[chapitreId];
  if (!chapitre) { fcDeck = []; }
  else if (section === "_all") {
    // Toutes les cartes du chapitre
    fcDeck = collectAll(chapitre);
  } else if (section.includes(".")) {
    // Sous-partie ex : "I.A"
    const [grand, sub] = section.split(".");
    fcDeck = (chapitre[grand] && chapitre[grand][sub]) ? [...chapitre[grand][sub]] : [];
  } else {
    // Grande partie ex : "I" → toutes les cartes de I._all + I.A + I.B + I.C
    fcDeck = chapitre[section] ? collectAll(chapitre[section]) : [];
  }

  // Mélanger aléatoirement
  fcDeck = shuffle(fcDeck);
  fcIndex = 0;

  // Titre de l'overlay
  const titreSection = section === "_all" ? "Tout le chapitre"
    : section.includes(".") ? "Partie " + section
    : "Partie " + section + " — tout";
  document.getElementById("fc-title").textContent =
    "Flashcards · " + chapitreId.charAt(0).toUpperCase() + chapitreId.slice(1).replace(/_/g," ")
    + " · " + titreSection;

  // Afficher
  document.getElementById("fc-overlay").classList.add("open");
  document.body.style.overflow = "hidden";
  fcRender();
}

function collectAll(obj) {
  // Récupère récursivement toutes les cartes d'un objet (y compris _all et sous-sections)
  let cards = [];
  for (const key in obj) {
    if (Array.isArray(obj[key])) {
      cards = cards.concat(obj[key]);
    } else if (typeof obj[key] === "object") {
      cards = cards.concat(collectAll(obj[key]));
    }
  }
  return cards;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fcRender() {
  const box = document.getElementById("fc-box");
  const controls = document.getElementById("fc-controls");
  const hint = document.getElementById("fc-hint");
  const empty = document.getElementById("fc-empty");

  if (fcDeck.length === 0) {
    box.style.display = "none";
    controls.style.display = "none";
    hint.style.display = "none";
    empty.style.display = "block";
    return;
  }

  box.style.display = "block";
  controls.style.display = "flex";
  hint.style.display = "block";
  empty.style.display = "none";

  // Reset flip
  document.getElementById("fc-inner").classList.remove("flipped");

  const card = fcDeck[fcIndex];
  document.getElementById("fc-q").innerHTML = card.q;
  document.getElementById("fc-r").innerHTML = card.r;
  document.getElementById("fc-counter").textContent = (fcIndex + 1) + " / " + fcDeck.length;
  document.getElementById("fc-prev").disabled = (fcIndex === 0);
  document.getElementById("fc-next").disabled = (fcIndex === fcDeck.length - 1);
}

function fcFlip() {
  document.getElementById("fc-inner").classList.toggle("flipped");
}

function fcNav(dir) {
  fcIndex = Math.max(0, Math.min(fcDeck.length - 1, fcIndex + dir));
  fcRender();
}

function fcClose() {
  document.getElementById("fc-overlay").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("fc-inner").classList.remove("flipped");
}

// Fermer avec Échap
document.addEventListener("keydown", e => {
  if (e.key === "Escape") fcClose();
  if (e.key === "ArrowRight") fcNav(1);
  if (e.key === "ArrowLeft") fcNav(-1);
  if (e.key === " ") { e.preventDefault(); fcFlip(); }
});

// Mémorise où on en est (accueil → matière → fiche)
let currentMatiere = null;

function toggleAccord(el){
  // Le bloc à déplier est le premier .accord-content qui suit le bouton cliqué
  let content = el.nextElementSibling;
  while (content && !content.classList.contains('accord-content')) content = content.nextElementSibling;
  if (!content) return;
  const isOpen = content.classList.toggle('open');
  const chevron = el.querySelector('.accord-chevron');
  if (chevron) chevron.classList.toggle('open', isOpen);
  el.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

// Affiche la liste des matières sur l'accueil
function renderHome(){
  document.getElementById("contentList").innerHTML =
    matieres.map(m => `
      <div class="card" onclick="ouvrirMatiere('${m.id}')">
        <div class="card-title">${m.title}</div>
        ${m.sub ? `<div class="card-sub">${m.sub}</div>` : ""}
      </div>
    `).join("");
}

// Ouvre une matière (affiche ses fiches ou "aucun contenu")
function ouvrirMatiere(id){
  const m = matieres.find(x => x.id === id);
  if(!m) return;
  currentMatiere = m;

  afficherViewer(m.title);

  if(m.fiches && m.fiches.length > 0){
    // Affiche la liste des fiches de cette matière
    document.getElementById("content").innerHTML = `
      <div id="subList">
        ${m.fiches.map(f => `
          <div class="card ${f.classe}" onclick="ouvrirFiche('${m.id}','${f.id}')">
            <div class="card-title">${f.title}</div>
          </div>
        `).join("")}
      </div>`;
  } else {
    document.getElementById("content").innerHTML =
      `<p class="empty-msg">Aucun contenu pour le moment…</p>`;
  }
}

// Ouvre une fiche individuelle
function ouvrirFiche(matiereId, ficheId){
  const m = matieres.find(x => x.id === matiereId);
  if(!m) return;
  const f = m.fiches.find(x => x.id === ficheId);
  if(!f) return;

  // Bandeau origine
  const bandeaux = {
  vide:         { label: "Aucune origine renseignée",  css: "bandeau-vide"        },
  web:          { label: "Origine internet",           css: "bandeau-web"         },
  "web-ia":     { label: "Origine internet + IA",      css: "bandeau-web-ia"      },
  ia:           { label: "Origine IA",                 css: "bandeau-ia"          },
  "ia-humain":  { label: "Origine IA + humaine",       css: "bandeau-ia-humain"   },
  "web-humain": { label: "Origine internet + humaine", css: "bandeau-web-humain"  },
  humain:       { label: "Origine humaine",            css: "bandeau-humain"      }
};
  const classeBase = f.classe ? f.classe.replace("hors-programme","").trim() : "vide";
  const b = bandeaux[classeBase] || bandeaux.vide;

  // Pastille hors programme (dans la fiche ouverte)
  const horsProgBadge = f.classe && f.classe.includes("hors-programme")
    ? `<div><span class="badge-hors-programme">⚠ Hors programme</span></div>`
    : "";

  afficherViewer(f.title);

  document.getElementById("content").innerHTML =
    `<div style="width:100%;max-width:760px;">
       ${horsProgBadge}
       <div class="bandeau-origine ${b.css}">● ${b.label}</div>
       ${f.content
         ? f.content
         : `<p class="empty-msg">Aucun contenu pour le moment…</p>`}
     </div>`;
}

// Bouton retour : remonte d'un niveau
function back(){
  if(currentMatiere && document.getElementById("page-title").textContent !== currentMatiere.title){
    // On est dans une fiche → on remonte à la matière
    ouvrirMatiere(currentMatiere.id);
  } else {
    // On est dans une matière → on remonte à l'accueil
    currentMatiere = null;
    document.getElementById("viewer").style.display = "none";
    document.getElementById("home").style.display   = "flex";
    document.getElementById("backContainer").classList.remove("visible");
    document.getElementById("page-title").textContent = "";
    window.scrollTo(0,0);
  }
}

// Utilitaire : bascule sur l'écran viewer
function afficherViewer(titre){
  document.getElementById("home").style.display   = "none";
  document.getElementById("viewer").style.display = "block";
  document.getElementById("backContainer").classList.add("visible");
  document.getElementById("page-title").textContent = titre;
  window.scrollTo(0,0);
}

function isNightHour(){ const h = new Date().getHours(); return h>=21||h<6; }
function applyNight(on){
  document.body.classList.toggle("night", on);
}
function toggleNight(){
  nightManual = !document.body.classList.contains("night");
  applyNight(nightManual);
}
function initNight(){ if(nightManual===null) applyNight(isNightHour()); }
initNight();
setInterval(()=>{ if(nightManual===null) applyNight(isNightHour()); }, 60000);
