      {
        id:"conscience",
        title:"La conscience",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">La <strong>conscience</strong> désigne la capacité de l'esprit à se représenter lui-même et le monde. Du latin <em>cum scientia</em> (« savoir avec »), elle implique un rapport à soi et au monde simultané. La question centrale est : la conscience est-elle <em>transparente à elle-même</em> (maîtresse de ses propres contenus) ou au contraire traversée par des forces qui lui échappent (inconscient, déterminismes) ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Conscience immédiate vs réflexive</td>
        <td style="padding:8px 12px;">La <em>conscience immédiate</em> est le simple fait d'être éveillé et de percevoir (« je vois ce mur »). La <em>conscience réflexive</em> est le retour sur soi-même (« je pense que je pense »). C'est cette deuxième que Descartes fonde avec le cogito.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Conscience psychologique vs morale</td>
        <td style="padding:8px 12px;">La <em>conscience psychologique</em> est la représentation de soi et du monde. La <em>conscience morale</em> est la capacité à juger ses propres actes selon le bien et le mal — c'est une forme de tribunal intérieur.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Conscience ≠ Inconscient</td>
        <td style="padding:8px 12px;">Pour Descartes, tout ce qui est dans l'esprit est conscient — l'inconscient est impensable. Freud renverse cela : la conscience n'est que la partie émergée d'un iceberg dont la masse cachée (inconscient) détermine nos pensées et comportements à notre insu.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Conscience de soi ≠ Identité personnelle</td>
        <td style="padding:8px 12px;">Locke distingue la <em>conscience</em> (présente) de l'<em>identité personnelle</em> (continuité dans le temps fondée sur la mémoire). Je suis la même personne qu'hier parce que j'ai le souvenir de mes actes passés — sans mémoire, l'identité s'efface.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Descartes</td>
        <td style="padding:8px 12px;width:38%;"><strong>La conscience est le fondement de toute certitude.</strong> Le cogito (<em>je pense, donc je suis</em>) est la première vérité indubitable. La conscience est transparente à elle-même : tout ce qui est dans l'esprit est nécessairement conscient.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ Le sujet cartésien est maître de lui-même, souverain de sa pensée.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Freud</td>
        <td style="padding:8px 12px;"><strong>La conscience est minoritaire dans le psychisme.</strong> Le ça (pulsions inconscientes), le moi (médiateur) et le surmoi (instance morale) montrent que la conscience n'est qu'une surface. « L'homme n'est pas maître dans sa propre maison. »</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Troisième blessure narcissique : après Copernic (la Terre n'est pas au centre) et Darwin (l'homme vient du singe), Freud dit que le moi n'est pas maître de lui-même.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Sartre</td>
        <td style="padding:8px 12px;"><strong>La conscience est néant et liberté absolue.</strong> La conscience n'est pas une chose, elle est ce qui échappe à toute définition : elle est toujours <em>au-delà</em> d'elle-même, projetée vers le monde. « L'existence précède l'essence. » On n'est pas une nature fixée, on se choisit.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La mauvaise foi : se croire déterminé pour fuir sa liberté — c'est nier sa propre conscience.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Marx</td>
        <td style="padding:8px 12px;"><strong>La conscience est déterminée par les conditions matérielles.</strong> « Ce n'est pas la conscience des hommes qui détermine leur existence, c'est leur existence sociale qui détermine leur conscience. » L'idéologie masque les rapports de domination réels.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La conscience est trompeuse : elle croit être libre alors qu'elle est le produit de sa classe sociale.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Husserl</td>
        <td style="padding:8px 12px;"><strong>Toute conscience est conscience de quelque chose.</strong> L'intentionnalité est la structure fondamentale de la conscience : elle n'existe que tournée vers un objet. La conscience n'est pas un miroir passif, elle constitue activement le sens du monde.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La phénoménologie : étudier les phénomènes tels qu'ils apparaissent à la conscience, pas tels qu'ils sont « en soi ».</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Descartes <span style="font-weight:normal;color:#888;font-size:13px;">— Méditations métaphysiques (1641)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le cogito fonde la certitude du sujet pensant. La conscience est l'unique certitude indubitable.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Je pense, donc je suis. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Freud <span style="font-weight:normal;color:#888;font-size:13px;">— Introduction à la psychanalyse (1916)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'inconscient domine la conscience. Le moi n'est pas maître dans sa propre maison.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le moi n'est pas maître dans sa propre maison. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Sartre <span style="font-weight:normal;color:#888;font-size:13px;">— L'Être et le Néant (1943)</span></div>
        <div style="margin:6px 0;font-size:14px;">La conscience est liberté radicale. La mauvaise foi consiste à nier cette liberté en se croyant déterminé.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'autre est le médiateur entre moi et moi-même. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Marx <span style="font-weight:normal;color:#888;font-size:13px;">— Préface à la Contribution à la critique de l'économie politique (1859)</span></div>
        <div style="margin:6px 0;font-size:14px;">La conscience est déterminée par les conditions matérielles d'existence, non l'inverse.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Ce n'est pas la conscience des hommes qui détermine leur existence, c'est leur existence sociale qui détermine leur conscience. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Bergson <span style="font-weight:normal;color:#888;font-size:13px;">— Essai sur les données immédiates de la conscience (1889)</span></div>
        <div style="margin:6px 0;font-size:14px;">La conscience est durée : elle n'est pas un instantané figé, elle est flux, mémoire vivante et création continue.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Conscience signifie d'abord mémoire. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">La conscience peut-elle se connaître elle-même ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Descartes (oui, cogito) / Freud (non, l'inconscient la dépasse) / Sartre (elle se fuit)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">La conscience fait-elle de l'homme un être libre ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Descartes, Sartre (oui) / Freud, Marx (non, déterminée)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">Peut-on se connaître soi-même ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Socrate (« connais-toi toi-même ») / Freud (limites de l'introspection) / Sartre (l'autre comme miroir)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">La conscience est-elle ce qui définit l'homme ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Descartes / Husserl / Marx / Darwin (évolution)</td>
      </tr>
    </table>
  </div>

</div>`

      {
        id:"devoir",
        title:"Le devoir",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">Le <strong>devoir</strong> désigne ce que l'on est moralement obligé de faire, indépendamment de nos désirs et de nos intérêts. Il se distingue de la <em>contrainte</em> (qui est physique ou sociale et extérieure à la volonté) et de l'<em>obligation juridique</em> (qui est légale). Le devoir moral est intérieur : c'est un impératif que la raison ou la conscience se donne à elle-même. La question centrale : d'où vient le devoir, et comment l'identifier ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Devoir ≠ Contrainte</td>
        <td style="padding:8px 12px;">La contrainte vient de l'extérieur et s'impose par la force (loi, peur de la punition). Le devoir vient de l'intérieur : on se l'impose à soi-même par la raison ou la conscience morale. Agir par contrainte n'a aucune valeur morale chez Kant.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Agir <em>par</em> devoir ≠ Agir <em>conformément au</em> devoir</td>
        <td style="padding:8px 12px;">Distinction capitale chez Kant. Un commerçant honnête par intérêt commercial agit <em>conformément</em> au devoir (le résultat est correct) mais pas <em>par</em> devoir (sa motivation est intéressée). Seul l'acte accompli <em>par</em> devoir a une valeur morale.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Impératif hypothétique ≠ catégorique</td>
        <td style="padding:8px 12px;">L'impératif <em>hypothétique</em> conditionne l'action à un but : « Si tu veux réussir, travaille. » L'impératif <em>catégorique</em> est inconditionné : « Tu dois dire la vérité », sans condition ni exception. Seul le second est vraiment moral selon Kant.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Morale déontologique ≠ utilitariste</td>
        <td style="padding:8px 12px;">La morale <em>déontologique</em> (Kant) juge l'acte selon son intention et sa conformité à la loi morale, indépendamment des conséquences. La morale <em>utilitariste</em> (Mill) juge l'acte selon ses conséquences : est moral ce qui maximise le bonheur du plus grand nombre.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Kant</td>
        <td style="padding:8px 12px;width:38%;"><strong>Le devoir est universel et rationnel.</strong> La loi morale se formule en un impératif catégorique : « Agis uniquement selon la maxime qui fait que tu puisses vouloir en même temps qu'elle devienne une loi universelle. » Le devoir est indépendant des désirs, des conséquences et des cultures.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ La bonne volonté est la seule chose bonne sans restriction — agir bien par devoir, non par peur ou intérêt.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Mill (utilitarisme)</td>
        <td style="padding:8px 12px;"><strong>Le devoir est de maximiser le bonheur collectif.</strong> Un acte est moral si ses conséquences sont les meilleures possibles pour le plus grand nombre. La motivation importe peu : ce qui compte, c'est le résultat. Vision plus réaliste mais exposée au risque de sacrifier une minorité pour la majorité.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Critique de Kant : une règle absolue (ne jamais mentir) peut mener à des conséquences catastrophiques.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Aristote</td>
        <td style="padding:8px 12px;"><strong>Le devoir découle de la vertu et de la finalité humaine.</strong> Pas d'impératif abstrait : le bien moral est ce qui permet à l'homme d'accomplir sa nature. La prudence (<em>phronèsis</em>) permet de trouver la juste mesure dans chaque situation — pas de règle rigide.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Morale des vertus : on devient bon en accomplissant des actes bons, comme on devient musicien en pratiquant la musique.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Sartre</td>
        <td style="padding:8px 12px;"><strong>Aucune règle ne peut nous dispenser de choisir.</strong> Il n'existe aucune loi morale universelle préétablie. Chaque individu doit inventer son propre devoir dans chaque situation. L'angoisse est inévitable car on ne peut se décharger sur aucune autorité externe.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ L'exemple du jeune homme : partir au front (devoir patriotique) ou rester avec sa mère (devoir filial) — aucune règle ne tranche.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Hannah Arendt</td>
        <td style="padding:8px 12px;"><strong>Le devoir sans pensée mène au Mal.</strong> Adolf Eichmann exécutait ses ordres « par devoir » sans jamais penser à ce qu'il faisait. La <em>banalité du mal</em> : l'obéissance aveugle à un devoir mal compris peut être criminelle. Le vrai devoir moral exige de penser.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Utile pour montrer les limites d'une morale purement formelle ou d'une obéissance sans réflexion.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Kant <span style="font-weight:normal;color:#888;font-size:13px;">— Fondements de la métaphysique des mœurs (1785)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le devoir est un impératif catégorique universel. La bonne volonté est la seule chose bonne sans restriction.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Agis uniquement d'après la maxime qui fait que tu puisses vouloir en même temps qu'elle devienne une loi universelle. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Kant — 2e formulation <span style="font-weight:normal;color:#888;font-size:13px;">— Fondements de la métaphysique des mœurs (1785)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'humanité comme fin en soi : on ne doit jamais traiter un être humain uniquement comme un moyen.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Agis de telle sorte que tu traites l'humanité, aussi bien dans ta personne que dans la personne de tout autre, toujours en même temps comme une fin, et jamais simplement comme un moyen. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Mill <span style="font-weight:normal;color:#888;font-size:13px;">— L'Utilitarisme (1863)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le devoir est de maximiser le bonheur du plus grand nombre, en tenant compte de la qualité et de la quantité des plaisirs.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Il vaut mieux être Socrate mécontent qu'un imbécile satisfait. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Sartre <span style="font-weight:normal;color:#888;font-size:13px;">— L'existentialisme est un humanisme (1945)</span></div>
        <div style="margin:6px 0;font-size:14px;">Il n'y a pas de morale préétablie. Chacun doit inventer son devoir dans l'angoisse de la liberté.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'homme est condamné à être libre. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Hannah Arendt <span style="font-weight:normal;color:#888;font-size:13px;">— Eichmann à Jérusalem (1963)</span></div>
        <div style="margin:6px 0;font-size:14px;">La banalité du mal : obéir mécaniquement à un devoir sans penser peut conduire aux pires crimes.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« La banalité du mal » — Eichmann n'était pas un monstre mais un fonctionnaire qui n'avait jamais appris à penser.</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">Le devoir est-il compatible avec le bonheur ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Kant (tension) / Aristote (vertu = bonheur) / Mill (devoir = maximiser bonheur)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Peut-on toujours savoir ce qu'on doit faire ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Kant (oui, la raison suffit) / Sartre (non, angoisse du choix) / Aristote (phronèsis)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">Le devoir exclut-il tout sentiment ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Kant (oui) / Hume (non, la raison est esclave des passions) / Aristote (vertu inclut les émotions bien réglées)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">A-t-on le devoir d'obéir aux lois ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Hobbes / Rousseau / Thoreau (désobéissance civile) / Arendt</td>
      </tr>
    </table>
  </div>

</div>`

      {
        id:"etat",
        title:"L'État",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">L'<strong>État</strong> désigne l'ensemble des institutions politiques qui exercent un pouvoir souverain sur un territoire et une population délimités. Il se caractérise par le <em>monopole de la violence légitime</em> (Max Weber) : lui seul est autorisé à user de la force au nom de la loi. La question centrale : l'État est-il une nécessité naturelle ou une construction artificielle ? Et jusqu'où son autorité est-elle légitime ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">État ≠ Nation</td>
        <td style="padding:8px 12px;">L'État est une structure juridique et politique (institutions, lois, gouvernement). La nation est un sentiment d'appartenance culturelle, historique, linguistique partagé. Il peut y avoir des nations sans État (peuple kurde) et des États multinationaux (Suisse).</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">État ≠ Gouvernement</td>
        <td style="padding:8px 12px;">Le gouvernement est l'organe qui exerce le pouvoir exécutif à un moment donné. L'État est la structure permanente qui lui survit. Un gouvernement change ; l'État demeure.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Légalité ≠ Légitimité</td>
        <td style="padding:8px 12px;">Un État peut être <em>légal</em> (respecter ses propres lois) sans être <em>légitime</em> (reconnu comme juste par les gouvernés). Les régimes totalitaires sont légaux selon leur propre droit mais illégitimes moralement. Rousseau : la légitimité vient du consentement du peuple.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">État de nature ≠ État civil</td>
        <td style="padding:8px 12px;">L'<em>état de nature</em> est la situation hypothétique des hommes avant tout État (Hobbes, Locke, Rousseau l'imaginent différemment). L'<em>état civil</em> est la condition de l'homme sous l'autorité de l'État. Le contrat social est le passage de l'un à l'autre.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Aristote</td>
        <td style="padding:8px 12px;width:38%;"><strong>L'homme est un animal politique.</strong> L'État (la cité) n'est pas une construction artificielle : il est la forme naturelle et nécessaire de la vie humaine. Hors de la cité, un être ne peut être qu'une bête ou un dieu. L'État précède logiquement l'individu.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ L'État est naturel, non contractuel.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Hobbes</td>
        <td style="padding:8px 12px;"><strong>Sans État, c'est la guerre de tous contre tous.</strong> À l'état de nature, la vie est « solitaire, misérable, dangereuse, brutale et courte ». Les hommes créent un État souverain absolu (le Léviathan) pour garantir la paix. Ils cèdent tous leurs droits naturels au souverain en échange de la sécurité.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ L'État est nécessaire et absolu — la désobéissance est toujours un mal plus grand que l'injustice subie.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Locke</td>
        <td style="padding:8px 12px;"><strong>L'État garantit les droits naturels.</strong> L'état de nature est relativement pacifique. L'État est fondé sur un contrat limité : les individus délèguent une partie de leurs droits pour protéger leur vie, leur liberté et leurs propriétés. Si l'État viole ces droits, le peuple a le droit de résistance.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Fondement du libéralisme politique et de la séparation des pouvoirs (inspirera Montesquieu).</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Rousseau</td>
        <td style="padding:8px 12px;"><strong>La souveraineté appartient au peuple.</strong> À l'état de nature, l'homme est bon et libre. C'est la société qui le corrompt. Le contrat social légitime est celui où chacun s'engage avec tous, formant la volonté générale — distincte de la simple somme des intérêts particuliers.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « L'homme est né libre, et partout il est dans les fers. »</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Marx</td>
        <td style="padding:8px 12px;"><strong>L'État est l'instrument de la classe dominante.</strong> Il n'est pas neutre : il sert les intérêts de la bourgeoisie contre le prolétariat. Il doit être « dépérir » dans la société communiste, où il n'y aurait plus de classes à dominer.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Critique radicale de l'État libéral comme masque de l'exploitation économique.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Aristote <span style="font-weight:normal;color:#888;font-size:13px;">— La Politique (env. 335 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'homme est naturellement un animal politique. La cité est antérieure à l'individu.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'homme est par nature un animal politique. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Hobbes <span style="font-weight:normal;color:#888;font-size:13px;">— Léviathan (1651)</span></div>
        <div style="margin:6px 0;font-size:14px;">Sans État souverain, la vie naturelle est misérable et violente. L'État absolu est la seule garantie de paix.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'homme est un loup pour l'homme » (à l'état de nature).</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Rousseau <span style="font-weight:normal;color:#888;font-size:13px;">— Du Contrat social (1762)</span></div>
        <div style="margin:6px 0;font-size:14px;">La légitimité de l'État repose sur la volonté générale et le consentement du peuple souverain.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'homme est né libre, et partout il est dans les fers. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Max Weber <span style="font-weight:normal;color:#888;font-size:13px;">— Le Savant et le Politique (1919)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'État se définit par le monopole de la violence physique légitime sur un territoire.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'État est cette communauté humaine qui, à l'intérieur d'un territoire déterminé, revendique pour elle-même et parvient à imposer le monopole de la violence physique légitime. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Marx & Engels <span style="font-weight:normal;color:#888;font-size:13px;">— Manifeste du Parti communiste (1848)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'État est l'instrument de domination de la classe bourgeoise sur le prolétariat.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le gouvernement de l'État moderne n'est qu'un comité qui gère les affaires communes de toute la classe bourgeoise. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">L'État est-il nécessaire ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Hobbes (oui, absolument) / Locke (oui, mais limité) / anarchistes (non)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">L'État est-il au service de tous ou d'une classe ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Rousseau (volonté générale) / Marx (instrument de classe) / Weber (monopole neutre)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">A-t-on le droit de désobéir à l'État ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Hobbes (non) / Locke (oui si violation des droits) / Thoreau / Arendt</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">L'État peut-il être juste ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Platon (État des philosophes) / Rawls (voile d'ignorance) / Marx (non par nature)</td>
      </tr>
    </table>
  </div>

</div>`

      {
        id:"inconscient",
        title:"L'inconscient",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">L'<strong>inconscient</strong> désigne l'ensemble des processus psychiques qui échappent à la conscience, sans pour autant être inexistants — ils agissent sur nos pensées, nos comportements et nos désirs à notre insu. C'est Freud qui en fait un véritable <em>concept scientifique</em> : avant lui, la notion existait (Leibniz, Nietzsche) mais sans système théorique rigoureux. La question centrale : si l'inconscient nous détermine, sommes-nous encore libres et responsables ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Inconscient ≠ Inconscience</td>
        <td style="padding:8px 12px;">L'<em>inconscience</em> (au sens courant) désigne l'absence temporaire de conscience : un coma, ou agir étourdiment. L'<em>inconscient</em> (au sens freudien) est une instance psychique permanente et structurée, qui agit de manière invisible mais continue sur notre vie mentale.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Inconscient freudien ≠ Petites perceptions (Leibniz)</td>
        <td style="padding:8px 12px;">Leibniz parle de <em>petites perceptions</em> : des perceptions trop faibles pour atteindre le seuil de conscience, mais qui s'accumulent (entendre le bruit de la mer sans distinguer chaque vague). Ce n'est pas un inconscient pulsionnel : il n'y a pas de désir refoulé, seulement une limite quantitative de la perception consciente.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Refoulement ≠ Oubli</td>
        <td style="padding:8px 12px;">L'<em>oubli</em> est une simple disparition de la mémoire consciente. Le <em>refoulement</em> (Freud) est un mécanisme actif : le psychisme chasse de la conscience des représentations insupportables (désirs, traumatismes), mais celles-ci subsistent dans l'inconscient et continuent d'agir — symptômes, rêves, lapsus.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Ça / Moi / Surmoi</td>
        <td style="padding:8px 12px;">La 2e topique freudienne (après Conscient/Préconscient/Inconscient) : le <em>ça</em> est le réservoir des pulsions inconscientes ; le <em>moi</em> tente de les concilier avec la réalité ; le <em>surmoi</em> est l'instance morale intériorisée (héritière de l'autorité parentale). Les conflits entre ces trois instances produisent les névroses.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Descartes</td>
        <td style="padding:8px 12px;width:38%;"><strong>L'inconscient est impensable.</strong> Pensée et conscience sont identiques : tout ce qui est dans l'esprit est nécessairement conscient. Un « inconscient psychique » est une contradiction dans les termes. Cette position est le point de départ que Freud va renverser.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ Position à mobiliser pour introduire le scandale de la thèse freudienne.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Leibniz</td>
        <td style="padding:8px 12px;"><strong>Il existe des perceptions inconscientes.</strong> Les <em>petites perceptions</em> sont des modifications de l'âme dont nous ne nous apercevons pas — elles s'accumulent et peuvent atteindre le seuil de conscience. C'est une forme d'inconscient <em>cognitif</em> (perceptif), non pulsionnel.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Précurseur de Freud, mais sans la dimension du désir refoulé.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Freud</td>
        <td style="padding:8px 12px;"><strong>L'inconscient est une instance psychique autonome et déterminante.</strong> Fondé sur l'expérience clinique (hystérie, rêves, lapsus, actes manqués), l'inconscient contient des désirs refoulés qui continuent d'agir sur la vie consciente. La psychanalyse vise à les rendre conscients pour libérer le sujet.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Troisième blessure narcissique de l'humanité : le moi n'est pas maître dans sa propre maison.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Nietzsche</td>
        <td style="padding:8px 12px;"><strong>La conscience n'est qu'une surface.</strong> « Quelque chose pense, mais croire que ce quelque chose est le moi, c'est une pure supposition. » Les forces vitales (instincts, volonté de puissance) agissent sous la conscience. Nietzsche pressent l'inconscient sans le théoriser comme Freud.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Précurseur philosophique de Freud, mais dans une perspective métaphysique et non clinique.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Sartre (critique)</td>
        <td style="padding:8px 12px;"><strong>L'inconscient est une illusion de mauvaise foi.</strong> Freud sépare artificiellement le psychisme en zones étanches. Mais si le censeur (le moi) refoule, il doit savoir ce qu'il refoule — donc il est conscient. Sartre propose de remplacer l'inconscient par la notion de <em>mauvaise foi</em> : on se ment à soi-même en se croyant déterminé.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Critique existentialiste : l'inconscient nous déresponsabilise.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Freud <span style="font-weight:normal;color:#888;font-size:13px;">— Introduction à la psychanalyse (1916)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'inconscient est une instance psychique autonome. Le moi n'est pas maître dans sa propre maison.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le moi n'est pas maître dans sa propre maison. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Freud <span style="font-weight:normal;color:#888;font-size:13px;">— L'Interprétation des rêves (1899)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le rêve est la voie royale vers l'inconscient : il exprime sous forme déguisée les désirs refoulés.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le rêve est la voie royale qui mène à la connaissance de l'inconscient. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Leibniz <span style="font-weight:normal;color:#888;font-size:13px;">— Nouveaux Essais sur l'entendement humain (1704)</span></div>
        <div style="margin:6px 0;font-size:14px;">Les petites perceptions : des modifications de l'âme imperceptibles individuellement mais agissant collectivement.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Il y a des changements dans l'âme dont nous ne nous apercevons pas. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Nietzsche <span style="font-weight:normal;color:#888;font-size:13px;">— Par-delà Bien et Mal (1886)</span></div>
        <div style="margin:6px 0;font-size:14px;">La conscience n'est qu'une surface : les forces vitales inconscientes sont les véritables moteurs de l'action humaine.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Quelque chose pense, mais croire que ce quelque chose est le moi, c'est une pure supposition. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Sartre <span style="font-weight:normal;color:#888;font-size:13px;">— L'Être et le Néant (1943)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'inconscient est une fiction : la « mauvaise foi » explique mieux l'auto-aveuglement sans supprimer la responsabilité.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« La mauvaise foi est possible seulement parce que la sincérité est déjà une forme de mauvaise foi. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">L'hypothèse de l'inconscient est-elle compatible avec la liberté ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Freud (déterminisme) / Sartre (liberté radicale) / psychanalyse comme libération</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Peut-on être responsable de ce qu'on fait inconsciemment ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Freud / Sartre / Kant (imputation morale exige conscience)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">L'inconscient remet-il en cause la maîtrise de soi ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Descartes (cogito) / Freud (iceberg) / stoïciens (maîtrise possible)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Peut-on se connaître soi-même ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Socrate / Freud (limites de l'introspection) / Nietzsche</td>
      </tr>
    </table>
  </div>

</div>`

      {
        id:"justice",
        title:"La justice",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">La <strong>justice</strong> est à la fois une vertu morale (disposition à rendre à chacun ce qui lui est dû), une institution (l'appareil judiciaire), et un idéal politique (l'organisation équitable de la société). La tension centrale : le <em>légal</em> (ce que la loi prescrit) est-il toujours <em>légitime</em> (ce qui est moralement juste) ? Une loi peut être légale sans être juste — et un acte juste peut être illégal.</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Légalité ≠ Légitimité</td>
        <td style="padding:8px 12px;">Ce qui est <em>légal</em> est conforme à la loi en vigueur. Ce qui est <em>légitime</em> est conforme à la justice morale. Les lois raciales de Vichy étaient légales mais illégitimes. Antigone (Sophocle) obéit à une loi divine qu'elle juge plus légitime que la loi humaine de Créon.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Justice distributive ≠ corrective (Aristote)</td>
        <td style="padding:8px 12px;">La <em>justice distributive</em> répartit les biens, les honneurs et les charges proportionnellement aux mérites de chacun (égalité proportionnelle). La <em>justice corrective</em> rétablit l'égalité rompue par une transaction injuste ou un délit (égalité arithmétique). Elles répondent à deux questions différentes : comment distribuer ? et comment réparer ?</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Égalité ≠ Équité</td>
        <td style="padding:8px 12px;">L'<em>égalité</em> traite tous les individus de la même façon (même part pour tous). L'<em>équité</em> (Aristote : <em>epieikeia</em>) adapte la règle au cas particulier pour être plus juste que la loi générale. Rawls distingue aussi égalité formelle (mêmes droits) et équité réelle (correction des inégalités de départ).</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Justice ≠ Vengeance</td>
        <td style="padding:8px 12px;">La vengeance est une réaction privée et passionnelle à un tort subi, sans mesure ni impartialité. La justice est institutionnelle, impartiale, proportionnée et publique. L'institution judiciaire vise précisément à remplacer la vengeance par un tiers neutre et une procédure réglée.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Platon</td>
        <td style="padding:8px 12px;width:38%;"><strong>La justice est l'harmonie des parties.</strong> Dans la cité idéale, chacun tient sa place selon sa nature (philosophes gouvernent, guerriers défendent, artisans produisent). Dans l'âme, la justice est l'harmonie entre raison, cœur et désirs. Il vaut mieux subir l'injustice que la commettre car l'injustice corrompt l'âme.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ Justice aristocratique et hiérarchique : les meilleurs doivent gouverner.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Aristote</td>
        <td style="padding:8px 12px;"><strong>La justice est la vertu complète envers autrui.</strong> Elle se décline en justice distributive (proportion aux mérites) et corrective (rétablissement de l'égalité). L'équité corrige les insuffisances de la loi générale face au cas particulier : elle est « le juste, mais au-delà de la loi écrite ».</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La justice est relative aux personnes et aux situations — pas une règle abstraite.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Rousseau</td>
        <td style="padding:8px 12px;"><strong>La justice repose sur la volonté générale.</strong> Une loi n'est juste que si elle exprime la volonté de tous les citoyens, non les intérêts particuliers. La force ne fait pas le droit : seul le consentement libre fonde la légitimité.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « Convenons donc que force ne fait pas droit. »</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Rawls</td>
        <td style="padding:8px 12px;"><strong>La justice est équité.</strong> Derrière un « voile d'ignorance » (sans savoir quelle place on occupe dans la société), on choisirait des principes garantissant les libertés fondamentales pour tous ET l'amélioration de la situation des plus défavorisés. La justice exige de corriger les inégalités de départ.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Principe de différence : les inégalités ne sont justifiées que si elles bénéficient aux plus pauvres.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Marx</td>
        <td style="padding:8px 12px;"><strong>La justice bourgeoise masque l'exploitation.</strong> Le droit formel (égalité des droits) dissimule l'inégalité réelle des conditions économiques. La vraie justice exige non l'égalité des droits mais la suppression des classes sociales : « À chacun selon ses besoins. »</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Critique radicale : l'égalité formelle est une illusion au service de la domination.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Platon <span style="font-weight:normal;color:#888;font-size:13px;">— Gorgias (env. 380 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">Commettre l'injustice corrompt l'âme davantage que la subir. La justice est d'abord une vertu intérieure.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Il vaut mieux subir l'injustice que la commettre. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Aristote <span style="font-weight:normal;color:#888;font-size:13px;">— Éthique à Nicomaque, Livre V (env. 335 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'équité corrige la loi générale quand elle est insuffisante face à un cas particulier.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'équitable, tout en étant juste, n'est pas le juste selon la loi, mais un correctif de la justice légale. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Rousseau <span style="font-weight:normal;color:#888;font-size:13px;">— Du Contrat social (1762)</span></div>
        <div style="margin:6px 0;font-size:14px;">La force ne fonde pas le droit. La loi n'est légitime que si elle exprime la volonté générale librement consentie.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Convenons donc que force ne fait pas droit, et qu'on n'est obligé d'obéir qu'aux puissances légitimes. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Rawls <span style="font-weight:normal;color:#888;font-size:13px;">— Théorie de la justice (1971)</span></div>
        <div style="margin:6px 0;font-size:14px;">Derrière le voile d'ignorance, on choisirait une société garantissant les libertés et corrigeant les inégalités au profit des plus défavorisés.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« La justice est la première vertu des institutions sociales, comme la vérité est celle des systèmes de pensée. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Pascal <span style="font-weight:normal;color:#888;font-size:13px;">— Pensées (1670)</span></div>
        <div style="margin:6px 0;font-size:14px;">La justice humaine est relative et arbitraire : ce qui est juste d'un côté des Pyrénées est injuste de l'autre.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Vérité au-deçà des Pyrénées, erreur au-delà. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">Le droit est-il toujours juste ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Hobbes (oui, le droit crée la justice) / Aristote, Rawls (non, l'équité corrige la loi) / Antigone</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Faut-il rendre à chacun la même chose ou ce qu'il mérite ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Aristote (mérite) / Rawls (correction des inégalités) / Marx (besoins)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">A-t-on le droit de désobéir à une loi injuste ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Hobbes (non) / Locke, Thoreau (oui) / Antigone / Arendt</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">La justice est-elle possible dans une société inégale ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Rawls (oui, si principe de différence) / Marx (non) / Rousseau</td>
      </tr>
    </table>
  </div>

</div>`

        id:"langage",
        title:"Le langage",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">Le <strong>langage</strong> est un système de signes permettant d'exprimer et de communiquer des pensées. Il est traditionnellement considéré comme le propre de l'homme — mais cette affirmation est à nuancer. Les questions centrales : le langage est-il un simple <em>outil</em> pour exprimer une pensée qui existerait sans lui, ou bien <em>constitue-t-il</em> la pensée elle-même ? Et le langage dit-il le réel ou le déforme-t-il ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Langage ≠ Langue ≠ Parole</td>
        <td style="padding:8px 12px;">Saussure distingue : la <em>langue</em> (système de signes partagé par une communauté, code collectif) ; la <em>parole</em> (usage individuel et concret de la langue dans un acte de communication) ; le <em>langage</em> (faculté humaine générale de communiquer par des signes). Le linguiste étudie la langue ; le philosophe interroge le langage.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Signe ≠ Symbole ≠ Signal</td>
        <td style="padding:8px 12px;">Le <em>signal</em> est un stimulus naturel lié à ce qu'il annonce (la fumée signale le feu). Le <em>signe linguistique</em> est arbitraire : aucun lien naturel entre le mot « arbre » et l'arbre réel (Saussure). Le <em>symbole</em> entretient un lien de ressemblance ou de convention culturelle avec ce qu'il représente.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Langage outil ≠ Langage constitutif</td>
        <td style="padding:8px 12px;">Deux positions opposées sur le rapport pensée/langage : <br>— Le langage comme <em>outil</em> : la pensée préexiste au langage, qui sert simplement à l'exprimer. Bergson : le langage fige et trahit la durée vivante de la pensée. <br>— Le langage comme <em>constitutif</em> : on ne peut pas penser sans mots. Hegel, Wittgenstein : « Les limites de mon langage signifient les limites de mon propre monde. »</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Dénotatif ≠ Connotatif</td>
        <td style="padding:8px 12px;">Le sens <em>dénotatif</em> est le sens littéral, objectif d'un mot (le dictionnaire). Le sens <em>connotatif</em> est l'ensemble des significations implicites, culturelles, émotionnelles associées au mot. Le même mot peut avoir des connotations très différentes selon le contexte — essentiel pour analyser les discours politiques et littéraires.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Platon</td>
        <td style="padding:8px 12px;width:38%;"><strong>Le langage peut trahir la vérité.</strong> Dans le <em>Cratyle</em>, Platon s'interroge : les noms sont-ils naturels (ils révèlent l'essence des choses) ou conventionnels (arbitraires) ? La sophistique montre que le langage peut tromper : les mots habiles peuvent faire paraître juste ce qui est injuste.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ Méfiance envers la rhétorique : le philosophe cherche la vérité, le sophiste cherche la persuasion.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Bergson</td>
        <td style="padding:8px 12px;"><strong>Le langage trahit la pensée vivante.</strong> La pensée est flux continu, durée ininterrompue. Le langage la découpe en unités fixes et générales, adaptées à l'action pratique, mais inaptes à saisir le mouvement de la conscience. Le langage est fait pour la vie sociale, non pour la philosophie.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La philosophie doit forcer le langage, créer des concepts nouveaux pour approcher l'indicible.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Hegel</td>
        <td style="padding:8px 12px;"><strong>Le langage réalise la pensée.</strong> La pensée n'existe pleinement que dans et par le langage. « Le mot donne à la pensée son existence la plus haute et la plus vraie. » Sans mots, la pensée reste abstraite et vague — le langage lui donne corps et réalité.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Position opposée à Bergson : le langage n'appauvrit pas, il accomplit.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Wittgenstein</td>
        <td style="padding:8px 12px;"><strong>Les limites du langage sont les limites du monde.</strong> Dans le <em>Tractatus</em> : le langage représente le monde comme une carte représente un territoire. Dans les <em>Recherches philosophiques</em> : le sens d'un mot est son usage dans des « jeux de langage » — il n'y a pas de signification fixe, seulement des pratiques sociales.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « Ce dont on ne peut parler, il faut le taire. » — L'ineffable n'est pas indicible : il est simplement hors du langage.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Saussure</td>
        <td style="padding:8px 12px;"><strong>Le signe linguistique est arbitraire.</strong> Aucun lien naturel n'unit le signifiant (image acoustique : le mot) et le signifié (concept). Le sens naît des <em>différences</em> entre les signes dans le système — non d'un rapport aux choses réelles. Chaque langue découpe la réalité différemment.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Hypothèse de Sapir-Whorf : la langue que l'on parle influence la façon dont on perçoit le monde.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Aristote <span style="font-weight:normal;color:#888;font-size:13px;">— La Politique (env. 335 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le langage est ce qui distingue l'homme de l'animal : il permet d'exprimer le juste et l'injuste, le bien et le mal.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'homme est le seul animal qui ait le logos. » (raison / langage)</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Bergson <span style="font-weight:normal;color:#888;font-size:13px;">— Essai sur les données immédiates de la conscience (1889)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le langage fige la pensée vivante en catégories générales inadaptées à la durée intérieure.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le mot recouvre une réalité qui n'est pas faite pour lui. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Wittgenstein <span style="font-weight:normal;color:#888;font-size:13px;">— Tractatus logico-philosophicus (1921)</span></div>
        <div style="margin:6px 0;font-size:14px;">Les limites du langage sont celles de la pensée et du monde. Ce qui ne peut être dit doit être tu.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Les limites de mon langage signifient les limites de mon propre monde. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Wittgenstein <span style="font-weight:normal;color:#888;font-size:13px;">— Tractatus logico-philosophicus (1921)</span></div>
        <div style="margin:6px 0;font-size:14px;">Ce qui dépasse les limites du langage — l'éthique, l'esthétique, le mystique — ne peut qu'être montré, pas dit.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Ce dont on ne peut parler, il faut le taire. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Orwell <span style="font-weight:normal;color:#888;font-size:13px;">— 1984 (1949) / La Politique et la langue anglaise (1946)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le langage peut être un instrument de domination politique : le novlangue détruit les mots pour rendre la dissidence impensable.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Si la pensée corrompt le langage, le langage peut aussi corrompre la pensée. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">Peut-on penser sans langage ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Bergson (oui, la pensée déborde le langage) / Wittgenstein, Hegel (non, pas de pensée sans mots)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Le langage dit-il le réel ou le déforme-t-il ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Platon (déforme, rhétorique trompe) / Aristote (dit le réel) / Bergson (fige) / Saussure (construit)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">Le langage est-il le propre de l'homme ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
