    <!-- II.B -->
    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>B) L'innovation et la destruction créatrice</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','II.B')">🃏 Flashcards II.B</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Invention</td><td>Découverte d'un savoir ou d'une technique nouvelle, qui relève du domaine scientifique et technique. Elle n'a pas en elle-même de portée économique.</td></tr>
                  <tr><td>Innovation</td><td>Mise en œuvre <strong>économique</strong> d'une invention ou d'une idée nouvelle : introduction sur le marché d'un nouveau produit, adoption d'un nouveau procédé ou d'une nouvelle organisation. Schumpeter la définit comme l'exécution de « nouvelles combinaisons productives ».</td></tr>
                  <tr><td>Les cinq formes d'innovation (Schumpeter)</td><td>(1) Fabrication d'un <strong>bien nouveau</strong> ; (2) introduction d'une nouvelle <strong>méthode de production</strong> (procédé) ; (3) ouverture d'un <strong>nouveau débouché</strong> ; (4) conquête d'une nouvelle <strong>source de matières premières</strong> ou de produits semi-finis ; (5) réalisation d'une nouvelle <strong>organisation</strong> de la production (création ou destruction d'un monopole, par exemple).</td></tr>
                  <tr><td>Innovation de produit / de procédé</td><td>L'innovation de <strong>produit</strong> consiste à commercialiser un bien ou un service nouveau ou sensiblement amélioré (vaccin à ARN messager, smartphone). L'innovation de <strong>procédé</strong> consiste à mettre en œuvre une méthode de production nouvelle qui réduit les coûts ou améliore la qualité (chaîne de montage, robotisation).</td></tr>
                  <tr><td>Innovation organisationnelle</td><td>Mise en œuvre d'une nouvelle méthode d'organisation du travail, des pratiques de l'entreprise ou de ses relations extérieures (juste-à-temps, travail en équipes autonomes, télétravail).</td></tr>
                  <tr><td>Innovation majeure (de rupture) / incrémentale</td><td>Une innovation <strong>majeure</strong> bouleverse les modes de production et de consommation et entraîne d'autres innovations (machine à vapeur, électricité, Internet). Une innovation <strong>incrémentale</strong> (ou mineure) est une amélioration progressive d'un produit ou d'un procédé existant.</td></tr>
                  <tr><td>Entrepreneur innovateur</td><td>Pour Schumpeter, agent qui réalise de nouvelles combinaisons productives en introduisant les inventions dans le processus économique. Il prend des risques et est motivé par la recherche du profit. Il n'appartient à aucun groupe social particulier : c'est sa fonction d'innovation qui le définit.</td></tr>
                  <tr><td>Monopole</td><td>Structure de marché dans laquelle un seul offreur fait face à de nombreux demandeurs ; faute de concurrents, il peut fixer un prix supérieur à celui qui prévaudrait en concurrence.</td></tr>
                  <tr><td>Rente d'innovation (monopole temporaire)</td><td>Surprofit que réalise l'entreprise innovante, momentanément seule à proposer le nouveau produit ou à utiliser le nouveau procédé. Cette rente est <strong>temporaire</strong> : elle disparaît à mesure que des imitateurs entrent sur le marché. Son espérance est la principale incitation à innover.</td></tr>
                  <tr><td>Imitation</td><td>Reproduction d'une innovation par des entreprises concurrentes (« suiveuses »). Elle fait disparaître la rente de l'innovateur mais diffuse l'innovation dans l'ensemble de l'économie.</td></tr>
                  <tr><td>Grappes d'innovations</td><td>Selon Schumpeter, les innovations n'apparaissent pas de manière régulière mais groupées : une innovation majeure en suscite d'autres, en amont et en aval, dans les secteurs liés. Ces grappes expliqueraient les phases d'expansion des cycles longs (cycles de Kondratiev, d'environ 50 ans).</td></tr>
                  <tr><td>Destruction créatrice</td><td>Processus décrit par Schumpeter (1942) par lequel les innovations rendent obsolètes les produits, les techniques, les entreprises et les emplois anciens, tout en créant de nouveaux produits, de nouvelles activités et de nouveaux emplois. Il « révolutionne incessamment de l'intérieur la structure économique » et constitue selon lui « la donnée fondamentale du capitalisme ».</td></tr>
                  <tr><td>Frontière technologique</td><td>Niveau technologique le plus avancé existant à un moment donné. Un pays proche de la frontière croît surtout en innovant ; un pays éloigné peut croître en imitant les technologies existantes (rattrapage).</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. Pourquoi les entrepreneurs innovent-ils ?</strong></p><ol class="meca">
                  <li>L'entrepreneur recherche le profit.</li>
                  <li>En innovant, il se retrouve seul sur son marché : <strong>monopole temporaire</strong> → il peut fixer des prix élevés et dégager une rente.</li>
                  <li>Les concurrents l'imitent → la rente disparaît peu à peu.</li>
                  <li>Pour la retrouver, il doit innover à nouveau → l'innovation est <strong>permanente</strong> et le progrès technique devient <strong>endogène</strong>.</li>
                </ol><p class="bloc-p"><strong>2. Les grappes d'innovations (exemple de la révolution industrielle)</strong></p><ol class="meca">
                  <li>La navette volante permet de tisser beaucoup plus vite.</li>
                  <li>Il faut alors davantage de fil → innovations dans le filage (rouet mécanique).</li>
                  <li>Il faut de l'énergie pour faire tourner ces machines → machine à vapeur.</li>
                  <li>Les innovations s'entraînent les unes les autres → forte hausse de la production.</li>
                </ol><p class="bloc-p"><strong>3. La destruction créatrice</strong></p><ol class="meca">
                  <li>Une innovation rend obsolètes des produits et des procédés anciens (le métier à tisser mécanique fait disparaître le métier traditionnel).</li>
                  <li>Des entreprises et des emplois disparaissent (maréchal-ferrant avec l'automobile, facteur avec les mails).</li>
                  <li>D'autres sont créés (garagistes, informaticiens…).</li>
                  <li>À long terme, le solde est positif pour la croissance : la croissance est un <strong>processus dynamique</strong> de remplacement de l'ancien par le nouveau.</li>
                  <li>Mais à court terme il y a des « perdants » (chômage, reconversions) → rôle des institutions (II.C) et effets sur les inégalités (III.A).</li>
                </ol>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>👤 Auteurs et théories</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Joseph Schumpeter</td><td>Économiste autrichien (1883-1950). <em>Théorie de l'évolution économique</em> (1911), <em>Capitalisme, socialisme et démocratie</em> (1942). L'innovation, portée par l'entrepreneur, est le moteur du capitalisme ; la <strong>destruction créatrice</strong> est « la donnée fondamentale du capitalisme ».</td></tr>
                  <tr><td>Philippe Aghion et Peter Howitt</td><td>Modèle schumpétérien de croissance (1992) : sans innovation, l'économie est stationnaire ; l'innovation résulte de décisions d'investissement qui répondent aux incitations des institutions ; les innovateurs d'hier tentent de bloquer l'entrée des nouveaux concurrents ; plus un pays est proche de la frontière technologique, plus l'innovation (plutôt que l'imitation) devient son moteur de croissance.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📊 Chiffres et exemples</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="exemple"><strong>Exemples de destruction créatrice :</strong> l'appareil photo numérique a fait disparaître la pellicule argentique (faillite de Kodak en 2012) ; le streaming a remplacé la location de DVD (faillite de Blockbuster) ; le e-commerce bouleverse le commerce traditionnel ; le mail réduit le courrier postal. Dans le même temps, de nombreux emplois et entreprises ont été créés dans ces nouveaux secteurs.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚠️ Pièges à éviter</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="piege"><strong>⚠ Invention ≠ innovation.</strong> Une invention ne devient une innovation que lorsqu'elle est exploitée économiquement.</div><div class="piege"><strong>⚠ Le monopole de l'innovateur est temporaire</strong> : c'est justement l'imitation qui pousse à innover encore.</div><div class="piege"><strong>⚠ Destruction créatrice ≠ uniquement négatif.</strong> Il faut toujours présenter les deux faces : destructions (emplois, entreprises) ET créations, avec un solde positif à long terme mais des coûts sociaux à court terme.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>✅ À retenir</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="aretenir">• L'<strong>innovation</strong> est la mise en œuvre économique d'une invention ; elle est motivée par la recherche d'une <strong>rente de monopole temporaire</strong>.<br>• L'imitation oblige à innover sans cesse : le progrès technique est <strong>endogène</strong> et la croissance s'auto-entretient.<br>• L'innovation s'accompagne d'un processus de <strong>destruction créatrice</strong> : l'ancien est remplacé par le nouveau, avec des gagnants et des perdants.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>🎯 Pour le bac</span>

                  <li>Montrez que l'innovation s'accompagne d'un processus de destruction créatrice.</li>
                  <li>Expliquez pourquoi les entreprises sont incitées à innover.</li>

    <!-- II.C -->
    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>C) Le rôle des institutions dans la croissance économique</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','II.C')">🃏 Flashcards II.C</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Institutions</td><td>Ensemble des règles <strong>formelles</strong> (constitution, lois, règlements, droits de propriété) et <strong>informelles</strong> (normes, coutumes, conventions, codes de conduite), relativement stables dans le temps, qui encadrent les interactions politiques, économiques et sociales. Pour Douglass North, ce sont « les règles du jeu » d'une société : elles réduisent l'incertitude et structurent les incitations des agents.</td></tr>
                  <tr><td>Incitation</td><td>Élément qui pousse un agent à adopter un comportement donné en modifiant les gains ou les coûts qu'il en attend (perspective de profit, fiscalité, sanction). Les institutions agissent sur la croissance en modifiant les incitations à investir et à innover.</td></tr>
                  <tr><td>Droits de propriété</td><td>Droits, reconnus et garantis par la loi, qui permettent à leur titulaire de disposer d'un bien : l'<strong>usus</strong> (le droit de l'utiliser), le <strong>fructus</strong> (le droit d'en percevoir les fruits, c'est-à-dire les revenus) et l'<strong>abusus</strong> (le droit de le céder, de le vendre ou de le détruire). Ils sont une condition de l'échange marchand et de l'investissement.</td></tr>
                  <tr><td>Propriété intellectuelle</td><td>Ensemble des droits de propriété portant sur les créations de l'esprit. Elle comprend la <strong>propriété industrielle</strong> (brevets, marques, dessins et modèles) et la <strong>propriété littéraire et artistique</strong> (droit d'auteur).</td></tr>
                  <tr><td>Brevet</td><td>Titre de propriété industrielle délivré par un organisme public qui confère à son titulaire un <strong>droit exclusif d'exploitation</strong> de son invention pendant une durée limitée (20 ans en général), en contrepartie de la <strong>divulgation publique</strong> de l'invention. Il crée un monopole légal temporaire qui permet à l'innovateur de rentabiliser ses dépenses de R&D.</td></tr>
                  <tr><td>Coûts de transaction</td><td>Coûts liés à la réalisation d'un échange : recherche d'information, négociation, rédaction et contrôle des contrats, recours en cas de litige. Des institutions efficaces les réduisent.</td></tr>
                  <tr><td>Dépendance au sentier (path dependence)</td><td>Les choix institutionnels faits dans le passé conditionnent les possibilités présentes et futures : les institutions évoluent lentement et de façon incrémentale, ce qui explique la persistance de trajectoires de croissance différentes entre pays.</td></tr>
                  <tr><td>État de droit</td><td>Situation dans laquelle les pouvoirs publics sont eux-mêmes soumis au droit, où les règles sont connues de tous et appliquées par une justice indépendante. Il garantit la sécurité des contrats et des droits de propriété.</td></tr>
                  <tr><td>Corruption</td><td>Fait, pour une personne investie d'un pouvoir (public ou privé), de le détourner à son profit en échange d'un avantage. Elle augmente l'incertitude et les coûts pour les entreprises et décourage l'investissement.</td></tr>
                  <tr><td>Institutions créatrices de marché</td><td>Selon Rodrik et Subramanian (2003), institutions sans lesquelles les marchés ne peuvent exister : les droits de propriété et l'exécution des contrats.</td></tr>
                  <tr><td>Institutions de réglementation des marchés</td><td>Institutions qui corrigent les défaillances de marché (pouvoir de monopole, externalités, asymétries d'information) : autorités de la concurrence, agences de régulation.</td></tr>
                  <tr><td>Institutions de stabilisation des marchés</td><td>Institutions qui assurent une inflation faible et stable et limitent l'instabilité macroéconomique et financière : banque centrale, règles budgétaires, régulation financière.</td></tr>
                  <tr><td>Institutions de légitimation des marchés</td><td>Institutions qui assurent la protection sociale et l'assurance contre les risques, ce qui rend l'économie de marché acceptable par la population et limite les conflits : assurance chômage, retraites, démocratie.</td></tr>
                  <tr><td>Concurrence</td><td>Situation d'un marché sur lequel plusieurs offreurs rivalisent pour attirer les demandeurs. Selon Aghion, son effet sur l'innovation dépend de la distance à la frontière technologique.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. Les institutions agissent sur l'incitation à investir et à innover</strong></p><ol class="meca">
                  <li>Investir et innover est risqué : on engage des coûts aujourd'hui pour un profit incertain demain.</li>
                  <li>Des institutions de qualité (lois respectées, prix stables, faible corruption, justice efficace) <strong>réduisent l'incertitude</strong>.</li>
                  <li>→ les agents sont davantage incités à investir et à innover → plus de croissance.</li>
                  <li>À l'inverse, forte inflation, corruption, mafias qui rackettent les producteurs → risque élevé → moins d'investissement → moins de croissance.</li>
                </ol><p class="bloc-p"><strong>2. Le rôle clé des droits de propriété et des brevets</strong></p><ol class="meca">
                  <li>La R&D coûte cher (ex. : recherche d'un vaccin contre la COVID-19).</li>
                  <li>Sans protection, l'innovation serait immédiatement copiée → aucune entreprise n'aurait intérêt à investir.</li>
                  <li>Le brevet donne un monopole temporaire → l'innovateur peut fixer un prix qui couvre ses coûts de recherche → <strong>incitation positive</strong> à innover.</li>
                  <li>Limite : « le premier arrivé emporte toute la mise », ce qui peut décourager les autres → les pouvoirs publics limitent la durée du brevet et autorisent l'imitation en cas d'amélioration significative.</li>
                  <li>Comme le brevet est public, il permet aussi la <strong>diffusion</strong> de l'innovation.</li>
                </ol><p class="bloc-p"><strong>3. Concurrence et innovation (Aghion et Howitt)</strong> : l'effet de la concurrence dépend de la distance à la frontière technologique. Pour les entreprises proches de la frontière, la concurrence pousse à innover pour rester devant ; pour celles qui en sont loin, trop de concurrence les décourage. Il n'existe donc <strong>pas de « package » institutionnel unique</strong> valable pour tous les pays.</p><p class="bloc-p"><strong>4. Accompagner la destruction créatrice</strong> : les institutions du marché du travail (assurance chômage, formation initiale et continue, dispositifs facilitant les entrées et sorties d'emploi) protègent les « perdants » de l'innovation et permettent que les effets positifs de la croissance l'emportent sur ses effets négatifs.</p>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>👤 Auteurs et théories</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Douglass North (Nobel 1993)</td><td>Les institutions sont « les contraintes humaines qui structurent les interactions politiques, économiques et sociales ». Elles fournissent la <strong>structure des incitations</strong> d'une économie et orientent vers la croissance, la stagnation ou le déclin. Elles évoluent lentement : <strong>dépendance au sentier</strong>.</td></tr>
                  <tr><td>Dani Rodrik et Arvind Subramanian (2003)</td><td>« La primauté des institutions » : distinguent 4 types d'institutions favorables à la croissance (créatrices, de réglementation, de stabilisation et de légitimation des marchés).</td></tr>
                  <tr><td>Philippe Aghion et Peter Howitt</td><td>La concurrence a des effets contradictoires sur l'innovation selon la distance à la frontière technologique.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📊 Chiffres et exemples</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="exemple"><strong>Amérique du Nord / Amérique du Sud (North) :</strong> à la fin du XIX<sup>e</sup> et au début du XX<sup>e</sup> siècle, l'Amérique du Nord a hérité d'institutions plus décentralisées venues du Royaume-Uni (sécurité des droits de propriété, assemblées locales), plus incitatives à l'investissement et au risque ; l'Amérique du Sud a hérité des institutions très centralisées et bureaucratiques de l'Espagne. D'où des trajectoires de croissance très différentes.</div><div class="exemple"><strong>Indice de perception de la corruption 2019 (Transparency International) :</strong> investir au Danemark, en Nouvelle-Zélande, en Finlande, à Singapour ou en Suède ne comporte pas les mêmes risques qu'au Venezuela, au Yémen, en Syrie, au Soudan ou en Somalie.</div><div class="exemple"><strong>Vaccins contre la COVID-19 :</strong> les laboratoires ont investi massivement parce que les brevets leur permettaient d'espérer rentabiliser leurs recherches.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚠️ Pièges à éviter</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="piege"><strong>⚠ Ne pas réduire les institutions à l'État.</strong> Ce sont des règles (formelles et informelles), pas seulement des organisations.</div><div class="piege"><strong>⚠ Le brevet a un double effet :</strong> il protège l'innovateur (incitation) mais crée un monopole ; sa durée limitée et sa publication permettent la diffusion de l'innovation.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>✅ À retenir</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="aretenir">• Les <strong>institutions</strong> influencent la croissance en agissant sur l'<strong>incitation à investir et à innover</strong>.<br>• Les <strong>droits de propriété</strong> (dont les brevets) sont essentiels : ils garantissent à l'innovateur de pouvoir tirer profit de ses investissements.<br>• D'autres institutions (concurrence, banque centrale, protection sociale, formation) soutiennent aussi la croissance et accompagnent la destruction créatrice.<br>• Il n'existe pas de modèle institutionnel unique.</div>

    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>A) Le progrès technique peut engendrer des inégalités de revenus</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','III.A')">🃏 Flashcards III.A</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Inégalités économiques</td><td>Différences d'accès à des ressources économiques rares et valorisées (revenus, patrimoine) entre individus ou groupes sociaux, qui se traduisent par des avantages ou des désavantages hiérarchisables.</td></tr>
                  <tr><td>Revenu primaire / revenu disponible</td><td>Le revenu <strong>primaire</strong> est issu de la participation à la production ou de la propriété. Le revenu <strong>disponible</strong> est le revenu primaire augmenté des prestations sociales et diminué des impôts directs et des cotisations sociales : c'est celui dont le ménage dispose pour consommer et épargner.</td></tr>
                  <tr><td>Part du revenu des 10 % / 1 % les plus aisés</td><td>Indicateur de concentration des revenus : pourcentage du revenu national total perçu par les 10 % (ou 1 %) d'individus aux revenus les plus élevés. Il est utilisé par le Rapport sur les inégalités mondiales (World Inequality Lab).</td></tr>
                  <tr><td>Croissance inclusive</td><td>Croissance dont les bénéfices sont largement répartis dans l'ensemble de la population, de sorte que les revenus de tous progressent. Depuis les années 1980, la croissance l'est moins, surtout aux États-Unis.</td></tr>
                  <tr><td>Rente d'innovation</td><td>Surprofit temporaire tiré du monopole de l'innovateur (souvent protégé par des brevets). Elle accroît les revenus des innovateurs et des détenteurs du capital de l'entreprise relativement à ceux des autres agents.</td></tr>
                  <tr><td>Rente de monopole (hors innovation)</td><td>Surprofit obtenu grâce à une position de monopole qui ne repose pas sur une innovation (droit d'exploitation exclusif, barrières à l'entrée). Elle accroît les inégalités sans créer de croissance.</td></tr>
                  <tr><td>Tâches routinières</td><td>Tâches répétitives qui suivent des procédures explicites et codifiables, et peuvent donc être exécutées par des machines ou des logiciels (saisie et traitement de données, traitement des factures, travail à la chaîne). Elles sont surtout occupées par des ouvriers de l'industrie et des employés administratifs, aux qualifications et salaires intermédiaires.</td></tr>
                  <tr><td>Tâches non routinières</td><td>Tâches difficiles à codifier et donc à automatiser. Elles peuvent être <strong>abstraites</strong> et qualifiées (analyse, conception, management : cadres, ingénieurs, bien rémunérés) ou <strong>manuelles</strong> et relationnelles, peu qualifiées (aide à domicile, soins, restauration, ménage, faiblement rémunérées).</td></tr>
                  <tr><td>Automatisation</td><td>Remplacement du travail humain par des machines ou des logiciels pour exécuter une tâche. Elle touche surtout les tâches routinières et s'est accélérée avec la baisse du prix des TIC.</td></tr>
                  <tr><td>Polarisation des emplois</td><td>Déformation de la structure des emplois caractérisée par la hausse simultanée de la part des emplois très qualifiés (hauts salaires) et des emplois peu qualifiés non routiniers (bas salaires), au détriment des emplois intermédiaires routiniers. Elle accroît les inégalités salariales.</td></tr>
                  <tr><td>Progrès technique biaisé en faveur du travail qualifié</td><td>Progrès technique qui accroît davantage la productivité, donc la demande et la rémunération, du travail qualifié que du travail peu qualifié.</td></tr>
                  <tr><td>Technologies de l'information et de la communication (TIC)</td><td>Ensemble des technologies de traitement et de transmission de l'information (informatique, télécommunications, Internet). Leur diffusion depuis les années 1990 est le principal vecteur de l'automatisation des tâches routinières.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. Le progrès technique augmente les revenus des innovateurs</strong></p><ol class="meca">
                  <li>L'innovateur bénéficie d'un monopole temporaire → il fixe des prix élevés → surprofits.</li>
                  <li>Dans une économie mondialisée, il s'adresse directement à une clientèle mondiale → la rente est encore plus forte (ex. : la première machine à café à capsules protégée par de nombreux brevets).</li>
                  <li>→ les revenus des innovateurs augmentent plus que ceux des autres → <strong>hausse des inégalités</strong> (jusqu'à l'arrivée des imitateurs).</li>
                </ol><p class="bloc-p"><strong>2. Le progrès technique déforme la structure des emplois</strong></p><ol class="meca">
                  <li>Les TIC permettent d'automatiser les tâches routinières (ouvriers de l'industrie, employés administratifs).</li>
                  <li>Ces emplois intermédiaires disparaissent ; la demande de travail qualifié augmente.</li>
                  <li>Restent et se développent : les emplois très qualifiés (hauts salaires) et les emplois peu qualifiés non routiniers (bas salaires).</li>
                  <li>→ <strong>polarisation des emplois</strong> → hausse de la part des emplois aux deux extrémités de l'échelle des salaires → <strong>hausse des inégalités salariales</strong>.</li>
                  <li>Côté offre de travail, la part de diplômés du supérieur augmente, ce qui répond en partie à cette demande.</li>
                </ol><p class="bloc-p"><strong>3. Des nuances indispensables</strong></p><ul class="bloc-ul">
                  <li>Le progrès technique, en stimulant la croissance, améliore aussi le <strong>bien-être général</strong>.</li>
                  <li>Les salariés peu qualifiés profitent aussi des rentes des entreprises innovantes (salaire plus élevé que dans une firme non innovante).</li>
                  <li>D'autres causes expliquent la hausse des inégalités : mondialisation, délocalisations, rentes de monopole sans innovation (qui ne créent aucune croissance).</li>
                  <li>La croissance des Trente Glorieuses s'est accompagnée d'une <strong>baisse</strong> des inégalités : il n'y a pas de fatalité, tout dépend des <strong>politiques publiques</strong> (fiscalité, éducation, formation).</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">

    <!-- III.B -->
    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>B) Une croissance soutenable se heurte à des limites écologiques</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','III.B')">🃏 Flashcards III.B</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Croissance soutenable (durable)</td><td>Croissance qui permet de répondre aux besoins du présent sans compromettre la capacité des générations futures à répondre aux leurs (rapport Brundtland, 1987). Elle suppose de transmettre aux générations futures un stock de capital (économique, humain, social, naturel) leur permettant un bien-être au moins égal.</td></tr>
                  <tr><td>Développement durable</td><td>Mode de développement qui concilie trois dimensions : économique (croissance), sociale (équité, réduction des inégalités) et environnementale (préservation des ressources et des écosystèmes).</td></tr>
                  <tr><td>Limites écologiques</td><td>Contraintes physiques que l'environnement impose à la croissance : l'<strong>épuisement des ressources</strong>, la <strong>pollution</strong> et le <strong>réchauffement climatique</strong>, qui peuvent à terme compromettre la production elle-même et le bien-être.</td></tr>
                  <tr><td>Ressources naturelles</td><td>Éléments de la nature utilisés par l'homme pour produire ou consommer. Les ressources <strong>non renouvelables</strong> existent en stock fini et s'épuisent avec leur exploitation (pétrole, gaz, charbon, minerais). Les ressources <strong>renouvelables</strong> se reconstituent naturellement (forêts, poissons, eau), mais s'épuisent si on les exploite plus vite que leur rythme de renouvellement.</td></tr>
                  <tr><td>Capital naturel</td><td>Stock de ressources naturelles et d'écosystèmes (sols, eau, air, biodiversité, climat) qui fournit des ressources et des services indispensables à la production et à la vie humaine.</td></tr>
                  <tr><td>Pollution</td><td>Dégradation de l'environnement (air, eau, sols) par l'introduction de substances ou d'énergies nocives, qui résulte des activités de production et de consommation. C'est une externalité négative.</td></tr>
                  <tr><td>Externalité négative</td><td>Effet défavorable de l'activité d'un agent sur d'autres agents sans compensation monétaire. Le pollueur ne supporte pas le coût social de sa pollution : le marché produit donc trop de pollution.</td></tr>
                  <tr><td>Gaz à effet de serre (GES)</td><td>Gaz présents dans l'atmosphère qui retiennent une partie du rayonnement infrarouge émis par la Terre (dioxyde de carbone, méthane, protoxyde d'azote…). L'augmentation de leur concentration, due surtout à la combustion d'énergies fossiles, renforce l'effet de serre.</td></tr>
                  <tr><td>Réchauffement climatique</td><td>Hausse de la température moyenne à la surface de la Terre provoquée par l'accumulation des GES d'origine humaine. Il entraîne des dérèglements (sécheresses, inondations, ouragans, montée du niveau des mers) aux coûts économiques et humains croissants.</td></tr>
                  <tr><td>Irréversibilité</td><td>Caractère d'un dommage qui ne peut pas être réparé ou compensé (extinction d'une espèce, réchauffement déjà engagé). L'irréversibilité justifie d'agir avant que les dommages ne se produisent.</td></tr>
                  <tr><td>Soutenabilité faible</td><td>Conception selon laquelle les différentes formes de capital sont <strong>substituables</strong> : la dégradation du capital naturel est acceptable si elle est compensée par une hausse d'autres capitaux (capital technique, humain), notamment grâce au progrès technique. Seul compte le maintien du stock total de capital.</td></tr>
                  <tr><td>Soutenabilité forte</td><td>Conception selon laquelle le capital naturel n'est <strong>pas substituable</strong> (ou seulement très partiellement) aux autres formes de capital : il faut préserver un stock minimal de capital naturel « critique », indépendamment de l'évolution des autres capitaux.</td></tr>
                  <tr><td>Décroissance</td><td>Courant de pensée qui prône une réduction volontaire et planifiée de la production et de la consommation dans les pays riches afin de respecter les limites de la planète.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. La croissance se heurte à des limites écologiques</strong></p><ol class="meca">
                  <li>Produire plus nécessite plus de ressources naturelles et d'énergie (souvent fossile).</li>
                  <li>→ épuisement des ressources, pollution, émissions de CO<sub>2</sub>.</li>
                  <li>→ réchauffement climatique → désordres climatiques (sécheresses, inondations, montée des eaux).</li>
                  <li>→ la croissance actuelle n'est pas <strong>soutenable</strong> : certains dommages sont <strong>irréversibles</strong>.</li>
                  <li>Preuve de la corrélation : la crise de 2008 et surtout le confinement de 2020 ont fait chuter les émissions de CO<sub>2</sub>.</li>
                </ol><p class="bloc-p"><strong>2. Faut-il arrêter la croissance ?</strong> La réponse n'est pas si simple :</p><ul class="bloc-ul">
                  <li>Stopper la croissance, c'est renoncer à distribuer des revenus et à améliorer les niveaux de vie : le confinement de 2020 a fait baisser les émissions mais aussi augmenter le chômage, la pauvreté et la malnutrition.</li>
                  <li>Les pays émergents, où se concentrent aujourd'hui les hausses d'émissions, ont besoin de croissance pour lutter contre la pauvreté.</li>
                  <li>La décroissance des seuls pays de l'OCDE ne changerait pas grand-chose au problème climatique (P. Artus, 2020).</li>
                </ul><p class="bloc-p"><strong>3. Le coût de l'inaction est supérieur au coût de l'action</strong> (rapport Stern) : agir aujourd'hui (taxe carbone, etc.) coûte en croissance à moyen terme, mais réduit fortement les dommages du réchauffement à long terme.</p>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>👤 Auteurs et théories</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Thomas Malthus, David Ricardo</td><td>Économistes classiques pessimistes : la croissance serait limitée, notamment par les rendements agricoles décroissants. Ils n'avaient pas anticipé les effets du progrès technique.</td></tr>
                  <tr><td>Rapport Meadows (1972, Club de Rome)</td><td><em>Halte à la croissance ?</em> (<em>Les limites de la croissance</em>) : une croissance infinie est impossible dans un monde aux ressources finies.</td></tr>
                  <tr><td>Rapport Brundtland (1987)</td><td>Définit le développement durable.</td></tr>
                  <tr><td>Nicholas Stern (rapport de 2006)</td><td>Chiffre le coût du changement climatique : le coût de l'inaction (« business as usual ») est bien plus élevé que celui de l'action.</td></tr>
                </table>
              </div>
            </div>
          </div>

            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">

                  <li><strong>Graphique 14 (Météo-France)</strong> : anomalie de température par rapport à la moyenne 1961-1990 (14 °C) → réchauffement au XX<sup>e</sup> siècle.</li>

                  <li><strong>Graphique 16</strong> : impact sur le PIB mondial de différents scénarios de politique climatique (BAU = aucune politique ; DREP = baisse du prix des énergies non émettrices ; LCT/HCT = taxe carbone faible/forte).</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚠️ Pièges à éviter</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="piege"><strong>⚠ Ne pas conclure trop vite qu'il faut arrêter la croissance.</strong> Il faut montrer les deux côtés : la croissance dégrade l'environnement, mais la stopper a des coûts sociaux importants, surtout pour les pays pauvres.</div><div class="piege"><strong>⚠ Soutenable ≠ « qui dure ».</strong> Une croissance soutenable doit préserver les possibilités de bien-être des <strong>générations futures</strong>.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>✅ À retenir</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="aretenir">• La croissance se heurte à trois limites écologiques : <strong>épuisement des ressources, pollution, réchauffement climatique</strong>.<br>• La croissance actuelle n'est pas <strong>soutenable</strong> et certains dommages sont irréversibles.<br>• Mais arrêter la croissance aurait des coûts sociaux élevés (chômage, pauvreté), surtout pour les pays émergents ; le coût de l'inaction reste supérieur au coût de l'action.</div>
              </div>

                  <li>Montrez qu'une croissance économique soutenable se heurte à des limites écologiques.</li>
                  <li>À l'aide d'un exemple, montrez que la croissance économique peut dégrader l'environnement.</li>

    <!-- III.C -->
    <div class="accord-sub">
      <button type="button" class="accord-h2" onclick="toggleAccord(this)" aria-expanded="false">
        <span>C) L'innovation peut aider à reculer les limites écologiques</span>
        <span class="accord-chevron">▼</span>
      </button>
      <div class="accord-content">
        <div class="accord-body-inner">
          <div class="accord-fc-row accord-fc-row-top">
            <button type="button" class="fc-btn" onclick="fcOpen('croissance','III.C')">🃏 Flashcards III.C</button>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📖 Notions clés</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <table class="ses-table">
                  <tr><td>Innovation environnementale (verte)</td><td>Innovation (de produit, de procédé ou d'organisation) qui réduit l'impact des activités économiques sur l'environnement : moindre consommation de ressources et d'énergie, moindres émissions de polluants et de GES.</td></tr>
                  <tr><td>Croissance verte</td><td>Croissance qui vise à concilier hausse de la production et préservation de l'environnement, grâce à l'innovation et aux investissements dans les technologies propres, afin de réduire la pression exercée sur les ressources naturelles et le climat.</td></tr>
                  <tr><td>Découplage</td><td>Dissociation entre l'évolution du PIB et celle des pressions environnementales (émissions de GES, consommation de ressources). Il est <strong>relatif</strong> quand les pressions augmentent moins vite que le PIB (baisse de l'intensité en carbone) et <strong>absolu</strong> quand elles diminuent alors que le PIB augmente.</td></tr>
                  <tr><td>Intensité carbone (ou énergétique) du PIB</td><td>Quantité de CO<sub>2</sub> émise (ou d'énergie consommée) pour produire une unité de PIB. Sa baisse traduit un découplage relatif.</td></tr>
                  <tr><td>Recyclage</td><td>Réintroduction de matériaux issus de déchets dans un cycle de production, en remplacement de matières premières vierges. Il économise des ressources naturelles et souvent de l'énergie.</td></tr>
                  <tr><td>Économie circulaire</td><td>Modèle économique qui vise à limiter la consommation de ressources et la production de déchets en allongeant la durée de vie des produits (écoconception, réparation, réemploi) et en recyclant les matériaux, par opposition au modèle linéaire « extraire, fabriquer, consommer, jeter ».</td></tr>
                  <tr><td>Énergies renouvelables</td><td>Énergies issues de sources naturelles qui se renouvellent (soleil, vent, eau, chaleur de la Terre, biomasse), peu émettrices de GES. Solaire et éolien sont <strong>intermittents</strong> : leur production dépend des conditions naturelles, ce qui pose le problème du stockage de l'électricité.</td></tr>
                  <tr><td>Transition énergétique / écologique</td><td>Passage d'un système de production et de consommation fondé sur les énergies fossiles et le gaspillage des ressources à un système plus sobre, plus efficace et fondé sur les énergies renouvelables.</td></tr>
                  <tr><td>Sobriété</td><td>Réduction volontaire ou organisée des consommations d'énergie et de ressources (isolation des bâtiments, baisse du chauffage, mobilités moins émettrices).</td></tr>
                  <tr><td>Efficacité énergétique</td><td>Rapport entre le service rendu (production, chauffage, déplacement) et l'énergie consommée pour l'obtenir : l'innovation l'améliore en permettant d'obtenir le même résultat avec moins d'énergie.</td></tr>
                  <tr><td>Effet rebond</td><td>Phénomène par lequel les gains d'efficacité permis par une innovation, en réduisant le coût d'utilisation d'un bien ou d'une ressource, entraînent une hausse de sa consommation qui annule une partie (voire la totalité) des économies attendues.</td></tr>
                  <tr><td>Taxe carbone</td><td>Taxe proportionnelle aux émissions de CO<sub>2</sub> qui fait payer au pollueur le coût de l'externalité négative (principe pollueur-payeur). En renchérissant les énergies fossiles, elle incite à réduire les émissions et à innover dans les technologies propres.</td></tr>
                </table>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚙️ Mécanismes</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <p class="bloc-p"><strong>1. Comment l'innovation repousse les limites écologiques</strong></p><ol class="meca">
                  <li>Le progrès technique renouvelle sans cesse les possibilités de croissance (c'est ce que Malthus et Ricardo n'avaient pas anticipé).</li>
                  <li>Les innovations vertes permettent de produire en consommant moins de ressources (recyclage) et en émettant moins de CO<sub>2</sub> (électricité verte).</li>
                  <li>→ <strong>découplage</strong> entre croissance et pressions environnementales → croissance verte.</li>
                </ol><p class="bloc-p"><strong>2. Les innovations s'entraînent les unes les autres</strong></p><ol class="meca">
                  <li>Une innovation majeure dans l'énergie (renouvelables) fait augmenter la demande.</li>
                  <li>→ elle crée des « goulets d'étranglement » dans les secteurs proches : les énergies renouvelables sont intermittentes et l'électricité est difficile à stocker.</li>
                  <li>→ incitation à innover dans le stockage (batteries lithium-ion, hydrogène).</li>
                  <li>→ effet d'entraînement et externalités positives, sources d'une croissance qui pourrait être soutenable.</li>
                </ol><p class="bloc-p"><strong>3. Le rôle des pouvoirs publics</strong> : l'innovation verte est coûteuse et risquée ; l'État la soutient par des aides publiques (projet européen « Airbus de la batterie »), la recherche publique et des taxes qui rendent la pollution plus chère.</p>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>📊 Chiffres et exemples</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="exemple"><strong>Recyclage du verre plat :</strong> le verre issu des chantiers de déconstruction n'était pas recyclé. Une usine innovante dans l'Aisne le transforme en calcin (verre recyclé) réincorporé dans la production : on économise du sable et de l'énergie.</div><div class="exemple"><strong>Électricité verte et stockage :</strong> hydraulique, solaire, éolien, géothermie, biomasse ; les batteries lithium-ion et le stockage sous forme d'hydrogène doivent permettre de dépasser l'intermittence. La France soutient le projet européen « Airbus de la batterie » (aides publiques aux entreprises et aux laboratoires).</div><div class="exemple"><strong>Sobriété :</strong> isolation des bâtiments, véhicules hybrides et électriques.</div><div class="exemple"><strong>Soutien public (Mazzucato) :</strong> Tesla, SolarCity et SpaceX ont reçu environ 4,9 milliards de dollars d'aides publiques ; les technologies des batteries et des panneaux solaires ont été financées en partie par le département américain de l'Énergie.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>⚠️ Pièges à éviter</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="piege"><strong>⚠ L'innovation n'est pas une solution miracle.</strong> Limites : stockage de l'énergie encore imparfait (pertes, volume), <strong>effet rebond</strong>, découplage souvent seulement relatif, bénéfices lointains alors que les coûts sont immédiats.</div><div class="piege"><strong>⚠ Découplage relatif ≠ absolu.</strong> Pour le climat, c'est la <strong>baisse</strong> des émissions (découplage absolu) qui compte.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>✅ À retenir</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <div class="aretenir">• L'<strong>innovation</strong> peut aider à <strong>reculer les limites écologiques</strong> : recyclage, énergies renouvelables, stockage de l'énergie, sobriété.<br>• Elle permet un <strong>découplage</strong> entre croissance et pollution : c'est l'idée de <strong>croissance verte</strong>.<br>• Les innovations s'entraînent entre elles (externalités positives) et les pouvoirs publics jouent un rôle clé pour les stimuler.<br>• Limites : effet rebond, découplage souvent relatif, délais.</div>
              </div>
            </div>
          </div>

          <div class="accord-block">
            <button type="button" class="accord-h3" onclick="toggleAccord(this)" aria-expanded="false">
              <span>🎯 Pour le bac</span>
              <span class="accord-chevron">▼</span>
            </button>
            <div class="accord-content">
              <div class="accord-block-inner">
                <ul class="bloc-ul">
                  <li>Montrez que l'innovation peut aider à reculer les limites écologiques de la croissance.</li>
                  <li>À l'aide d'un exemple, montrez que le progrès technique peut contribuer à une croissance soutenable.</li>
                </ul><div class="exemple"><strong>Plan type (EC 3) « La croissance est-elle compatible avec la préservation de l'environnement ? » :</strong> I. La croissance se heurte à des limites écologiques (ressources, pollution, climat). II. Mais l'innovation peut aider à reculer ces limites (croissance verte, découplage), avec le soutien des pouvoirs publics.</div>
              </div>
            </div>
          </div>

        </div>
      </div>

</div>

  content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">L'<strong>art</strong> désigne toute activité humaine qui produit des œuvres destinées non à l'utilité mais à l'expression, à la beauté ou à la signification. Il se distingue de la <strong>technique</strong> (production d'un objet utile selon des règles transmissibles) par le fait que l'œuvre d'art est unique, irréductible à une règle, et qu'elle engage la sensibilité autant que l'intelligence. La question philosophique centrale est : <em>l'art nous rapproche-t-il de la vérité ou nous en éloigne-t-il ?</em></p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Art ≠ Technique</td>
        <td style="padding:8px 12px;">La technique suit des règles reproductibles et vise l'utilité. L'art produit quelque chose d'unique qui ne peut pas être entièrement réduit à des règles — même si l'art suppose une technique maîtrisée.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Beau ≠ Agréable</td>
        <td style="padding:8px 12px;">Kant distingue le <em>beau</em> (jugement universel : « ceci est beau » vaut pour tous) de l'<em>agréable</em> (jugement subjectif : « ceci me plaît à moi »). L'art vise le beau, non le seul plaisir personnel.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Beau ≠ Sublime</td>
        <td style="padding:8px 12px;">Le <em>sublime</em> (Kant) produit un mélange de terreur et d'admiration face à ce qui dépasse nos facultés (une tempête, l'infini). Le beau harmonise ; le sublime bouleverse.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Art ≠ Imitation</td>
        <td style="padding:8px 12px;">Platon réduit l'art à une <em>mimèsis</em> (imitation du réel). Hegel et Kant s'y opposent : l'art ne copie pas le réel, il l'interprète et le dépasse pour exprimer une vérité que la nature seule ne peut livrer.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Platon</td>
        <td style="padding:8px 12px;width:38%;"><strong>L'art est mensonge et illusion.</strong> Il imite les apparences du monde sensible, lui-même déjà copie du monde des Idées. L'art est donc une copie de copie, qui éloigne de la vérité.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ L'artiste est dangereux pour la cité car il flatte les passions au lieu d'éduquer la raison.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Aristote</td>
        <td style="padding:8px 12px;"><strong>L'art purifie les passions.</strong> La tragédie produit une <em>catharsis</em> : en représentant des passions violentes, elle permet au spectateur de les ressentir puis de s'en libérer. L'art a donc une fonction thérapeutique et morale.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Contrairement à Platon, l'art est bénéfique pour la cité et l'individu.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Kant</td>
        <td style="padding:8px 12px;"><strong>L'art est l'expression du génie.</strong> Le beau artistique est produit par un génie qui donne des règles à la nature. Le jugement esthétique est universel sans concept : on dit « c'est beau » en prétendant que tous devraient l'approuver, sans pouvoir le démontrer.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ L'art réconcilie sensibilité et raison, liberté et nature.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Hegel</td>
        <td style="padding:8px 12px;"><strong>L'art est une manifestation de l'Esprit.</strong> L'œuvre d'art donne une forme sensible à des idées spirituelles universelles. Mais la philosophie dépasse l'art en accédant à ces vérités par le concept pur : l'art est donc un moment dépassé de l'Esprit absolu.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Thèse de la « fin de l'art » : l'art moderne perd sa puissance spirituelle.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Nietzsche</td>
        <td style="padding:8px 12px;"><strong>L'art est la plus haute affirmation de la vie.</strong> Contre Hegel, Nietzsche affirme que l'art n'est pas dépassé : il est le seul antidote au nihilisme. L'art tragique (apollinien + dionysiaque) donne sens à l'existence en assumant la souffrance.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « Nous avons l'art pour ne pas mourir de la vérité. »</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Platon <span style="font-weight:normal;color:#888;font-size:13px;">— La République, Livre X (env. 380 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'art est <em>mimèsis</em> : imitation de l'apparence, copie de copie, éloignement de la vérité.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Est-ce représenter ce qui est tel qu'il est, ou ce qui paraît tel qu'il paraît ? »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Aristote <span style="font-weight:normal;color:#888;font-size:13px;">— La Poétique (env. 335 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">La tragédie produit une <em>catharsis</em> : purification des passions par leur représentation.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« La tragédie est l'imitation d'une action noble […] qui, par la pitié et la crainte, accomplit la purification de telles passions. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Kant <span style="font-weight:normal;color:#888;font-size:13px;">— Critique de la faculté de juger (1790)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le beau est universel sans concept. Le génie donne des règles à l'art comme la nature en donne au vivant.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Est beau ce qui plaît universellement sans concept. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Hegel <span style="font-weight:normal;color:#888;font-size:13px;">— Esthétique (1835, posthume)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'art donne une forme sensible à l'Esprit absolu. Il est une étape vers la philosophie, qui le dépasse.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« L'art est pour nous chose du passé. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Nietzsche <span style="font-weight:normal;color:#888;font-size:13px;">— La Naissance de la tragédie (1872)</span></div>
        <div style="margin:6px 0;font-size:14px;">L'art est la réponse à la souffrance de l'existence. Il unit l'apollinien (forme, mesure) et le dionysiaque (ivresse, chaos).</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Nous avons l'art pour ne pas mourir de la vérité. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">L'art peut-il nous apprendre quelque chose sur le monde ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Platon (non) / Aristote, Hegel (oui) / Nietzsche (autrement)</td>

      <tr>
        <td style="padding:8px 12px;font-weight:bold;">L'art a-t-il une fonction morale ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Platon (danger moral) / Aristote (catharsis morale) / Kant (morale et beau liés)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">Le beau est-il subjectif ou objectif ?</td>

        <td style="padding:8px 12px;color:#555;">Kant (universel sans concept) / Hume (goût subjectif) / Hegel (objectif, esprit)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">L'art est-il un simple divertissement ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Platon, Aristote, Hegel, Nietzsche</td>
      </tr>
    </table>

</div>`

      {
        id:"bonheur",
        title:"Le bonheur",
        classe:"ia",
        content:`
<div style="font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text);max-width:760px;">

  <!-- ═══════════ 1. DÉFINITION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #c0392b;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#c0392b;margin-bottom:8px;">DÉFINITION</div>
    <p style="margin:0;">Le <strong>bonheur</strong> désigne un état de satisfaction complète, durable et global — distinct du simple plaisir (fugace et partiel) ou de la joie (intense mais passagère). Toute la question philosophique est de savoir si cet état est <em>accessible</em>, et si oui, à quelles conditions : dépend-il de nous ou des circonstances extérieures ?</p>
  </div>

  <!-- ═══════════ 2. DISTINCTIONS ESSENTIELLES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #e67e22;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#e67e22;margin-bottom:12px;">DISTINCTIONS ESSENTIELLES — pièges à éviter</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;width:30%;">Bonheur ≠ Plaisir</td>
        <td style="padding:8px 12px;">Le plaisir est ponctuel et relatif à un objet précis. Le bonheur est un état global et durable. On peut ressentir du plaisir sans être heureux, et être heureux sans ressentir un plaisir particulier à un instant donné.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Bonheur ≠ Chance</td>
        <td style="padding:8px 12px;">Le bonheur au sens philosophique n'est pas un coup de chance (même si l'étymologie du mot français vient de « bon heur » = bonne fortune). Aristote, Épicure et les stoïciens défendent tous que le bonheur peut être <em>construit</em> par la raison et la vertu.</td>
      </tr>
      <tr style="background:#e67e2215;">
        <td style="padding:8px 12px;font-weight:bold;">Bonheur ≠ Devoir moral</td>
        <td style="padding:8px 12px;">Pour Kant, le bonheur ne peut pas être le fondement de la morale car chacun le conçoit différemment. Le devoir moral est universel ; le bonheur est individuel. On ne doit pas agir pour être heureux, mais par respect de la loi morale — même si Kant admet que le bonheur reste une aspiration légitime.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Eudaimonia ≠ Hédonisme</td>
        <td style="padding:8px 12px;">L'<em>eudaimonia</em> aristotélicienne (accomplissement vertueux) diffère de l'hédonisme (recherche du plaisir comme fin). Épicure n'est pas hédoniste au sens vulgaire : il préconise la <em>modération</em> des plaisirs et l'ataraxie (paix de l'âme), non la jouissance effrénée.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 3. GRANDES THÈSES EN TENSION ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #2980b9;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#2980b9;margin-bottom:12px;">GRANDES THÈSES EN TENSION</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;width:22%;">Aristote</td>
        <td style="padding:8px 12px;width:38%;"><strong>Le bonheur est le souverain Bien.</strong> L'<em>eudaimonia</em> est la fin ultime de toute action humaine. Elle s'atteint par une vie conforme à la raison et à la vertu, dans la durée — et suppose aussi des conditions matérielles minimales.</td>
        <td style="padding:8px 12px;width:40%;color:#555;font-style:italic;">→ Le bonheur est actif, pas un état passif : c'est une <em>activité</em> de l'âme.</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Épicure</td>
        <td style="padding:8px 12px;"><strong>Le bonheur est l'absence de trouble.</strong> L'<em>ataraxie</em> (paix de l'âme) et l'<em>aponie</em> (absence de douleur corporelle) suffisent. Épicure distingue les désirs naturels et nécessaires (manger, boire), les désirs naturels mais non nécessaires (raffinements), et les désirs vains (richesse, gloire) — il faut satisfaire les premiers, modérer les seconds, rejeter les troisièmes.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Le bonheur est accessible et dépend de nous — c'est une philosophie de la sobriété heureuse.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Les Stoïciens (Épictète, Marc Aurèle)</td>
        <td style="padding:8px 12px;"><strong>Le bonheur dépend uniquement de nous.</strong> Il faut distinguer ce qui dépend de nous (nos jugements, nos désirs, nos actions) de ce qui n'en dépend pas (le corps, la réputation, la richesse). Le bonheur est dans l'acceptation sereine de ce qu'on ne peut pas changer.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ La liberté intérieure est totale même dans l'esclavage physique (Épictète était esclave).</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Kant</td>
        <td style="padding:8px 12px;"><strong>Le bonheur est un idéal de l'imagination.</strong> Personne ne peut définir exactement ce qui le rendrait heureux. Le bonheur ne peut donc pas fonder la morale. Il reste une aspiration légitime, mais doit être subordonné au devoir.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ « Le souverain Bien » kantien : être digne d'être heureux en agissant moralement, puis espérer le bonheur.</td>
      </tr>
      <tr style="background:#2980b915;">
        <td style="padding:8px 12px;font-weight:bold;">Pascal</td>
        <td style="padding:8px 12px;"><strong>Le bonheur terrestre est illusoire.</strong> Les hommes fuient leur condition misérable par le <em>divertissement</em> — ils s'agitent pour ne pas penser à leur finitude. Le vrai bonheur ne peut venir que de Dieu.</td>
        <td style="padding:8px 12px;color:#555;font-style:italic;">→ Utile pour nuancer toute vision trop optimiste du bonheur humain.</td>
      </tr>
    </table>
  </div>

  <!-- ═══════════ 4. AUTEURS ET CITATIONS CLÉS ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #27ae60;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#27ae60;margin-bottom:12px;">AUTEURS ET CITATIONS CLÉS</div>
    <div style="display:flex;flex-direction:column;gap:12px;">

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Aristote <span style="font-weight:normal;color:#888;font-size:13px;">— Éthique à Nicomaque (env. 335 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le bonheur est la fin ultime de toute action humaine, atteint par la vertu et la vie conforme à la raison.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le bonheur est une activité de l'âme conforme à la vertu. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Épicure <span style="font-weight:normal;color:#888;font-size:13px;">— Lettre à Ménécée (env. 300 av. J.-C.)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le bonheur est l'ataraxie : paix de l'âme obtenue par la maîtrise des désirs et la philosophie.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Il n'est jamais trop tôt ni trop tard pour prendre soin de son âme. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Épictète <span style="font-weight:normal;color:#888;font-size:13px;">— Manuel (IIe siècle)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le bonheur ne dépend que de ce qui est en notre pouvoir : nos jugements et nos désirs, non les événements extérieurs.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Il y a des choses qui dépendent de nous et d'autres qui n'en dépendent pas. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Kant <span style="font-weight:normal;color:#888;font-size:13px;">— Fondements de la métaphysique des mœurs (1785)</span></div>
        <div style="margin:6px 0;font-size:14px;">Le bonheur est un idéal de l'imagination : chacun le conçoit différemment, il ne peut fonder la morale universelle.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Le bonheur est un idéal non de la raison, mais de l'imagination. »</div>
      </div>

      <div style="border:1px solid #ddd;border-radius:8px;padding:12px 16px;">
        <div style="font-weight:bold;font-size:15px;">Pascal <span style="font-weight:normal;color:#888;font-size:13px;">— Pensées (1670, posthume)</span></div>
        <div style="margin:6px 0;font-size:14px;">Les hommes fuient leur condition par le divertissement ; le vrai bonheur reste hors de portée sans Dieu.</div>
        <div style="background:#f9f9f9;padding:8px 12px;border-radius:6px;font-style:italic;font-size:14px;color:#333;">« Tout le malheur des hommes vient d'une seule chose, qui est de ne savoir pas demeurer en repos dans une chambre. »</div>
      </div>

    </div>
  </div>

  <!-- ═══════════ 5. PROBLÉMATIQUES TYPES ═══════════ -->
  <div style="background:var(--card-bg);border-left:4px solid #8e44ad;border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:bold;letter-spacing:1px;color:#8e44ad;margin-bottom:12px;">PROBLÉMATIQUES TYPES</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;width:48%;">Le bonheur est-il le but de la vie ?</td>
        <td style="padding:8px 12px;width:22%;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Aristote (oui) / Kant (non, le devoir prime) / Nietzsche (la puissance, pas le bonheur)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Le bonheur dépend-il de nous ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Épictète (oui) / Aristote (en partie) / Pascal (non, condition humaine misérable)</td>
      </tr>
      <tr style="background:#8e44ad15;">
        <td style="padding:8px 12px;font-weight:bold;">Le bonheur est-il compatible avec la morale ?</td>
        <td style="padding:8px 12px;color:#555;">Plan thématique</td>
        <td style="padding:8px 12px;color:#555;">Kant (tension) / Aristote (vertu = bonheur) / Mill (utilité = maximiser le bonheur collectif)</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:bold;">Peut-on être heureux sans être libre ?</td>
        <td style="padding:8px 12px;color:#555;">Plan dialectique</td>
        <td style="padding:8px 12px;color:#555;">Épictète / Kant / Rousseau</td>
      </tr>
    </table>
  </div>

</div>`
